<svg width="160" height="176" viewBox="0 0 160 176" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sierra Estates">
  <defs>
    <linearGradient id="se-shield" x1="0" y1="0" x2="0" y2="176" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16294a"/>
      <stop offset="1" stop-color="#0a1526"/>
    </linearGradient>
    <linearGradient id="se-gold" x1="20" y1="0" x2="150" y2="176" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e9d18d"/>
      <stop offset="0.5" stop-color="#d4a72f"/>
      <stop offset="1" stop-color="#a67a22"/>
    </linearGradient>
  </defs>

  <!-- Shield outer (gold border) -->
  <path d="M80 4 L150 26 V92 C150 132 118 160 80 172 C42 160 10 132 10 92 V26 Z" fill="url(#se-gold)"/>
  <!-- Shield inner (navy) -->
  <path d="M80 16 L139 34 V91 C139 125 112 149 80 160 C48 149 21 125 21 91 V34 Z" fill="url(#se-shield)"/>

  <!-- Skyline -->
  <g fill="#d3ddec">
    <rect x="52" y="66" width="16" height="52" rx="1.5"/>
    <rect x="72" y="42" width="18" height="76" rx="1.5" fill="#eef2f8"/>
    <rect x="94" y="58" width="15" height="60" rx="1.5"/>
  </g>
  <!-- Windows (gold) -->
  <g fill="#d4a72f">
    <rect x="56" y="72" width="8" height="4" rx="1"/>
    <rect x="56" y="82" width="8" height="4" rx="1"/>
    <rect x="77" y="50" width="8" height="4" rx="1"/>
    <rect x="77" y="60" width="8" height="4" rx="1"/>
    <rect x="77" y="70" width="8" height="4" rx="1"/>
    <rect x="97" y="64" width="8" height="4" rx="1"/>
    <rect x="97" y="74" width="8" height="4" rx="1"/>
  </g>
  <!-- House roof -->
  <path d="M40 96 L58 82 L76 96 Z" fill="#eef2f8"/>
  <rect x="47" y="96" width="9" height="7" rx="1" fill="#d4a72f"/>

  <!-- Rising arrow -->
  <path d="M34 128 C60 120 92 108 118 74 L112 66 L130 62 L128 82 L122 76 C96 112 62 126 36 134 Z" fill="url(#se-gold)"/>
</svg>
