apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sierra-estates-realty-ingress
  namespace: sierra-estates
  labels:
    app.kubernetes.io/name: sierra-estates-realty
    app.kubernetes.io/part-of: sierra-estates-platform
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  tls:
    - hosts:
        - sierra-estates.net
        - www.sierra-estates.net
      secretName: sierra-estates-tls
  rules:
    - host: sierra-estates.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sierra-estates-realty-svc
                port:
                  number: 80
    - host: www.sierra-estates.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sierra-estates-realty-svc
                port:
                  number: 80
