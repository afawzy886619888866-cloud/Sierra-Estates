apiVersion: apps/v1
kind: Deployment
metadata:
  name: sierra-estates-realty
  namespace: sierra-estates
  labels:
    app.kubernetes.io/name: sierra-estates-realty
    app.kubernetes.io/part-of: sierra-estates-platform
    app.kubernetes.io/component: frontend-backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: sierra-estates-realty
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sierra-estates-realty
        app.kubernetes.io/part-of: sierra-estates-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/api/health"
        prometheus.io/port: "3000"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - sierra-estates-realty
                topologyKey: kubernetes.io/hostname
      containers:
        - name: app
          image: ghcr.io/afawzy886619888866-cloud/sierra-estates:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: sierra-estates-config
            - secretRef:
                name: sierra-estates-secrets
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
