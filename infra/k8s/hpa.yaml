apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sierra-estates-realty-hpa
  namespace: sierra-estates
  labels:
    app.kubernetes.io/name: sierra-estates-realty
    app.kubernetes.io/part-of: sierra-estates-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sierra-estates-realty
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
