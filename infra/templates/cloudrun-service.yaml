apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: sierra-ai-orchestrator
  labels:
    cloud.googleapis.com/location: europe-west1
    app: sierra-estates-orchestrator
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "false"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: gcr.io/sierra-estates-prod/ai-orchestrator:latest
          resources:
            limits:
              memory: 2Gi
              cpu: 2000m
          ports:
            - name: http1
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: GOOGLE_CLOUD_PROJECT
              value: "sierra-estates-prod"
            - name: AI_ORCHESTRATOR_LOG_LEVEL
              value: "info"
