name: WhatsApp Owner Outreach

# Run WhatsApp Owner Outreach directly via GitHub Actions (no AWS EC2 required).
# Can be run manually on-demand (with dry_run=true preview or dry_run=false live),
# or scheduled automatically on Cairo business hours (10:00 - 20:00 Cairo = 08:00 - 18:00 UTC).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (simulation only, touches nothing)'
        required: true
        type: boolean
        default: false
      batch_size:
        description: 'Number of candidates to contact in this slot'
        required: false
        default: '25'
        type: string
      host_side:
        description: 'Walk direction across inventory sheet'
        required: false
        default: 'split'
        type: choice
        options:
          - split
          - top
          - bottom
  schedule:
    # Runs every 30 minutes between 08:00 and 18:00 UTC (10:00 - 20:00 Cairo)
    - cron: '*/30 8-18 * * *'

permissions:
  contents: read

concurrency:
  group: whatsapp-owner-outreach
  cancel-in-progress: false

jobs:
  outreach:
    name: WhatsApp Outreach (${{ github.event_name == 'schedule' && 'Scheduled' || (inputs.dry_run && 'Simulation' || 'Live Send') }})
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run Owner Outreach Workflow
        env:
          # Operational Parameters
          WF_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          WF_SLOT_BATCH: ${{ inputs.batch_size || '25' }}
          WF_HOST_SIDE: ${{ inputs.host_side || 'split' }}
          
          # Target Sheet
          UNITS_SHEET_ID: ${{ vars.UNITS_SHEET_ID || '1g9GIcCM0slC5QplgzatZRxU46O_N4CR2jgDp9DeMYZk' }}
          UNITS_SHEET_GID: ${{ vars.UNITS_SHEET_GID || '1127958606' }}

          # Supabase Dedupe & Audit Ledger
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL || 'https://gaxfqcietzoonlmatiot.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          # WhatsApp Gateway Connectivity
          WHATSAPP_API_URL: ${{ secrets.WHATSAPP_API_URL || vars.WHATSAPP_GATEWAY_URL || vars.WHATSAPP_API_URL || 'http://54.89.162.250:2785' }}
          WHATSAPP_API_TOKEN: ${{ secrets.WHATSAPP_API_TOKEN || secrets.WHATSAPP_GATEWAY_TOKEN || secrets.OPENWA_OPERATOR_KEY }}
          OPENWA_SESSION_ID: ${{ secrets.OPENWA_SESSION_ID || vars.OPENWA_SESSION_ID || '9fbfb682-2fa8-44aa-9af0-35bb23ea80dd' }}
          OPENWA_SESSION_IDS: ${{ secrets.OPENWA_SESSION_IDS || vars.OPENWA_SESSION_IDS }}
        run: |
          echo "======================================================="
          echo "🚀 Starting WhatsApp Owner Outreach from GitHub Actions"
          echo "Mode: WF_DRY_RUN=${WF_DRY_RUN}"
          echo "Slot Batch: ${WF_SLOT_BATCH}"
          echo "Direction: ${WF_HOST_SIDE}"
          echo "======================================================="
          node workflows/09-owner-outreach/outreach.js
