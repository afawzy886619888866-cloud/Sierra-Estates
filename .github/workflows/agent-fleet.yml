# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Production agent fleet

on:
  workflow_dispatch:
    inputs:
      task:
        description: Agent task to execute
        required: true
        type: choice
        options:
          - briefing:daily
          - openclaw:task
          - vertex-agent
          - run-harness
          - sync-propertyfinder
          - fleet:run-all
      prompt:
        description: Prompt for vertex-agent or openclaw:task
        required: false
        type: string
  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: production-agent-fleet
  cancel-in-progress: false

permissions:
  contents: read

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
  SBR_SECRET_KEY: ${{ secrets.SBR_SECRET_KEY }}
  CRON_SECRET: ${{ secrets.CRON_SECRET }}
  GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY || secrets.GEMINI_API_KEY }}
  GOOGLE_GENAI_API_KEY: ${{ secrets.GOOGLE_GENAI_API_KEY || secrets.GOOGLE_AI_API_KEY }}
  PROPERTY_FINDER_API_KEY: ${{ secrets.PROPERTY_FINDER_API_KEY }}
  PROPERTY_FINDER_API_SECRET: ${{ secrets.PROPERTY_FINDER_API_SECRET }}
  PROPERTY_FINDER_JWT_TOKEN: ${{ secrets.PROPERTY_FINDER_JWT_TOKEN }}
  GOOGLE_CLOUD_PROJECT: 'sierra-estates-core'
  GOOGLE_CLOUD_LOCATION: 'europe-west1'

jobs:
  run:
    name: Execute production agent task
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate production backend
        run: |
          pnpm check:backend
          pnpm check:public-env
          pnpm check:legacy-runtime
          pnpm deploy:check:env

      - name: Resolve task
        id: task
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TASK: ${{ inputs.task }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            echo "name=briefing:daily" >> "$GITHUB_OUTPUT"
          else
            echo "name=${INPUT_TASK}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run selected agent task
        env:
          TASK: ${{ steps.task.outputs.name }}
          PROMPT: ${{ inputs.prompt }}
        run: |
          case "$TASK" in
            briefing:daily)
              pnpm briefing:daily
              ;;
            openclaw:task)
              test -n "$PROMPT" || { echo "::error::A prompt is required for openclaw:task"; exit 1; }
              pnpm openclaw:task "$PROMPT"
              ;;
            vertex-agent)
              test -n "$PROMPT" || { echo "::error::A prompt is required for vertex-agent"; exit 1; }
              pnpm vertex-agent "$PROMPT"
              ;;
            run-harness)
              pnpm run-harness
              ;;
            sync-propertyfinder)
              pnpm sync-propertyfinder
              ;;
            fleet:run-all)
              pnpm fleet:run-all
              ;;
            *)
              echo "::error::Unsupported agent task: $TASK"
              exit 1
              ;;
          esac
