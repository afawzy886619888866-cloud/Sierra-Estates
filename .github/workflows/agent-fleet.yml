name: Production agent fleet

# On-demand and daily scheduled execution of the 4-Engine production agent fleet
# (daily briefing + 4-Engine orchestration cycle + Property Finder Atlas v1 sync +
# DeepSeek harness eval + operational thresholds). Pinned by
# __tests__/actions-and-workflows.test.ts:
#   • must validate the canonical backend before any fleet task runs,
#   • tasks are selected EXPLICITLY (no blanket "run everything"),
#   • a fleet run is never cancelled mid-flight (cancel-in-progress: false).

on:
  workflow_dispatch:
    inputs:
      tasks:
        description: 'Fleet tasks to run (comma-separated from the fleet:run-all chain)'
        required: false
        default: 'briefing:daily,automation:cycle,check-thresholds'
        type: string
  schedule:
    # 06:45 UTC = 08:45 Cairo — ahead of the 09:00 Cairo morning dispatch.
    - cron: '45 6 * * *'

permissions:
  contents: read

concurrency:
  group: agent-fleet
  cancel-in-progress: false

jobs:
  fleet:
    name: Run selected agent fleet tasks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false  # repo has no active submodules; prevents ghost-submodule fetch failures

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Validate canonical backend before any fleet task
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL || 'https://gaxfqcietzoonlmatiot.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          pnpm check:backend
          pnpm check:legacy-runtime

      - name: Run explicitly selected fleet tasks
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL || 'https://gaxfqcietzoonlmatiot.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL || 'https://gaxfqcietzoonlmatiot.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROPERTY_FINDER_API_KEY: ${{ secrets.PROPERTY_FINDER_API_KEY }}
          PROPERTY_FINDER_API_SECRET: ${{ secrets.PROPERTY_FINDER_API_SECRET }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CLINE_API_KEY: ${{ secrets.CLINE_API_KEY || secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          TASKS="${{ inputs.tasks || 'briefing:daily,automation:cycle,check-thresholds' }}"
          echo "Fleet tasks requested: $TASKS"
          case "$TASKS" in
            *fleet:run-all*)
              # The full chain — only on explicit request.
              pnpm fleet:run-all
              ;;
            *)
              IFS=',' read -ra task_list <<< "$TASKS"
              for task in "${task_list[@]}"; do
                task=$(echo "$task" | xargs)
                case "$task" in
                  briefing:daily|sync-propertyfinder|export:propertyfinder|pf:publish:owners|pf:publish:ads|harvest:photos|automation:cycle|vertex-agent|run-harness|deepseek:reason|deepseek:eval|deepseek:develop|check-thresholds|openclaw:task|cline:audit|cline:hygiene|cline:docs-sync|cline:check)
                    echo "→ pnpm $task"
                    pnpm "$task"
                    ;;
                  *)
                    echo "::error::Unknown fleet task '$task' — tasks must be selected explicitly from the fleet:run-all chain."
                    exit 1
                    ;;
                esac
              done
              ;;
          esac

      - name: Upload Property Finder XML feeds artifact (when generated)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: propertyfinder-xml-feeds
          if-no-files-found: ignore
          retention-days: 14
          path: |
            docs/drafts/propertyfinder/*.xml
