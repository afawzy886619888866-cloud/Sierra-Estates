name: Deploy admin retry (quota-window self-heal)

# WHY THIS EXISTS (2026-11-13): the Vercel free tier caps deploys at ~100/day
# per team ("api-deployments-free-per-day"). On 2026-11-13 the day's push
# activity exhausted the cap: admin first (04:48 UTC), then client too
# (06:57 UTC), so both projects ended the day with builds queued behind the
# quota while main moved ahead. The quota window resets within 24h; rather
# than requiring a human to notice and re-run the deploy, this workflow
# retries the PRODUCTION deploy daily until BOTH projects catch up.
#
# HOW IT STOPS: the retry gate (first job) compares main HEAD with the latest
# production deployment commit of BOTH the admin and client projects. When
# both match — i.e. the retries succeeded — the schedule disables itself for
# good (gh api PATCH state).
#
# SAFETY: production deploys stay behind the deploy-vercel.yml CI gate —
# this workflow only calls workflow_dispatch on it with target_env:
# production and NO emergency_override, so nothing deploys without a green
# ci.yml run for the exact SHA (same rule as any manual dispatch).

on:
  schedule:
    # 05:12 UTC daily — just after the free-tier daily quota window resets
    # (observed reset time for the 2026-11-13 exhaustion). 17 minutes past
    # the hour avoids the top-of-hour GitHub cron congestion.
    - cron: "12 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write  # to read workflow runs + disable this schedule when done

concurrency:
  group: deploy-admin-retry
  cancel-in-progress: false

jobs:
  gate:
    name: Are admin and client both current?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      head: ${{ steps.check.outputs.head }}
    steps:
      - name: Compare main HEAD with both live builds
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          HEAD_SHA=$(gh api "repos/${{ github.repository }}/branches/main" --jq '.commit.sha')
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "main HEAD: $HEAD_SHA"

          # What commit is each live site serving? The deployed apps do not
          # expose a version route, so use Vercel's API for each project's
          # latest production deployment meta.
          VERCEL_TOKEN_VALUE="${{ secrets.VERCEL_TOKEN }}"
          [ -z "$VERCEL_TOKEN_VALUE" ] && VERCEL_TOKEN_VALUE="${{ secrets.VERCEL_AUTH_TOKEN }}"

          check_project() {
            local role="$1" project_id="$2"
            local deployed
            deployed=$(curl -sS "https://api.vercel.com/v6/deployments?projectId=${project_id}&limit=1&target=production" \
              -H "Authorization: Bearer $VERCEL_TOKEN_VALUE" \
              | jq -r '.deployments[0].meta.githubCommitSha // .deployments[0].meta.gitlabCommitSha // empty')
            echo "${role} latest production deployment commit: ${deployed:-unknown}"
            if [ -n "$deployed" ] && [ "$deployed" = "$HEAD_SHA" ]; then
              return 0  # current
            else
              return 1  # behind (or meta unknown)
            fi
          }

          ADMIN_CURRENT=false
          CLIENT_CURRENT=false
          if check_project admin "prj_inhTu8kppYhQv2NZZV3GTUdU8uBi"; then ADMIN_CURRENT=true; fi
          if check_project client "prj_ieVcIcoeTtHndspXMzlE0cwLl89c"; then CLIENT_CURRENT=true; fi
          echo "admin current: $ADMIN_CURRENT | client current: $CLIENT_CURRENT"

          if [ "$ADMIN_CURRENT" = "true" ] && [ "$CLIENT_CURRENT" = "true" ]; then
            echo "both projects are already serving main HEAD — standing down."
            # Self-disable: no more scheduled retries needed.
            gh api -X PATCH "repos/${{ github.repository }}/actions/workflows/deploy-admin-retry.yml" \
              -f state=disabled 2>/dev/null \
              || gh workflow disable "Deploy admin retry (quota-window self-heal)" -R "${{ github.repository }}" || true
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            # Unknown deployment meta also lands here — retrying is harmless:
            # the deploy stays behind the CI gate and self-disables on success.
            echo "at least one project is behind main (or meta unknown) — dispatching a gated production deploy retry."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  retry:
    name: Dispatch gated production deploy
    needs: [gate]
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger deploy-vercel (production, CI-gated)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run deploy-vercel.yml \
            -R "${{ github.repository }}" \
            --ref main \
            -f target_env=production \
            -f emergency_override=false \
            -f env_sync_only=false
          echo "deploy-vercel dispatched (target_env=production). Its CI gate still requires a green ci.yml for the exact SHA."
