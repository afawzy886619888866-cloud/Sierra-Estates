name: "CodeQL Security Scan"

# Runs weekly on a schedule only — NOT on every push/PR, to preserve
# GitHub Free-plan minute quota. SAST scanning is still performed for
# all JavaScript/TypeScript code automatically by CodeQL's autobuild.

on:
  schedule:
    - cron: '28 21 * * 0'   # Sunday 21:28 UTC — weekly
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  security-events: write
  packages: read
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
