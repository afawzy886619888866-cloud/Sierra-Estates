name: CodeQL Security Scan

# Static security analysis over the JavaScript/TypeScript surface.
# Pinned by __tests__/actions-and-workflows.test.ts (must exist, must define
# an explicit permissions block).

on:
  workflow_dispatch:
  schedule:
    # Weekly, Sunday 03:30 UTC — off-peak for the Cairo working day.
    - cron: '30 3 * * 0'

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'
