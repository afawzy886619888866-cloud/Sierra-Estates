name: Harness Evaluation Suite

on:
  push:
    branches:
      - main
      - 'harness-**'
      - 'feat/**'
  pull_request:
    branches:
      - main

jobs:
  harness-eval:
    name: Run DeepSeek Reasoning & AVM Harness
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Execute DeepSeek Harness Evaluation
        run: pnpm run harness:eval
        env:
          NODE_ENV: test
          DEEPSEEK_API_KEY: ${{ secrets['DEEPSEEK_API_KEY'] }}
