name: Cline CLI automation
# Recurring repository audits, hygiene scans, documentation synchronization,
# and custom workflows executed autonomously via the Cline CLI.

on:
  workflow_dispatch:
    inputs:
      preset:
        description: 'Predefined Cline task preset'
        required: true
        default: 'audit'
        type: choice
        options:
          - audit
          - hygiene
          - docs-sync
          - test-eval
          - security-scan
          - custom
      prompt:
        description: 'Custom prompt (used only if preset is set to custom)'
        required: false
        default: ''
        type: string
      plan:
        description: 'Run in plan mode (generate plan without executing changes)'
        required: false
        type: boolean
        default: false
  schedule:
    # Weekly audit & hygiene check every Monday at 05:00 UTC (07:00 Cairo)
    - cron: '0 5 * * 1'

permissions:
  contents: read

concurrency:
  group: cline-automation
  cancel-in-progress: false

jobs:
  cline-task:
    name: Execute Cline autonomous workflow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Validate canonical backend & runtime boundaries
        run: |
          pnpm check:backend
          pnpm check:legacy-runtime

      - name: Install Cline CLI
        run: npm install -g cline@3.0.73

      - name: Verify Cline CLI installation
        run: pnpm cline:check

      - name: Run Cline workflow
        env:
          CLINE_API_KEY: ${{ secrets.CLINE_API_KEY || secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INPUT_PRESET: ${{ inputs.preset || 'audit' }}
          INPUT_PROMPT: ${{ inputs.prompt || '' }}
          INPUT_PLAN: ${{ inputs.plan }}
        run: |
          PRESET="${INPUT_PRESET}"
          PLAN_FLAG=""
          if [ "${INPUT_PLAN}" = "true" ]; then
            PLAN_FLAG="--plan"
          fi

          if [ "${PRESET}" = "custom" ]; then
            if [ -z "${INPUT_PROMPT}" ]; then
              echo "::error::Custom preset selected but prompt was empty."
              exit 1
            fi
            echo "Running custom prompt: ${INPUT_PROMPT}"
            node scripts/run-cline-task.mjs --prompt "${INPUT_PROMPT}" --yolo ${PLAN_FLAG}
          else
            echo "Running preset: ${PRESET}"
            node scripts/run-cline-task.mjs --preset "${PRESET}" --yolo ${PLAN_FLAG}
          fi
