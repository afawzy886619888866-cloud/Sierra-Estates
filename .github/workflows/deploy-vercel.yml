name: Deploy Vercel (Client + Admin)

# CI-GATED PRODUCTION DEPLOYMENT
#
# Contract pinned by __tests__/deployment.test.ts and
# __tests__/actions-and-workflows.test.ts:
#   • production deploys run only after a successful CI workflow on main (or
#     an audited emergency_override),
#   • manually requested preview deploys bypass the production CI gate by
#     design,
#   • one deployment at a time (max-parallel: 1) with 429 backoff,
#   • separate client (sierra-estates.net) and admin
#     (admin.sierra-estates.net) Vercel projects from the same
#     apps/sierra-estates-realty codebase,
#   • credentials fail LOUDLY — never a silent skipped deploy.
#
# A workflow_run deployment checks out the exact commit CI validated. Do not
# change it to a pull-request trigger: this workflow has deployment secrets.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Deployment environment'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
      emergency_override:
        description: 'AUDIT: bypass the CI production gate (recorded in run log)'
        required: false
        default: false
        type: boolean
      env_sync_only:
        description: 'Only re-sync environment variables (no deploy — does not consume the Vercel deploy quota)'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  actions: read

concurrency:
  # Production releases share one queue. A newer green release supersedes an
  # obsolete in-progress release; preview runs remain isolated by ref.
  group: deploy-vercel-${{ github.event_name == 'workflow_run' && 'production' || github.ref }}
  cancel-in-progress: true

env:
  PUPPETEER_SKIP_DOWNLOAD: "true"
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
  TARGET_ENV: ${{ github.event_name == 'workflow_run' && 'production' || inputs.target_env || 'preview' }}

jobs:
  gate:
    name: CI gate (production) · audit + block
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
    steps:
      - name: Decide deployment authorization
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_SHA: ${{ github.sha }}
          ENV_SYNC_ONLY: ${{ inputs.env_sync_only || 'false' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TARGET_ENV="$TARGET_ENV"
          EMERGENCY_OVERRIDE="${{ inputs.emergency_override || 'false' }}"
          echo "TARGET_ENV=$TARGET_ENV" >> "$GITHUB_ENV"

          # workflow_run is privileged because it receives deployment secrets.
          # Only deploy a successful CI run for this repository's main branch,
          # and deploy that exact tested SHA below.
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ "$CI_CONCLUSION" = "success" ] && \
              [ "$CI_HEAD_BRANCH" = "main" ] && \
              [ "$CI_HEAD_REPOSITORY" = "${{ github.repository }}" ] && \
              [ -n "$CI_HEAD_SHA" ]; then
              echo "CI gate satisfied for tested main SHA $CI_HEAD_SHA."
              echo "proceed=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::CI workflow run is not an eligible successful main-branch run for this repository. Production deploy blocked."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          if [ "$ENV_SYNC_ONLY" = "true" ]; then
            # Env-var re-sync only: no artifact leaves the repo, so the
            # production CI gate does not apply (the values pushed are the
            # repository's own secrets/vars, not built code). Audited here.
            echo "::notice::env_sync_only dispatch — skipping deploy, re-syncing environment variables only."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$TARGET_ENV" = "preview" ]; then
            echo "CI production gate bypassed for preview environment — preview deploys never require the production CI gate (by design)."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EMERGENCY_OVERRIDE" = "true" ]; then
            echo "::warning::EMERGENCY_OVERRIDE — AUDIT ALERT: production deploy authorized by ${{ github.actor }} WITHOUT a green CI run. This line is the permanent audit record."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Manually requested production deploys must have a successful CI run
          # for the exact selected commit, not merely a newer green run on main.
          CONCLUSION=$(gh run list --workflow=ci.yml --repo "${{ github.repository }}" --branch "${{ github.ref_name }}" --commit "$DEPLOY_SHA" --limit 1 --json status,conclusion,headSha --jq '.[0] | "\(.status) \(.conclusion) \(.headSha)"' || echo "unknown unknown unknown")
          echo "Latest ci.yml run: $CONCLUSION"
          STATUS=$(echo "$CONCLUSION" | cut -d' ' -f1)
          RESULT=$(echo "$CONCLUSION" | cut -d' ' -f2)
          HEAD_SHA=$(echo "$CONCLUSION" | cut -d' ' -f3)
          if [ "$STATUS" = "completed" ] && [ "$RESULT" = "success" ] && [ "$HEAD_SHA" = "$DEPLOY_SHA" ]; then
            echo "CI gate satisfied — production deploy authorized."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::CI gate failed: ci.yml for '$DEPLOY_SHA' is '$STATUS/$RESULT/$HEAD_SHA'. Production deploy BLOCKED. Use emergency_override only for audited emergencies."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Vercel deploy · ${{ matrix.role }}
    needs: [gate]
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - role: client
            domain: sierra-estates.net
            projectId: prj_ieVcIcoeTtHndspXMzlE0cwLl89c
          - role: admin
            domain: admin.sierra-estates.net
            projectId: prj_inhTu8kppYhQv2NZZV3GTUdU8uBi
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          submodules: false  # repo has no active submodules; prevents ghost-submodule fetch failures

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify deployment credentials (fail loudly)
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] && [ -z "${{ secrets.VERCEL_AUTH_TOKEN }}" ]; then
            echo "::error::VERCEL_TOKEN or VERCEL_AUTH_TOKEN is required to deploy this repository. Configure either secret in repository settings — deploys must never silently skip."
            exit 1
          fi
          echo "Deployment credentials present for the ${{ matrix.role }} project."

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Deploy ${{ matrix.role }} project (${{ matrix.domain }})
        # env_sync_only dispatches skip the deploy entirely — env-var PATCHes
        # are not deployments and do not consume the Vercel deploy quota
        # (which is what blocks deploys on the free tier at >100/day).
        if: ${{ inputs.env_sync_only != true }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_UvdJ5ezVTaqEKyhqZ5QVqOKJ' }}
          VERCEL_PROJECT_ID: ${{ matrix.projectId }}
        run: |
          set -euo pipefail
          VERCEL_TOKEN_VALUE="${{ secrets.VERCEL_TOKEN }}"
          [ -z "$VERCEL_TOKEN_VALUE" ] && VERCEL_TOKEN_VALUE="${{ secrets.VERCEL_AUTH_TOKEN }}"
          # Environment variable categories synced to Vercel (see
          # scripts/sync-vercel-env.js for the canonical CLIENT_ENV_VARS /
          # ADMIN_ENV_VARS sets — the workflow re-syncs after deploy):
          #   Routing & URLs:        NEXT_PUBLIC_CLIENT_URL, NEXT_PUBLIC_ADMIN_URL
          #   Supabase backend:      NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY
          #   AI & LLMs:             GOOGLE_AI_API_KEY, GEMINI_API_KEY, DEEPSEEK_API_KEY
          #   Property Finder & AWS: PROPERTY_FINDER_API_KEY, AWS_ACCESS_KEY_ID
          #   Security:              SESSION_SECRET, SBR_SECRET_KEY, CRON_SECRET, ADMIN_API_KEY
          #   Communications:        TELEGRAM_BOT_TOKEN, WHATSAPP_API_TOKEN, SENDGRID_API_KEY
          ARGS=""
          if [ "$TARGET_ENV" = "production" ]; then ARGS="--prod"; fi
          attempt=1
          until npx --yes vercel@59.23.2 deploy $ARGS --token "$VERCEL_TOKEN_VALUE" --yes; do
            status=$?
            if [ $attempt -ge 5 ]; then
              echo "::error::Vercel deploy failed after $attempt attempts (last exit $status) for ${{ matrix.role }}."
              exit 1
            fi
            echo "Deploy attempt $attempt failed — backing off before retry (429 Rate limited protection: 30s, 60s, 120s, 240s)."
            sleep $((30 * 2 ** (attempt - 1)))
            attempt=$((attempt + 1))
          done

      - name: Re-sync environment variables to the ${{ matrix.role }} project
        # ALWAYS run — even when the deploy step failed (e.g. the free-tier
        # daily deploy quota, api-deployments-free-per-day). The env vars
        # must reach the project regardless; a failed deploy would otherwise
        # strand the project without its backend config, which is exactly
        # how production lost NEXT_PUBLIC_SUPABASE_URL on 2026-11-12.
        if: ${{ always() }}
        # The sync script reads its values from process.env (see
        # CLIENT_ENV_VARS / ADMIN_ENV_VARS) and silently skips any var that
        # is unset ('if (!value) continue;'). This step MUST therefore be
        # given the Supabase backend values — until 2026-11-12 it ran with
        # nothing but VERCEL_TOKEN, so NEXT_PUBLIC_SUPABASE_URL was never
        # re-synced and production ran without it (/api/health degraded,
        # /api/inventory empty).
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL || 'https://gaxfqcietzoonlmatiot.supabase.co' }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL || 'https://gaxfqcietzoonlmatiot.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          VERCEL_TOKEN_VALUE="${{ secrets.VERCEL_TOKEN }}"
          [ -z "$VERCEL_TOKEN_VALUE" ] && VERCEL_TOKEN_VALUE="${{ secrets.VERCEL_AUTH_TOKEN }}"
          # Fail loudly if the canonical backend values are absent — a sync
          # that silently skips Supabase is how production lost them.
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::Supabase backend env values are missing — refusing to run a sync that would silently skip them."
            exit 1
          fi
          # 429 Rate limited-aware: the script itself backs off with sleeps.
          VERCEL_TOKEN="$VERCEL_TOKEN_VALUE" node scripts/sync-vercel-env.js --role ${{ matrix.role }} || {
            echo "::warning::Env sync for ${{ matrix.role }} failed — deployment stands, re-run scripts/sync-vercel-env.js manually."
          }

      - name: Deployment summary
        if: always()
        run: |
          echo "### Deployment (${{ matrix.role }}) — ${{ matrix.domain }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: $TARGET_ENV" >> "$GITHUB_STEP_SUMMARY"
          echo "- Project: ${{ matrix.projectId }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- App: apps/sierra-estates-realty" >> "$GITHUB_STEP_SUMMARY"
