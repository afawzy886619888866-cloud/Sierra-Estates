name: Deploy · Vercel

# Deploys Sierra Estates to Vercel (Client and Admin projects):
#
#   ┌────────────────────────────┬──────────────────────────────────────┬─────────────────────────────┐
#   │ Job                        │ Vercel project                       │ Domain                      │
#   ├────────────────────────────┼──────────────────────────────────────┼─────────────────────────────┤
#   │ deploy (client)            │ CLIENT_VERCEL_PROJECT_ID             │ sierra-estates.net          │
#   │ deploy (admin)             │ ADMIN_VERCEL_PROJECT_ID              │ admin.sierra-estates.net    │
#   └────────────────────────────┴──────────────────────────────────────┴─────────────────────────────┘
#
#   Both build from the same source: apps/sierra-estates-realty (Next.js 16 App Router)
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions → Secrets):
#   VERCEL_TOKEN               — Vercel token with Projects R/W, Domains
#   SESSION_SECRET             — App session signing secret
#
# Required GitHub Variables (Settings → Secrets and variables → Actions → Variables):
#   VERCEL_ORG_ID              — Vercel team/org ID
#   CLIENT_VERCEL_PROJECT_ID   — prj_theA731k4WdFVhgd6DJUP6pAry6n
#   ADMIN_VERCEL_PROJECT_ID    — prj_NMqZUADX9A5ba22ylMfls2l7I0zX
#   NEXT_PUBLIC_FIREBASE_*     — Firebase public SDK configuration values

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy target'
        default: 'production'
        type: choice
        options:
          - production
          - preview

concurrency:
  group: vercel-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_CLI_VERSION: 'latest'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PUPPETEER_SKIP_DOWNLOAD: "true"
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
  NEXT_TELEMETRY_DISABLED: "1"

permissions:
  contents: read

jobs:
  deploy:
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: client
            domain: sierra-estates.net
            app_dir: apps/sierra-estates-realty
            framework: nextjs
            proj_id_secret: CLIENT_VERCEL_PROJECT_ID
          - role: admin
            domain: admin.sierra-estates.net
            app_dir: apps/sierra-estates-realty
            framework: nextjs
            proj_id_secret: ADMIN_VERCEL_PROJECT_ID
    name: deploy (${{ matrix.role }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── Resolve correct project ID & token for the role ──────────────────────
      - name: Resolve project ID & Vercel Token
        id: proj
        env:
          VARS_JSON: ${{ toJson(vars) }}
          SECRETS_JSON: ${{ toJson(secrets) }}
        run: |
          ORG_ID_RAW=$(echo "$VARS_JSON" | jq -r '.VERCEL_ORG_ID // empty')
          TOKEN=$(echo "$SECRETS_JSON" | jq -r '.VERCEL_TOKEN // .VERCEL_AUTH_TOKEN // empty')
          
          if [ "${{ matrix.role }}" = "admin" ]; then
            PROJ_RAW=$(echo "$VARS_JSON" | jq -r '.ADMIN_VERCEL_PROJECT_ID // .VERCEL_PROJECT_ID_ADMIN // empty')
            PROJ="${PROJ_RAW:-prj_W2gYCoKaS3oBcLDuGa9gB8z7cfnA}"
          else
            PROJ_RAW=$(echo "$VARS_JSON" | jq -r '.CLIENT_VERCEL_PROJECT_ID // .VERCEL_PROJECT_ID_CLIENT // empty')
            PROJ="${PROJ_RAW:-prj_theA731k4WdFVhgd6DJUP6pAry6n}"
          fi
          
          ORG_ID="${ORG_ID_RAW:-team_UvdJ5ezVTaqEKyhqZ5QVqOKJ}"

          # If VERCEL_TOKEN is unset, gracefully exit 0 with notice (native git integration handles deploys)
          if [ -z "$TOKEN" ]; then
            echo "::notice::VERCEL_TOKEN repo secret is not set — skipping CLI deployment step. Vercel native Git integration handles deployments."
            exit 0
          fi

          echo "VERCEL_ORG_ID=$ORG_ID"     >> $GITHUB_ENV
          echo "VERCEL_PROJECT_ID=$PROJ"   >> $GITHUB_ENV
          echo "ROLE_VERCEL_TOKEN=$TOKEN"  >> $GITHUB_ENV
          echo "proj_id=$PROJ"             >> "$GITHUB_OUTPUT"
          echo "✅ ${{ matrix.role }} → project $PROJ (org: $ORG_ID, domain: ${{ matrix.domain }})"

      - uses: actions/checkout@v7
        with:
          submodules: false   # repo has no active submodules; prevents ghost-submodule fetch failures

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine deploy environment
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ENV="production"
          else
            ENV="preview"
          fi
          echo "name=$ENV" >> "$GITHUB_OUTPUT"
          [ "$ENV" = "production" ] && echo "flag=--prod" >> "$GITHUB_OUTPUT" || echo "flag=" >> "$GITHUB_OUTPUT"

      # ── Set Vercel project settings for THIS role ─────────────────────────
      - name: Normalize Vercel project settings
        run: |
          # Vercel needs to know to build from apps/sierra-estates-realty
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X PATCH \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}" \
            -H "Authorization: Bearer $ROLE_VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"rootDirectory\":\"${{ matrix.app_dir }}\",\"framework\":\"${{ matrix.framework }}\",\"buildCommand\":null,\"installCommand\":\"pnpm install\",\"outputDirectory\":null,\"devCommand\":null}" || echo "000")
          if [ "$code" = "200" ] || [ "$code" = "204" ]; then
            echo "✅ Project normalized: rootDirectory=${{ matrix.app_dir }}, framework=${{ matrix.framework }}"
          else
            echo "::warning::Could not normalize project settings (HTTP $code). Check VERCEL_TOKEN scope."
          fi

      - name: Sync env vars to Vercel project
        env:
          VARS_JSON: ${{ toJson(vars) }}
          SECRETS_JSON: ${{ toJson(secrets) }}
        run: |
          FB_API_KEY=$(echo "$VARS_JSON" | jq -r '.NEXT_PUBLIC_FIREBASE_API_KEY // empty')
          FB_AUTH_DOMAIN=$(echo "$VARS_JSON" | jq -r '.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN // empty')
          FB_PROJECT_ID=$(echo "$VARS_JSON" | jq -r '.NEXT_PUBLIC_FIREBASE_PROJECT_ID // empty')
          FB_STORAGE=$(echo "$VARS_JSON" | jq -r '.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET // empty')
          FB_SENDER_ID=$(echo "$VARS_JSON" | jq -r '.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID // empty')
          FB_APP_ID=$(echo "$VARS_JSON" | jq -r '.NEXT_PUBLIC_FIREBASE_APP_ID // empty')
          FB_MEASUREMENT=$(echo "$VARS_JSON" | jq -r '.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID // empty')
          FB_DATABASE_URL=$(echo "$VARS_JSON" | jq -r '.NEXT_PUBLIC_FIREBASE_DATABASE_URL // empty')
          
          AI_KEY=$(echo "$SECRETS_JSON" | jq -r '.GOOGLE_AI_API_KEY // .GEMINI_API_KEY // empty')
          PF_KEY=$(echo "$SECRETS_JSON" | jq -r '.PROPERTY_FINDER_API_KEY // .PF_API_KEY // empty')
          PF_SECRET=$(echo "$SECRETS_JSON" | jq -r '.PROPERTY_FINDER_API_SECRET // .PF_API_SECRET // empty')
          AWS_KEY=$(echo "$SECRETS_JSON" | jq -r '.AWS_ACCESS_KEY_ID // empty')
          AWS_SEC=$(echo "$SECRETS_JSON" | jq -r '.AWS_SECRET_ACCESS_KEY // empty')
          SESSION_SECRET_VAL=$(echo "$SECRETS_JSON" | jq -r '.SESSION_SECRET // empty')
          SA_JSON=$(echo "$SECRETS_JSON" | jq -r '.FIREBASE_SERVICE_ACCOUNT_SIERRA_BLU // .FIREBASE_SERVICE_ACCOUNT_JSON // empty')

          SBR_SECRET=$(echo "$SECRETS_JSON" | jq -r '.SBR_SECRET_KEY // empty')
          TG_BOT_TOKEN=$(echo "$SECRETS_JSON" | jq -r '.NEXT_PUBLIC_TELEGRAM_BOT_TOKEN // empty')
          TG_BOT_USERNAME=$(echo "$VARS_JSON" | jq -r '.NEXT_PUBLIC_TELEGRAM_BOT_USERNAME // empty')
          SENDGRID_KEY=$(echo "$SECRETS_JSON" | jq -r '.SENDGRID_API_KEY // empty')
          SENDER_EMAIL_VAL=$(echo "$VARS_JSON" | jq -r '.SENDER_EMAIL // empty')
          DEFAULT_LOCALE=$(echo "$VARS_JSON" | jq -r '.NEXT_PUBLIC_DEFAULT_LOCALE // empty')
          APP_URL=$(echo "$VARS_JSON" | jq -r '.NEXT_PUBLIC_APP_URL // empty')
          ORIGINS=$(echo "$VARS_JSON" | jq -r '.ALLOWED_ORIGINS // empty')
          INT_OS_URL=$(echo "$VARS_JSON" | jq -r '.NEXT_PUBLIC_INTELLIGENCE_OS_URL // empty')
          TG_WEBHOOK_SECRET=$(echo "$SECRETS_JSON" | jq -r '.TELEGRAM_WEBHOOK_SECRET // empty')
          LEAD_WHATSAPP=$(echo "$SECRETS_JSON" | jq -r '.LEAD_NOTIFY_WHATSAPP_NUMBER // empty')
          CRON_SECRET_VAL=$(echo "$SECRETS_JSON" | jq -r '.CRON_SECRET // empty')
          OPENMEM_URL=$(echo "$VARS_JSON" | jq -r '.OPENMEMORY_URL // empty')

          upsert() {
            [ -n "$2" ] || { echo "  $1 (empty — skipped)"; return 0; }
            code=$(curl -sS -o /tmp/env-res.json -w '%{http_code}' -X POST \
              "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?teamId=${VERCEL_ORG_ID}&upsert=true" \
              -H "Authorization: Bearer $ROLE_VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"key\":\"$1\",\"value\":\"$2\",\"type\":\"${3:-plain}\",\"target\":[\"production\",\"preview\"]}" || echo "000")
            case "$code" in 200|201) echo "  $1 ✓";; *) echo "::warning::env $1 → HTTP $code $(cat /tmp/env-res.json 2>/dev/null || true)";; esac
          }

          # Routing & Domains
          upsert ADMIN_HOST              "admin.sierra-estates.net"
          upsert CLIENT_HOST             "sierra-estates.net"
          upsert COOKIE_DOMAIN           ".sierra-estates.net"
          upsert NEXT_PUBLIC_CLIENT_URL  "https://sierra-estates.net"
          upsert NEXT_PUBLIC_ADMIN_URL   "https://admin.sierra-estates.net"

          # Firebase Client SDK (fallback to canonical values if not in vars)
          upsert NEXT_PUBLIC_FIREBASE_API_KEY             "${FB_API_KEY:-AIzaSyBZLN2jTTKV34SneGPoWRz1zoRpX5uODjs}"
          upsert NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN         "${FB_AUTH_DOMAIN:-sierra-blu.firebaseapp.com}"
          upsert NEXT_PUBLIC_FIREBASE_PROJECT_ID          "${FB_PROJECT_ID:-sierra-blu}"
          upsert NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET      "${FB_STORAGE:-sierra-blu.firebasestorage.app}"
          upsert NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID "${FB_SENDER_ID:-941030513456}"
          upsert NEXT_PUBLIC_FIREBASE_APP_ID              "${FB_APP_ID:-1:941030513456:web:56209a1495d69f217086f5}"
          upsert NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID      "${FB_MEASUREMENT:-G-ZP054BPJ8Q}"
          upsert NEXT_PUBLIC_FIREBASE_DATABASE_URL        "${FB_DATABASE_URL:-https://sierra-blu-default-rtdb.firebaseio.com}"

          # AI & LLM & Memory
          upsert GOOGLE_AI_API_KEY                        "$AI_KEY" encrypted
          upsert GEMINI_API_KEY                           "$AI_KEY" encrypted
          upsert NEXT_PUBLIC_GEMINI_API_KEY               "$AI_KEY"
          upsert OPENMEMORY_URL                           "${OPENMEM_URL:-http://localhost:8080}"

          # Property Finder & AWS
          upsert PROPERTY_FINDER_API_KEY                  "$PF_KEY" encrypted
          upsert PROPERTY_FINDER_API_SECRET               "$PF_SECRET" encrypted
          upsert PF_API_KEY                               "$PF_KEY" encrypted
          upsert PF_API_SECRET                            "$PF_SECRET" encrypted
          upsert AWS_ACCESS_KEY_ID                        "$AWS_KEY" encrypted
          upsert AWS_SECRET_ACCESS_KEY                    "$AWS_SEC" encrypted
          upsert AWS_REGION                               "us-east-1"
          upsert FIREBASE_PROJECT_ID                      "sierra-blu"
          upsert FIREBASE_SERVICE_ACCOUNT_JSON            "$SA_JSON" encrypted
          upsert SESSION_SECRET                           "$SESSION_SECRET_VAL" encrypted
          upsert CRON_SECRET                              "$CRON_SECRET_VAL" encrypted

          # Other integrations and App Settings
          upsert SBR_SECRET_KEY                           "$SBR_SECRET" encrypted
          upsert NEXT_PUBLIC_TELEGRAM_BOT_TOKEN           "$TG_BOT_TOKEN" encrypted
          upsert NEXT_PUBLIC_TELEGRAM_BOT_USERNAME        "$TG_BOT_USERNAME"
          upsert SENDGRID_API_KEY                         "$SENDGRID_KEY" encrypted
          upsert SENDER_EMAIL                             "$SENDER_EMAIL_VAL"
          upsert NEXT_PUBLIC_DEFAULT_LOCALE               "${DEFAULT_LOCALE:-en}"
          upsert NEXT_PUBLIC_APP_URL                      "$APP_URL"
          upsert ALLOWED_ORIGINS                          "$ORIGINS"
          upsert NEXT_PUBLIC_INTELLIGENCE_OS_URL          "$INT_OS_URL"
          upsert TELEGRAM_WEBHOOK_SECRET                  "$TG_WEBHOOK_SECRET" encrypted
          upsert LEAD_NOTIFY_WHATSAPP_NUMBER              "$LEAD_WHATSAPP" encrypted

      - name: Remove crons from admin project (client project owns them)
        if: matrix.role == 'admin'
        run: |
          if [ -f "${{ matrix.app_dir }}/vercel.json" ]; then
            jq 'del(.crons)' "${{ matrix.app_dir }}/vercel.json" > /tmp/vercel.json
            mv /tmp/vercel.json "${{ matrix.app_dir }}/vercel.json"
            echo "crons stripped from admin vercel.json"
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@${VERCEL_CLI_VERSION}

      # ── Point vercel CLI at THIS role's project ONLY ──────────────────────
      - name: Write .vercel/project.json for this role
        run: |
          mkdir -p .vercel "${{ matrix.app_dir }}/.vercel"
          printf '{"projectId":"%s","orgId":"%s"}' "${VERCEL_PROJECT_ID}" "${VERCEL_ORG_ID}" \
            > .vercel/project.json
          printf '{"projectId":"%s","orgId":"%s"}' "${VERCEL_PROJECT_ID}" "${VERCEL_ORG_ID}" \
            > "${{ matrix.app_dir }}/.vercel/project.json"
          echo "✅ .vercel/project.json → ${VERCEL_PROJECT_ID}"

      - name: Pull Vercel project settings
        run: |
          vercel pull --yes --environment=${{ steps.target.outputs.name }} --token=$ROLE_VERCEL_TOKEN --cwd=${{ matrix.app_dir }}

      - name: Build
        run: |
          vercel build ${{ steps.target.outputs.flag }} --token=$ROLE_VERCEL_TOKEN --cwd=${{ matrix.app_dir }}

      - name: Deploy (prebuilt artifact)
        id: deploy_step
        run: |
          url=$(vercel deploy --prebuilt ${{ steps.target.outputs.flag }} --token=$ROLE_VERCEL_TOKEN --cwd=${{ matrix.app_dir }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### ✅ ${{ matrix.role }} deployed → $url" >> "$GITHUB_STEP_SUMMARY"
          echo "deployed: $url"

      - name: Attach production domain (${{ matrix.domain }})
        if: steps.target.outputs.name == 'production'
        run: |
          code=$(curl -sS -o /tmp/dom-res.json -w '%{http_code}' -X POST \
            "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/domains?teamId=${VERCEL_ORG_ID}" \
            -H "Authorization: Bearer $ROLE_VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"${{ matrix.domain }}\"}" || echo "000")
          body=$(cat /tmp/dom-res.json)
          if [ "$code" = "200" ] || [ "$code" = "201" ]; then
            echo "✅ domain ${{ matrix.domain }} attached"
          elif echo "$body" | grep -q 'already'; then
            echo "✅ domain ${{ matrix.domain }} already attached"
          else
            echo "::warning title=Domain not attached::${{ matrix.domain }} → HTTP $code. Remove domain from its current Vercel project first. Response: $body"
          fi
