# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# IDE NOTE: secrets/vars context warnings are false positives — this repo uses runtime-resolved
# GitHub Actions secrets that cannot be statically verified offline.
# Validation is disabled in .vscode/settings.json via github-actions.workflows.validations.enabled: false
name: Deploy · Vercel

# Deploys Sierra Estates to Vercel (Client and Admin projects):
#
#   ┌────────────────────────────┬──────────────────────────────────────┬─────────────────────────────┐
#   │ Job                        │ Vercel project                       │ Domain                      │
#   ├────────────────────────────┼──────────────────────────────────────┼─────────────────────────────┤
#   │ deploy (client)            │ CLIENT_VERCEL_PROJECT_ID             │ sierra-estates.net          │
#   │ deploy (admin)             │ ADMIN_VERCEL_PROJECT_ID              │ admin.sierra-estates.net    │
#   └────────────────────────────┴──────────────────────────────────────┴─────────────────────────────┘
#
#   Both build from the same source: apps/sierra-estates-realty (Next.js 16 App Router)
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions → Secrets):
#   VERCEL_TOKEN               — Vercel token with Projects R/W, Domains
#   FIREBASE_SERVICE_ACCOUNT_SIERRA_BLU or FIREBASE_SERVICE_ACCOUNT_JSON
#   SESSION_SECRET, SBR_SECRET_KEY, CRON_SECRET
#
# Required GitHub Variables (Settings → Secrets and variables → Actions → Variables):
#   VERCEL_ORG_ID              — Vercel team/org ID
#   CLIENT_VERCEL_PROJECT_ID   — prj_theA731k4WdFVhgd6DJUP6pAry6n
#   ADMIN_VERCEL_PROJECT_ID    — prj_W2gYCoKaS3oBcLDuGa9gB8z7cfnA
#   NEXT_PUBLIC_FIREBASE_*     — Firebase public SDK configuration values

on:
  push:
    branches: [main]
    paths:
      - 'apps/sierra-estates-realty/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'tsconfig*.json'
      - '.github/workflows/deploy-vercel.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy target'
        default: 'production'
        type: choice
        options:
          - production
          - preview

concurrency:
  group: vercel-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_CLI_VERSION: 'latest'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PUPPETEER_SKIP_DOWNLOAD: "true"
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
  NEXT_TELEMETRY_DISABLED: "1"

permissions:
  contents: read

jobs:
  deploy:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - role: client
            domain: sierra-estates.net
            app_dir: apps/sierra-estates-realty
            framework: nextjs
            proj_id_secret: CLIENT_VERCEL_PROJECT_ID
          - role: admin
            domain: admin.sierra-estates.net
            app_dir: apps/sierra-estates-realty
            framework: nextjs
            proj_id_secret: ADMIN_VERCEL_PROJECT_ID
    name: deploy (${{ matrix.role }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── Resolve correct project ID & token for the role ──────────────────────
      - name: Validate deployment prerequisites & resolve project ID
        id: proj
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          TOKEN="$VERCEL_TOKEN"
          
          if [ "${{ matrix.role }}" = "admin" ]; then
            PROJ="${{ vars.ADMIN_VERCEL_PROJECT_ID || vars.VERCEL_PROJECT_ID_ADMIN || 'prj_W2gYCoKaS3oBcLDuGa9gB8z7cfnA' }}"
          else
            PROJ="${{ vars.CLIENT_VERCEL_PROJECT_ID || vars.VERCEL_PROJECT_ID_CLIENT || 'prj_ieVcIcoeTtHndspXMzlE0cwLl89c' }}"
          fi
          
          ORG_ID="${{ vars.VERCEL_ORG_ID || 'team_UvdJ5ezVTaqEKyhqZ5QVqOKJ' }}"

          # Git deployments are disabled in vercel.json, so silently skipping
          # this job would leave main undeployed. Fail visibly instead.
          if [ -z "$TOKEN" ]; then
            echo "::error::VERCEL_TOKEN or VERCEL_AUTH_TOKEN is required to deploy this repository"
            exit 1
          fi

          echo "VERCEL_ORG_ID=$ORG_ID"     >> $GITHUB_ENV
          echo "VERCEL_PROJECT_ID=$PROJ"   >> $GITHUB_ENV
          echo "ROLE_VERCEL_TOKEN=$TOKEN"  >> $GITHUB_ENV
          echo "proj_id=$PROJ"             >> "$GITHUB_OUTPUT"
          echo "✅ ${{ matrix.role }} → project $PROJ (org: $ORG_ID, domain: ${{ matrix.domain }})"

      - uses: actions/checkout@v4
        with:
          submodules: false   # repo has no active submodules; prevents ghost-submodule fetch failures

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        if: steps.proj.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Determine deploy environment
        if: steps.proj.outputs.skip != 'true'
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ENV="production"
          else
            ENV="preview"
          fi
          echo "name=$ENV" >> "$GITHUB_OUTPUT"
          [ "$ENV" = "production" ] && echo "flag=--prod" >> "$GITHUB_OUTPUT" || echo "flag=" >> "$GITHUB_OUTPUT"

      - name: Validate public env safety
        run: node scripts/check-public-env-safety.mjs

      # ── P0 GATE: refuse to build/deploy PRODUCTION without required secrets ──
      # Fails fast instead of shipping a build that silently runs in limited mode
      # (no lead writes, admin auth, or cron). Preview deploys are intentionally
      # exempt so they stay usable for testing. Public NEXT_PUBLIC_* Firebase
      # values fall back to the same non-secret literals the sync step uses, so
      # this gates only on genuinely-missing server secrets. Audit P0.
      - name: Verify production env readiness (P0 gate)
        if: steps.target.outputs.name == 'production'
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY || 'AIzaSyBZLN2jTTKV34SneGPoWRz1zoRpX5uODjs' }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'sierra-blu.firebaseapp.com' }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'sierra-blu' }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || 'sierra-blu.firebasestorage.app' }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || '941030513456' }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID || '1:941030513456:web:56209a1495d69f217086f5' }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          SBR_SECRET_KEY: ${{ secrets.SBR_SECRET_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SIERRA_BLU || secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'sierra-blu' }}
          FIREBASE_CLIENT_EMAIL: ${{ vars.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          PROPERTY_FINDER_API_KEY: ${{ secrets.PROPERTY_FINDER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node scripts/verify-env-readiness.mjs

      # ── Set Vercel project settings for THIS role ─────────────────────────
      - name: Normalize Vercel project settings
        if: steps.proj.outputs.skip != 'true'
        run: |
          # Vercel needs to know to build from apps/sierra-estates-realty
          # Include retry logic on HTTP 429 rate limit
          success=false
          for attempt in 1 2 3; do
            code=$(curl -sS -o /tmp/norm-res.json -w '%{http_code}' -X PATCH \
              "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}" \
              -H "Authorization: Bearer $ROLE_VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"rootDirectory\":\"${{ matrix.app_dir }}\",\"framework\":\"${{ matrix.framework }}\",\"buildCommand\":null,\"installCommand\":\"pnpm install\",\"outputDirectory\":null,\"devCommand\":null}" || echo "000")
            if [ "$code" = "200" ] || [ "$code" = "204" ]; then
              echo "✅ Project normalized: rootDirectory=${{ matrix.app_dir }}, framework=${{ matrix.framework }}"
              success=true
              break
            elif [ "$code" = "429" ]; then
              echo "⏳ Rate limited on project normalize, retrying in $((attempt * 3))s..."
              sleep $((attempt * 3))
            else
              echo "::warning::Could not normalize project settings (HTTP $code). Response: $(cat /tmp/norm-res.json 2>/dev/null || true)"
              break
            fi
          done

      - name: Sync env vars to Vercel project
        if: steps.proj.outputs.skip != 'true'
        env:
          # Firebase Client SDK
          FB_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY || 'AIzaSyBZLN2jTTKV34SneGPoWRz1zoRpX5uODjs' }}
          FB_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'sierra-blu.firebaseapp.com' }}
          FB_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'sierra-blu' }}
          FB_STORAGE: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || 'sierra-blu.firebasestorage.app' }}
          FB_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || '941030513456' }}
          FB_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID || '1:941030513456:web:56209a1495d69f217086f5' }}
          FB_MEASUREMENT: ${{ vars.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID || 'G-ZP054BPJ8Q' }}
          FB_DATABASE_URL: ${{ vars.NEXT_PUBLIC_FIREBASE_DATABASE_URL || 'https://sierra-blu-default-rtdb.firebaseio.com' }}
          # AI & LLM
          AI_KEY: ${{ secrets.GOOGLE_AI_API_KEY || secrets.GEMINI_API_KEY }}
          GENAI_KEY: ${{ secrets.GOOGLE_GENAI_API_KEY || secrets.GOOGLE_AI_API_KEY }}
          AI_PROV: ${{ vars.AI_PROVIDER }}
          GC_LOC: ${{ vars.GOOGLE_CLOUD_LOCATION || 'europe-west1' }}
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_URL: ${{ vars.DEEPSEEK_API_URL }}
          # Property Finder
          PF_KEY: ${{ secrets.PROPERTY_FINDER_API_KEY || secrets.PF_API_KEY }}
          PF_SECRET: ${{ secrets.PROPERTY_FINDER_API_SECRET || secrets.PF_API_SECRET }}
          PF_TOKEN: ${{ secrets.PROPERTY_FINDER_AUTH_TOKEN || secrets.PF_JWT_TOKEN || secrets.PROPERTY_FINDER_JWT_TOKEN }}
          PF_COMP_ID: ${{ vars.PF_COMPANY_ID }}
          PF_WEBHOOK: ${{ secrets.PF_WEBHOOK_SECRET }}
          # AWS
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SEC: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REG: ${{ vars.AWS_REGION || 'us-east-1' }}
          # Security
          SESSION_SECRET_VAL: ${{ secrets.SESSION_SECRET }}
          ADMIN_API_KEY_VAL: ${{ secrets.ADMIN_API_KEY }}
          ANTIGRAVITY_API_KEY_VAL: ${{ secrets.ANTIGRAVITY_API_KEY }}
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SIERRA_BLU || secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FB_PRIV_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          FB_CLIENT_EM: ${{ vars.FIREBASE_CLIENT_EMAIL }}
          SBR_SECRET: ${{ secrets.SBR_SECRET_KEY }}
          CRON_SECRET_VAL: ${{ secrets.CRON_SECRET }}
          # Telegram
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_BOT_USERNAME: ${{ vars.NEXT_PUBLIC_TELEGRAM_BOT_USERNAME }}
          TG_CHAT_ID_VAL: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          # WhatsApp
          WA_TOKEN: ${{ secrets.WHATSAPP_API_TOKEN || secrets.WHATSAPP_META_TOKEN }}
          WA_PHONE_ID: ${{ vars.WHATSAPP_PHONE_NUMBER_ID }}
          WA_VERIFY: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          LEAD_WHATSAPP: ${{ secrets.LEAD_NOTIFY_WHATSAPP_NUMBER }}
          BRAND_TAG: ${{ vars.BRANDING_TAG }}
          WABA_1: ${{ vars.WABA_NUMBER_1 }}
          WABA_2: ${{ vars.WABA_NUMBER_2 }}
          WABA_3: ${{ vars.WABA_NUMBER_3 }}
          WABA_4: ${{ vars.WABA_NUMBER_4 }}
          # Twilio
          TW_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TW_AUTH: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TW_MSG_SID: ${{ vars.TWILIO_MESSAGING_SERVICE_SID }}
          # SendGrid
          SENDGRID_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDER_EMAIL_VAL: ${{ vars.SENDER_EMAIL || vars.SENDGRID_FROM_EMAIL }}
          # Domains
          DEFAULT_LOCALE: ${{ vars.NEXT_PUBLIC_DEFAULT_LOCALE || 'en' }}
          APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          INT_OS_URL: ${{ vars.NEXT_PUBLIC_INTELLIGENCE_OS_URL }}
          OPENMEM_URL: ${{ vars.OPENMEMORY_URL }}
          # Redis
          REDIS_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          REDIS_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          # Sheets
          INV_SHEET_ID: ${{ vars.INVENTORY_SHEET_ID }}
          INV_SHEET_GID: ${{ vars.INVENTORY_SHEET_GID }}
          MST_SHEET_ID: ${{ vars.MASTER_SHEET_ID }}
          BRK_SHEET_ID: ${{ vars.BROKER_INBOX_SHEET_ID }}
          # n8n
          N8N_URL: ${{ vars.N8N_BASE_URL }}
          N8N_KEY: ${{ secrets.N8N_API_KEY }}
        run: |
          # Rate-limited upsert helper with exponential backoff & pacing
          upsert() {
            [ -n "$2" ] || { echo "  $1 (empty — skipped)"; return 0; }
            code=$(curl -sS -o /tmp/env-res.json -w '%{http_code}' -X POST \
              "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?teamId=${VERCEL_ORG_ID}&upsert=true" \
              -H "Authorization: Bearer $ROLE_VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"key\":\"$1\",\"value\":\"$2\",\"type\":\"${3:-plain}\",\"target\":[\"production\",\"preview\"]}" || echo "000")
            case "$code" in 200|201) echo "  $1 ✓";; *) echo "::warning::env $1 → HTTP $code $(cat /tmp/env-res.json 2>/dev/null || true)";; esac
          }

          # Routing & Domains
          upsert ADMIN_HOST                            "admin.sierra-estates.net"
          upsert CLIENT_HOST                           "sierra-estates.net"
          upsert COOKIE_DOMAIN                         ".sierra-estates.net"
          upsert NEXT_PUBLIC_CLIENT_URL                "https://sierra-estates.net"
          upsert NEXT_PUBLIC_ADMIN_URL                 "https://admin.sierra-estates.net"
          upsert NEXT_PUBLIC_SITE_URL                  "${SITE_URL:-https://sierra-estates.net}"
          upsert NEXT_PUBLIC_APP_URL                   "${APP_URL:-https://sierra-estates.net}"
          upsert ALLOWED_ORIGINS                        "$ORIGINS"
          upsert NEXT_PUBLIC_DEFAULT_LOCALE            "${DEFAULT_LOCALE:-en}"
          upsert NEXT_PUBLIC_INTELLIGENCE_OS_URL       "$INT_OS_URL"
          upsert OPENMEMORY_URL                        "${OPENMEM_URL:-http://localhost:8080}"

          # Firebase Client SDK
          upsert NEXT_PUBLIC_FIREBASE_API_KEY          "$FB_API_KEY"
          upsert NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN      "$FB_AUTH_DOMAIN"
          upsert NEXT_PUBLIC_FIREBASE_PROJECT_ID       "$FB_PROJECT_ID"
          upsert NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET   "$FB_STORAGE"
          upsert NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID "$FB_SENDER_ID"
          upsert NEXT_PUBLIC_FIREBASE_APP_ID           "$FB_APP_ID"
          upsert NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID   "$FB_MEASUREMENT"
          upsert NEXT_PUBLIC_FIREBASE_DATABASE_URL     "$FB_DATABASE_URL"

          # Firebase Admin & Service Account
          upsert FIREBASE_PROJECT_ID                   "sierra-blu"
          upsert FIREBASE_SERVICE_ACCOUNT_JSON         "$SA_JSON" encrypted
          upsert FIREBASE_PRIVATE_KEY                  "$FB_PRIV_KEY" encrypted
          upsert FIREBASE_CLIENT_EMAIL                 "$FB_CLIENT_EM"

          # AI & LLM Providers
          upsert GOOGLE_AI_API_KEY                     "$AI_KEY" encrypted
          upsert GEMINI_API_KEY                        "$AI_KEY" encrypted
          upsert GOOGLE_GENAI_API_KEY                  "$GENAI_KEY" encrypted
          upsert AI_PROVIDER                           "$AI_PROV"
          upsert GOOGLE_CLOUD_LOCATION                 "${GC_LOC:-europe-west1}"
          upsert DEEPSEEK_API_KEY                      "$DEEPSEEK_KEY" encrypted
          upsert DEEPSEEK_API_URL                      "$DEEPSEEK_URL"

          # Property Finder Integration
          upsert PROPERTY_FINDER_API_KEY               "$PF_KEY" encrypted
          upsert PROPERTY_FINDER_API_SECRET            "$PF_SECRET" encrypted
          upsert PF_API_KEY                            "$PF_KEY" encrypted
          upsert PF_API_SECRET                         "$PF_SECRET" encrypted
          upsert PROPERTY_FINDER_AUTH_TOKEN            "$PF_TOKEN" encrypted
          upsert PF_COMPANY_ID                         "$PF_COMP_ID"
          upsert PF_WEBHOOK_SECRET                     "$PF_WEBHOOK" encrypted

          # AWS & Infrastructure
          upsert AWS_ACCESS_KEY_ID                     "$AWS_KEY" encrypted
          upsert AWS_SECRET_ACCESS_KEY                 "$AWS_SEC" encrypted
          upsert AWS_REGION                            "${AWS_REG:-us-east-1}"

          # Security & Application Secrets
          upsert SESSION_SECRET                        "$SESSION_SECRET_VAL" encrypted
          upsert SBR_SECRET_KEY                        "$SBR_SECRET" encrypted
          upsert CRON_SECRET                           "$CRON_SECRET_VAL" encrypted
          upsert ADMIN_API_KEY                         "$ADMIN_API_KEY_VAL" encrypted
          upsert ANTIGRAVITY_API_KEY                   "$ANTIGRAVITY_API_KEY_VAL" encrypted

          # Telegram Integration
          upsert TELEGRAM_BOT_TOKEN                    "$TG_BOT_TOKEN" encrypted
          upsert NEXT_PUBLIC_TELEGRAM_BOT_USERNAME     "$TG_BOT_USERNAME"
          upsert TELEGRAM_CHAT_ID                      "$TG_CHAT_ID_VAL" encrypted
          upsert TELEGRAM_WEBHOOK_SECRET               "$TG_WEBHOOK_SECRET" encrypted

          # WhatsApp Integration & Cloud API
          upsert WHATSAPP_API_TOKEN                    "$WA_TOKEN" encrypted
          upsert WHATSAPP_META_TOKEN                   "$WA_TOKEN" encrypted
          upsert WHATSAPP_PHONE_NUMBER_ID              "$WA_PHONE_ID"
          upsert WHATSAPP_VERIFY_TOKEN                 "$WA_VERIFY" encrypted
          upsert LEAD_NOTIFY_WHATSAPP_NUMBER           "$LEAD_WHATSAPP" encrypted
          upsert BRANDING_TAG                          "$BRAND_TAG"
          upsert WABA_NUMBER_1                         "$WABA_1"
          upsert WABA_NUMBER_2                         "$WABA_2"
          upsert WABA_NUMBER_3                         "$WABA_3"
          upsert WABA_NUMBER_4                         "$WABA_4"

          # Twilio Fallback
          upsert TWILIO_ACCOUNT_SID                    "$TW_SID" encrypted
          upsert TWILIO_AUTH_TOKEN                     "$TW_AUTH" encrypted
          upsert TWILIO_MESSAGING_SERVICE_SID          "$TW_MSG_SID"

          # Email (SendGrid)
          upsert SENDGRID_API_KEY                      "$SENDGRID_KEY" encrypted
          upsert SENDER_EMAIL                          "$SENDER_EMAIL_VAL"

          # Upstash Redis
          upsert UPSTASH_REDIS_REST_URL                "$REDIS_URL" encrypted
          upsert UPSTASH_REDIS_REST_TOKEN              "$REDIS_TOKEN" encrypted

          # Google Sheets & Inventory
          upsert INVENTORY_SHEET_ID                    "$INV_SHEET_ID"
          upsert INVENTORY_SHEET_GID                   "$INV_SHEET_GID"
          upsert MASTER_SHEET_ID                       "$MST_SHEET_ID"
          upsert BROKER_INBOX_SHEET_ID                 "$BRK_SHEET_ID"

          # n8n
          upsert N8N_BASE_URL                          "$N8N_URL"
          upsert N8N_API_KEY                           "$N8N_KEY" encrypted

          echo "✅ Environment variables synchronization complete for ${{ matrix.role }}."

      - name: Remove crons from admin project (client project owns them)
        if: steps.proj.outputs.skip != 'true' && matrix.role == 'admin'
        run: |
          if [ -f "${{ matrix.app_dir }}/vercel.json" ]; then
            jq 'del(.crons)' "${{ matrix.app_dir }}/vercel.json" > /tmp/vercel.json
            mv /tmp/vercel.json "${{ matrix.app_dir }}/vercel.json"
            echo "crons stripped from admin vercel.json"
          fi

      - name: Install Vercel CLI
        if: steps.proj.outputs.skip != 'true'
        run: npm install --global vercel@${VERCEL_CLI_VERSION}

      # ── Point vercel CLI at THIS role's project ONLY ──────────────────────
      - name: Write .vercel/project.json for this role
        if: steps.proj.outputs.skip != 'true'
        run: |
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}' "${VERCEL_PROJECT_ID}" "${VERCEL_ORG_ID}" \
            > .vercel/project.json
          echo "✅ .vercel/project.json → ${VERCEL_PROJECT_ID}"

      - name: Pull Vercel project settings
        if: steps.proj.outputs.skip != 'true'
        run: |
          # Pull settings with retry backoff
          for attempt in 1 2 3; do
            if vercel pull --yes --environment=${{ steps.target.outputs.name }} --token=$ROLE_VERCEL_TOKEN; then
              break
            else
              echo "⏳ Pull failed (attempt $attempt), retrying in $((attempt * 5))s..."
              sleep $((attempt * 5))
            fi
          done

      - name: Build
        if: steps.proj.outputs.skip != 'true'
        run: |
          vercel build ${{ steps.target.outputs.flag }} --token=$ROLE_VERCEL_TOKEN

      - name: Deploy (prebuilt artifact)
        if: steps.proj.outputs.skip != 'true'
        id: deploy_step
        run: |
          # Deploy prebuilt artifact as a tar archive with retry for transient rate limits or upload issues
          url=""
          for attempt in 1 2 3; do
            echo "Running vercel deploy (attempt $attempt)..."
            if url=$(vercel deploy --prebuilt ${{ steps.target.outputs.flag }} --archive=tgz --token=$ROLE_VERCEL_TOKEN); then
              echo "url=$url" >> "$GITHUB_OUTPUT"
              echo "### ✅ ${{ matrix.role }} deployed → $url" >> "$GITHUB_STEP_SUMMARY"
              echo "deployed: $url"
              break
            else
              echo "⏳ Deploy failed (attempt $attempt), retrying in $((attempt * 10))s..."
              sleep $((attempt * 10))
            fi
          done
          if [ -z "$url" ]; then
            echo "::error::Deployment failed after 3 attempts."
            exit 1
          fi

      - name: Attach production domain (${{ matrix.domain }})
        if: steps.proj.outputs.skip != 'true' && steps.target.outputs.name == 'production'
        run: |
          for attempt in 1 2 3; do
            code=$(curl -sS -o /tmp/dom-res.json -w '%{http_code}' -X POST \
              "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/domains?teamId=${VERCEL_ORG_ID}" \
              -H "Authorization: Bearer $ROLE_VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"${{ matrix.domain }}\"}" || echo "000")
            body=$(cat /tmp/dom-res.json 2>/dev/null || true)
            if [ "$code" = "200" ] || [ "$code" = "201" ]; then
              echo "✅ domain ${{ matrix.domain }} attached"
              break
            elif echo "$body" | grep -q 'already'; then
              echo "✅ domain ${{ matrix.domain }} already attached"
              break
            elif [ "$code" = "429" ]; then
              echo "⏳ Rate limited on attaching domain, retrying in $((attempt * 3))s..."
              sleep $((attempt * 3))
            else
              echo "::warning title=Domain not attached::${{ matrix.domain }} → HTTP $code. Response: $body"
              break
            fi
          done
