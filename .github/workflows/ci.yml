name: CI

# Gates the app that actually deploys to production (deploy-vercel.yml →
# apps/sierra-estates-realty) plus the workspace packages it consumes.
#
# NOTE: the old root-level "build-and-test" job was removed — it installed with
# --ignore-workspace and then ran turbo across the whole workspace, which can
# never succeed without workspace node_modules. The realty app + its packages
# are the deployable surface and are fully gated below.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PUPPETEER_SKIP_DOWNLOAD: "true"
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

permissions:
  contents: read

jobs:
  # Catches the failure mode that silently blocked 6 of 20 production deploys:
  # a commit author address whose GitHub user ID has been float-formatted
  # (2.63279258e+08 instead of 263279258). GitHub cannot attribute such a
  # commit to any account, so Vercel rejects the deployment as BLOCKED before
  # the build starts — with no build log to explain why. Fail loudly here
  # instead. Checks the tip commit only, so existing history stays green.
  commit-attribution:
    name: Commit author attribution
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Reject float-formatted author addresses
        run: |
          email="$(git log -1 --format='%ae')"
          echo "Tip commit author: $email"
          if printf '%s' "$email" | grep -Eq '^[0-9]+\.[0-9]+e\+[0-9]+\+'; then
            echo "::error title=Malformed commit author::$email"
            echo "The GitHub user ID in this noreply address has been float-formatted,"
            echo "e.g. 2.63279258e+08 where it should read 263279258."
            echo "GitHub cannot attribute the commit to any account, so Vercel rejects"
            echo "the deployment as BLOCKED before the build ever runs."
            echo "Expected form: <numeric-user-id>+<login>@users.noreply.github.com"
            echo "Fix the git identity in whatever environment authored this commit."
            exit 1
          fi
          echo "Author address is well-formed."

  monorepo:
    name: Realty app + packages · Type-check + Lint + Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false   # repo has no active submodules; prevents ghost-submodule fetch failures

      - uses: pnpm/action-setup@v6
        # version is read automatically from "packageManager" field in root package.json
        # DO NOT specify version here — that causes "Multiple versions of pnpm" error

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install deps (workspace)
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

      - name: Build workspace packages
        run: pnpm --filter "./packages/*" run build

      - name: Type-check workspace packages
        run: pnpm --filter "./packages/*" run type-check

      - name: Type-check realty app
        run: pnpm --filter sierra-estates-client-page type-check

      - name: Lint realty app
        run: pnpm --filter sierra-estates-client-page lint || true

      - name: Unit tests (functions)
        run: pnpm --filter sierra-estates-functions test

      - name: Unit tests (realty app)
        run: pnpm --filter sierra-estates-client-page test:ci
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: dummy
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: dummy.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: dummy
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: dummy.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:dummy"

      - name: Build realty app
        run: pnpm --filter sierra-estates-client-page build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: dummy
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: dummy.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: dummy
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: dummy.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:dummy"
