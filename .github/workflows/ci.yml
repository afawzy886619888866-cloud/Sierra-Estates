name: CI

# MANUAL FALLBACK ONLY — the primary CI gate now runs INSIDE the Vercel
# production build (scripts/ci-preflight.sh, chained in vercel.json
# buildCommand), after the GitHub Free-plan Actions minute quota was
# exhausted. See docs/GITHUB_ACTIONS_SPENDING_LIMIT_GUIDE.md section 0.
# Run this job on demand via the "Run workflow" button when Actions minutes
# are available again.
#
# Scheduled scans, PR-size labels, and auto-assign remain removed.

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PUPPETEER_SKIP_DOWNLOAD: "true"
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

permissions:
  contents: read

jobs:
  monorepo:
    name: Realty app + packages · Type-check + Lint + Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false   # repo has no active submodules; prevents ghost-submodule fetch failures

      - uses: pnpm/action-setup@v6
        # version is read automatically from "packageManager" field in root package.json
        # DO NOT specify version here — that causes "Multiple versions of pnpm" error

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - name: Install deps (workspace)
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

      - name: Build workspace packages
        run: pnpm --filter "./packages/*" run build

      - name: Type-check workspace packages
        run: pnpm --filter "./packages/*" run type-check

      - name: Type-check realty app
        run: pnpm --filter sierra-estates-client-page type-check

      - name: Canonical backend policy
        run: pnpm check:backend
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-test-service-role-key

      - name: Public environment safety
        run: pnpm check:public-env

      - name: Legacy runtime boundary
        run: pnpm check:legacy-runtime

      - name: Lint realty app
        run: pnpm --filter sierra-estates-client-page lint

      - name: Unit tests (realty app)
        run: pnpm --filter sierra-estates-client-page test:ci
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-test-service-role-key

      - name: Build realty app
        run: pnpm --filter sierra-estates-client-page build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-test-service-role-key
