name: CI

# PRIMARY GATE (2026-10-19 re-enabled): the repository is PUBLIC, so
# GitHub-hosted standard runners cost zero Actions minutes — the push/PR
# triggers removed during the quota outage (see section 0 of
# docs/GITHUB_ACTIONS_SPENDING_LIMIT_GUIDE.md) are restored alongside the
# in-Vercel ci-preflight gate (vercel.json buildCommand), which remains the
# deploy-time authority. IF this repository ever becomes PRIVATE again,
# revert to `workflow_dispatch`-only to avoid burning paid minutes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  PUPPETEER_SKIP_DOWNLOAD: "true"
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

permissions:
  contents: read

jobs:
  monorepo:
    name: Realty app + packages · Type-check + Lint + Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false   # repo has no active submodules; prevents ghost-submodule fetch failures

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install deps (workspace)
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

      - name: Build workspace packages
        run: pnpm --filter "./packages/*" run build

      - name: Type-check workspace packages
        run: pnpm --filter "./packages/*" run type-check

      - name: Type-check realty app
        run: pnpm --filter sierra-estates-client-page type-check

      - name: Canonical backend policy
        run: pnpm check:backend
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key

      - name: Public environment safety
        run: pnpm check:public-env

      - name: Legacy runtime boundary
        run: pnpm check:legacy-runtime

      - name: Lint realty app
        run: pnpm --filter sierra-estates-client-page lint

      - name: Unit tests (realty app)
        run: pnpm --filter sierra-estates-client-page test:ci
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key

      # 2026-10-19: the root vitest suite (76 files — workflows safety,
      # deployment contracts, data hygiene, memory engine, infra, agents)
      # had NO runner and silently drifted to 39 failing tests. It is now
      # part of CI via the test:root script.
      - name: Install Cline CLI
        run: npm install -g cline@3.0.73

      - name: Root vitest suite (workflows, contracts, hygiene, memory)
        run: pnpm test:root

      - name: Build realty app
        run: pnpm --filter sierra-estates-client-page build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
