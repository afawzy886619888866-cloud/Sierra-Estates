name: CI

# Gates the app that actually deploys to production (deploy-vercel.yml →
# apps/sierra-estates-realty) plus the workspace packages it consumes.
#
# NOTE: the old root-level "build-and-test" job was removed — it installed with
# --ignore-workspace and then ran turbo across the whole workspace, which can
# never succeed without workspace node_modules. The realty app + its packages
# are the deployable surface and are fully gated below.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # cancel-in-progress: true for pull_request events; false on main to preserve CI verdicts.
  # Cancelling a main run leaves that commit with no CI verdict at all, which is exactly how
  # the TypeScript 7 bump landed unverified and broke every ts-jest suite: its
  # run (9b793cb6) was cancelled by the next push, and the failure only surfaced
  # one commit later. Rapid successive merges must each get a real verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PUPPETEER_SKIP_DOWNLOAD: "true"
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

permissions:
  contents: read

jobs:
  monorepo:
    name: Realty app + packages · Type-check + Lint + Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false   # repo has no active submodules; prevents ghost-submodule fetch failures

      - uses: pnpm/action-setup@v4
        # version is read automatically from "packageManager" field in root package.json
        # DO NOT specify version here — that causes "Multiple versions of pnpm" error

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install deps (workspace)
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

      - name: Build workspace packages
        run: pnpm --filter "./packages/*" run build

      - name: Type-check workspace packages
        run: pnpm --filter "./packages/*" run type-check

      - name: Type-check realty app
        run: pnpm --filter sierra-estates-client-page type-check

      - name: Lint realty app
        run: pnpm --filter sierra-estates-client-page lint

      - name: Unit tests (functions)
        run: pnpm --filter sierra-estates-functions test

      - name: Unit tests (realty app)
        run: pnpm --filter sierra-estates-client-page test:ci
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: dummy
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: dummy.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: dummy
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: dummy.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:dummy"

      - name: Build realty app
        run: pnpm --filter sierra-estates-client-page build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: dummy
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: dummy.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: dummy
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: dummy.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:dummy"

  # The repo keeps TWO firestore.rules: a root copy (required to exist by
  # __tests__/repo-integrity-and-hygiene.test.ts and reviewed at the root) and
  # apps/sierra-estates-realty/firestore.rules — the one both firebase.json
  # files actually deploy. They are byte-identical today; this guard makes sure
  # they never silently drift, so the deployed rules always match the reviewed
  # root copy. (Audit REPO_AUDIT_REPORT.md P2.)
  firestore-rules-drift:
    name: Firestore rules in sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Root and app firestore.rules must be byte-identical
        run: |
          root="firestore.rules"
          app="apps/sierra-estates-realty/firestore.rules"
          if ! diff -q "$root" "$app" >/dev/null 2>&1; then
            echo "::error title=Firestore rules drift::$root and $app differ"
            echo "The root copy is reviewed and required by repo-integrity tests;"
            echo "the app copy is what firebase.json deploys. Keep them identical."
            diff "$root" "$app" || true
            exit 1
          fi
          echo "firestore.rules root and app copies are identical."
