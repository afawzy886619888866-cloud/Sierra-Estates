name: Deploy Cloudflare (Unified · sierra-estates)

# Hosting contract (2026-11-19): Single unified Cloudflare Worker (`sierra-estates`)
# built with @opennextjs/cloudflare. Serves all 3 hostnames via Next.js host-based
# rewrites in apps/sierra-estates-realty/next.config.ts:
#   - sierra-estates.net       (Public Client Portal)
#   - www.sierra-estates.net   (Public Client Portal)
#   - admin.sierra-estates.net (Admin OS — host rewrite to /admin + Zero Trust Access)
#
# Guardrail: Deployments ONLY update the existing `sierra-estates` Worker and
# REFUSE to create any brand-new Cloudflare project unless explicitly authorized
# with a credentialed approval (`ALLOW_CREATE_NEW_WORKER` secret).

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: true

env:
  PUPPETEER_SKIP_DOWNLOAD: "true"
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
  CF_WORKER_NAME: "sierra-estates"

jobs:
  gate:
    name: CI gate (production) · audit + block
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
    steps:
      - name: Decide deployment authorization
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          DEPLOY_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ "$CI_CONCLUSION" = "success" ] && \
               [ "$CI_HEAD_BRANCH" = "main" ] && \
               [ "$CI_HEAD_REPOSITORY" = "${{ github.repository }}" ]; then
              echo "::notice::CI gate satisfied for tested main commit."
              echo "proceed=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::CI workflow run is not an eligible successful main-branch run for this repository. Production deploy blocked."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          CONCLUSION=$(gh run list --workflow=ci.yml --repo "${{ github.repository }}" --branch main --commit "$DEPLOY_SHA" --limit 1 --json status,conclusion,headSha --jq '.[0] | "\(.status) \(.conclusion) \(.headSha)"' || echo "unknown unknown unknown")
          echo "Latest ci.yml run: $CONCLUSION"
          STATUS=$(echo "$CONCLUSION" | cut -d' ' -f1)
          RESULT=$(echo "$CONCLUSION" | cut -d' ' -f2)
          HEAD_SHA=$(echo "$CONCLUSION" | cut -d' ' -f3)
          if [ "$STATUS" = "completed" ] && [ "$RESULT" = "success" ] && [ "$HEAD_SHA" = "$DEPLOY_SHA" ]; then
            echo "::notice::CI gate satisfied — production deploy authorized."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::CI gate failed: ci.yml for '$DEPLOY_SHA' is '$STATUS/$RESULT/$HEAD_SHA'. Production deploy BLOCKED."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: OpenNext deploy · sierra-estates
    needs: gate
    if: ${{ needs.gate.outputs.proceed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
          submodules: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm

      - name: Verify credentials & enforce existing single-project lock
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ALLOW_CREATE_NEW_WORKER: ${{ secrets.ALLOW_CREATE_NEW_WORKER }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN secret or CLOUDFLARE_ACCOUNT_ID variable."
            exit 1
          fi
          if [ "$CF_WORKER_NAME" != "sierra-estates" ]; then
            echo "::error::Single-project policy violation: target worker must be 'sierra-estates', got '$CF_WORKER_NAME'."
            exit 1
          fi
          HTTP_CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$CF_WORKER_NAME")
          if [ "$HTTP_CODE" != "200" ]; then
            if [ "$ALLOW_CREATE_NEW_WORKER" != "true" ]; then
              echo "::error::Worker '$CF_WORKER_NAME' does not exist (HTTP $HTTP_CODE). Creating a brand-new Cloudflare project is blocked unless secret ALLOW_CREATE_NEW_WORKER=true is explicitly set."
              exit 1
            fi
            echo "::warning::ALLOW_CREATE_NEW_WORKER=true verified — authorized to provision '$CF_WORKER_NAME'."
          else
            echo "Verified existing single Cloudflare Worker project: $CF_WORKER_NAME (HTTP 200)."
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build unified worker (Next.js → OpenNext)
        working-directory: apps/sierra-estates-realty
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          NEXT_PUBLIC_SITE_URL: https://sierra-estates.net
          NEXT_PUBLIC_CLIENT_URL: ${{ vars.NEXT_PUBLIC_CLIENT_URL }}
          NEXT_PUBLIC_ADMIN_URL: ${{ vars.NEXT_PUBLIC_ADMIN_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          set -euo pipefail
          node scripts/ensure-snapshot.mjs
          pnpm exec next build --webpack
          npx opennextjs-cloudflare build --skipNextBuild

      - name: Deploy unified worker sierra-estates & sync runtime secrets
        working-directory: apps/sierra-estates-realty
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deploy --name "$CF_WORKER_NAME"
          cat > /tmp/cf-secrets.json <<JSON
          {
            "NEXT_PUBLIC_SUPABASE_URL": "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}",
            "NEXT_PUBLIC_SUPABASE_ANON_KEY": "${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}",
            "SUPABASE_SERVICE_ROLE_KEY": "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}",
            "SESSION_SECRET": "${{ secrets.SESSION_SECRET }}",
            "ADMIN_API_KEY": "${{ secrets.ADMIN_API_KEY }}",
            "CRON_SECRET": "${{ secrets.CRON_SECRET }}",
            "SBR_SECRET_KEY": "${{ secrets.SBR_SECRET_KEY }}",
            "GEMINI_API_KEY": "${{ secrets.GEMINI_API_KEY }}",
            "GOOGLE_AI_API_KEY": "${{ secrets.GOOGLE_AI_API_KEY }}",
            "TELEGRAM_BOT_TOKEN": "${{ secrets.TELEGRAM_BOT_TOKEN }}",
            "WHATSAPP_API_TOKEN": "${{ secrets.WHATSAPP_API_TOKEN }}",
            "PF_WEBHOOK_SECRET": "${{ secrets.PF_WEBHOOK_SECRET }}"
          }
          JSON
          npx wrangler secret bulk /tmp/cf-secrets.json --name "$CF_WORKER_NAME" || \
            echo "::warning::secret bulk sync failed for $CF_WORKER_NAME — deployment stands, sync manually with 'wrangler secret bulk'."
          rm -f /tmp/cf-secrets.json

      - name: Verify custom domains on sierra-estates
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ZONE_ID=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=sierra-estates.net" | jq -r '.result[0].id // empty')
          if [ -z "$ZONE_ID" ]; then
            echo "::warning::zone sierra-estates.net not visible to this token — skipping custom domain verify."
            exit 0
          fi
          for HOST in sierra-estates.net www.sierra-estates.net admin.sierra-estates.net; do
            HTTP_CODE=$(curl -sS -o /tmp/cf-domain.json -w '%{http_code}' -X PUT \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" \
              -d "{\"zone_id\":\"$ZONE_ID\",\"hostname\":\"$HOST\",\"service\":\"$CF_WORKER_NAME\",\"environment\":\"production\"}")
            echo "Custom domain $HOST -> $CF_WORKER_NAME: HTTP $HTTP_CODE"
          done

      - name: Smoke test live production deployment
        run: |
          set -euo pipefail
          for i in $(seq 1 8); do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://sierra-estates.net/" || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "https://sierra-estates.net/ is LIVE (HTTP 200)."
              exit 0
            fi
            echo "attempt $i: HTTP $CODE — waiting"; sleep 10
          done
          echo "::warning::site did not return 200 within 80s — check worker logs."
          exit 0
