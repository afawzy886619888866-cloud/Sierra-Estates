name: Deploy Cloudflare (Unified · sierra-estates)

# Hosting contract (2026-11-19): Single unified Cloudflare Worker (`sierra-estates`)
# built with @opennextjs/cloudflare. Serves all 3 hostnames via Next.js host-based
# rewrites in apps/sierra-estates-realty/next.config.ts:
#   - sierra-estates.net       (Public Client Portal)
#   - www.sierra-estates.net   (Cloudflare Edge 301 Redirect -> https://sierra-estates.net)
#   - admin.sierra-estates.net (Admin OS — host rewrite to /admin + Zero Trust Access)
#
# IMPORTANT NOTICE (Deferred — Cloudflare Workers Plan):
#   Production currently runs on the Cloudflare Workers Free Plan (10 ms CPU limit
#   per request), which can occasionally trigger cold-start `error code: 1102` (CPU
#   time exceeded) on heavy SSR/cron isolates until bundle size is reduced and/or
#   the account is upgraded to Cloudflare Workers Paid ($5/month, 30,000 ms CPU limit).
#   Do NOT enable paid billing automatically — kept as a deferred operator upgrade
#   notice while bundle-reduction work shrinks `.open-next/.../handler.mjs`.
#
# Enhancements:
#   - Clean trigger: runs ONLY after CI completes (`workflow_run`) or manual `workflow_dispatch`
#     (no redundant failed-gate runs on raw pushes).
#   - Next.js `.next/cache` caching for faster OpenNext builds.
#   - Strict single-project lock: ONLY updates existing `sierra-estates` and REFUSES to create
#     any brand-new Cloudflare Worker unless secret `ALLOW_CREATE_NEW_WORKER=true` is set.
#   - Full 4-endpoint live verification asserting real HTML + healthy `/api/health` + Access on admin.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-production
  cancel-in-progress: false

env:
  PUPPETEER_SKIP_DOWNLOAD: "true"
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
  CF_WORKER_NAME: "sierra-estates"

jobs:
  gate:
    name: CI gate (production) · audit + block
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
      deploy_sha: ${{ steps.decide.outputs.deploy_sha }}
    steps:
      - name: Decide deployment authorization
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            echo "deploy_sha=${CI_HEAD_SHA}" >> "$GITHUB_OUTPUT"
            if [ "$CI_CONCLUSION" = "success" ] && \
               [ "$CI_HEAD_BRANCH" = "main" ] && \
               [ "$CI_HEAD_REPOSITORY" = "${{ github.repository }}" ]; then
              echo "::notice::CI gate satisfied for tested main commit ${CI_HEAD_SHA}."
              echo "proceed=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::CI workflow run is not an eligible successful main-branch run. Production deploy blocked."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          echo "deploy_sha=${DEPLOY_SHA}" >> "$GITHUB_OUTPUT"
          CONCLUSION=$(gh run list --workflow=ci.yml --repo "${{ github.repository }}" --branch main --commit "$DEPLOY_SHA" --limit 1 --json status,conclusion,headSha --jq '.[0] | "\(.status) \(.conclusion) \(.headSha)"' || echo "unknown unknown unknown")
          echo "Latest ci.yml run: $CONCLUSION"
          STATUS=$(echo "$CONCLUSION" | cut -d' ' -f1)
          RESULT=$(echo "$CONCLUSION" | cut -d' ' -f2)
          HEAD_SHA=$(echo "$CONCLUSION" | cut -d' ' -f3)
          if [ "$STATUS" = "completed" ] && [ "$RESULT" = "success" ] && [ "$HEAD_SHA" = "$DEPLOY_SHA" ]; then
            echo "::notice::CI gate satisfied — production deploy authorized."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::CI gate failed: ci.yml for '$DEPLOY_SHA' is '$STATUS/$RESULT/$HEAD_SHA'. Production deploy BLOCKED."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  # IMPORTANT NOTICE (Deferred — Cloudflare Workers Plan):
  # Free Plan enforces a 10 ms CPU cap per isolate, so heavy cold starts can
  # occasionally emit `error code: 1102` until bundle size is trimmed (dropping
  # `googleapis` + static `snapshot.json`) or Workers Paid ($5/mo -> 30,000 ms)
  # is enabled manually by the owner.
  deploy:
    name: OpenNext deploy · sierra-estates
    needs: gate
    if: ${{ needs.gate.outputs.proceed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.deploy_sha || github.sha }}
          fetch-depth: 2
          submodules: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm

      - name: Verify credentials & enforce existing single-project lock
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ALLOW_CREATE_NEW_WORKER: ${{ secrets.ALLOW_CREATE_NEW_WORKER }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN secret or CLOUDFLARE_ACCOUNT_ID variable."
            exit 1
          fi
          if [ "$CF_WORKER_NAME" != "sierra-estates" ]; then
            echo "::error::Single-project policy violation: target worker must be 'sierra-estates', got '$CF_WORKER_NAME'."
            exit 1
          fi
          HTTP_CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$CF_WORKER_NAME")
          if [ "$HTTP_CODE" != "200" ]; then
            if [ "$ALLOW_CREATE_NEW_WORKER" != "true" ]; then
              echo "::error::Worker '$CF_WORKER_NAME' does not exist (HTTP $HTTP_CODE). Creating a brand-new Cloudflare project is blocked unless secret ALLOW_CREATE_NEW_WORKER=true is explicitly set."
              exit 1
            fi
            echo "::warning::ALLOW_CREATE_NEW_WORKER=true verified — authorized to provision '$CF_WORKER_NAME'."
          else
            echo "Verified existing single Cloudflare Worker project: $CF_WORKER_NAME (HTTP 200)."
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Cache Next.js build artifacts
        uses: actions/cache@v5
        with:
          path: apps/sierra-estates-realty/.next/cache
          key: nextjs-cf-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/sierra-estates-realty/next.config.ts') }}
          restore-keys: |
            nextjs-cf-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-cf-${{ runner.os }}-

      - name: Build unified worker (Next.js → OpenNext)
        working-directory: apps/sierra-estates-realty
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          NEXT_PUBLIC_SITE_URL: https://sierra-estates.net
          NEXT_PUBLIC_CLIENT_URL: ${{ vars.NEXT_PUBLIC_CLIENT_URL }}
          NEXT_PUBLIC_ADMIN_URL: ${{ vars.NEXT_PUBLIC_ADMIN_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          set -euo pipefail
          node scripts/ensure-snapshot.mjs
          pnpm exec next build --webpack
          npx opennextjs-cloudflare build --skipNextBuild --minify
          find .open-next -name '*.map' -delete
          HANDLER_PATH=".open-next/server-functions/default/handler.mjs"
          if [ -f "$HANDLER_PATH" ]; then
            HANDLER_SIZE=$(ls -lh "$HANDLER_PATH" | awk '{print $5}')
            echo "Minified OpenNext worker handler size: $HANDLER_SIZE"
            echo "### Cloudflare Worker Build (`$CF_WORKER_NAME`)" >> "$GITHUB_STEP_SUMMARY"
            echo "- Minified \`handler.mjs\` size: **$HANDLER_SIZE**" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy unified worker sierra-estates & sync runtime secrets
        working-directory: apps/sierra-estates-realty
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SBR_SECRET_KEY: ${{ secrets.SBR_SECRET_KEY }}
          SIERRA_SECRET_KEY: ${{ secrets.SIERRA_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_API_URL: ${{ secrets.DEEPSEEK_API_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TELEGRAM_HR_CHAT_ID: ${{ secrets.TELEGRAM_HR_CHAT_ID }}
          TELEGRAM_GENERAL_CHAT_ID: ${{ secrets.TELEGRAM_GENERAL_CHAT_ID }}
          WHATSAPP_API_TOKEN: ${{ secrets.WHATSAPP_API_TOKEN }}
          WHATSAPP_API_URL: ${{ secrets.WHATSAPP_API_URL }}
          WHATSAPP_GATEWAY_URL: ${{ secrets.WHATSAPP_GATEWAY_URL }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          INVENTORY_SHEET_ID: ${{ secrets.INVENTORY_SHEET_ID }}
          MASTER_SHEET_ID: ${{ secrets.MASTER_SHEET_ID }}
          SHEETS_WEBAPP_URL: ${{ secrets.SHEETS_WEBAPP_URL }}
          WF_SHEET_WRITE_URL: ${{ secrets.WF_SHEET_WRITE_URL }}
          PROPERTY_FINDER_API_KEY: ${{ secrets.PROPERTY_FINDER_API_KEY }}
          PROPERTY_FINDER_API_SECRET: ${{ secrets.PROPERTY_FINDER_API_SECRET }}
          PF_WEBHOOK_SECRET: ${{ secrets.PF_WEBHOOK_SECRET }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler deploy --name "$CF_WORKER_NAME"
          jq -n '
            {
              NEXT_PUBLIC_SUPABASE_URL: env.NEXT_PUBLIC_SUPABASE_URL,
              NEXT_PUBLIC_SUPABASE_ANON_KEY: env.NEXT_PUBLIC_SUPABASE_ANON_KEY,
              SUPABASE_SERVICE_ROLE_KEY: env.SUPABASE_SERVICE_ROLE_KEY,
              SESSION_SECRET: env.SESSION_SECRET,
              ADMIN_API_KEY: env.ADMIN_API_KEY,
              CRON_SECRET: env.CRON_SECRET,
              SBR_SECRET_KEY: env.SBR_SECRET_KEY,
              SIERRA_SECRET_KEY: env.SIERRA_SECRET_KEY,
              GEMINI_API_KEY: env.GEMINI_API_KEY,
              GOOGLE_AI_API_KEY: env.GOOGLE_AI_API_KEY,
              OPENCLAW_PROVIDER: "gemini",
              AI_MODEL: "gemini-2.5-flash",
              GEMINI_MODEL: "gemini-2.5-flash",
              DEEPSEEK_API_KEY: env.DEEPSEEK_API_KEY,
              DEEPSEEK_API_URL: env.DEEPSEEK_API_URL,
              OPENAI_API_KEY: env.OPENAI_API_KEY,
              GOOGLE_SERVICE_ACCOUNT_KEY: env.GOOGLE_SERVICE_ACCOUNT_KEY,
              GOOGLE_SHEET_ID: env.GOOGLE_SHEET_ID,
              TELEGRAM_BOT_TOKEN: env.TELEGRAM_BOT_TOKEN,
              TELEGRAM_WEBHOOK_SECRET: env.TELEGRAM_WEBHOOK_SECRET,
              TELEGRAM_HR_CHAT_ID: env.TELEGRAM_HR_CHAT_ID,
              TELEGRAM_GENERAL_CHAT_ID: env.TELEGRAM_GENERAL_CHAT_ID,
              WA_ADMIN_NUMBER: "01092048333",
              WHATSAPP_API_TOKEN: env.WHATSAPP_API_TOKEN,
              WHATSAPP_API_URL: env.WHATSAPP_API_URL,
              WHATSAPP_GATEWAY_URL: env.WHATSAPP_GATEWAY_URL,
              WHATSAPP_PHONE_NUMBER_ID: env.WHATSAPP_PHONE_NUMBER_ID,
              INVENTORY_SHEET_ID: env.INVENTORY_SHEET_ID,
              MASTER_SHEET_ID: env.MASTER_SHEET_ID,
              SHEETS_WEBAPP_URL: env.SHEETS_WEBAPP_URL,
              WF_SHEET_WRITE_URL: env.WF_SHEET_WRITE_URL,
              PROPERTY_FINDER_API_KEY: env.PROPERTY_FINDER_API_KEY,
              PROPERTY_FINDER_API_SECRET: env.PROPERTY_FINDER_API_SECRET,
              PF_WEBHOOK_SECRET: env.PF_WEBHOOK_SECRET,
              UPSTASH_REDIS_REST_URL: env.UPSTASH_REDIS_REST_URL,
              UPSTASH_REDIS_REST_TOKEN: env.UPSTASH_REDIS_REST_TOKEN
            } | with_entries(select(.value != null and .value != ""))
          ' > /tmp/cf-secrets-clean.json
          npx wrangler secret bulk /tmp/cf-secrets-clean.json --name "$CF_WORKER_NAME" || \
            echo "::warning::secret bulk sync failed for $CF_WORKER_NAME — deployment stands, sync manually with 'wrangler secret bulk'."
          rm -f /tmp/cf-secrets-clean.json

      - name: Verify custom domains on sierra-estates
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ZONE_ID=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=sierra-estates.net" | jq -r '.result[0].id // empty')
          if [ -z "$ZONE_ID" ]; then
            echo "::warning::zone sierra-estates.net not visible to this token — skipping custom domain verify."
            exit 0
          fi
          for HOST in sierra-estates.net www.sierra-estates.net admin.sierra-estates.net; do
            HTTP_CODE=$(curl -sS -o /tmp/cf-domain.json -w '%{http_code}' -X PUT \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" \
              -d "{\"zone_id\":\"$ZONE_ID\",\"hostname\":\"$HOST\",\"service\":\"$CF_WORKER_NAME\",\"environment\":\"production\"}")
            echo "Custom domain $HOST -> $CF_WORKER_NAME: HTTP $HTTP_CODE"
          done

      - name: Smoke test live production domains & 4-Engine Brain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_WORKER_NAME: sierra-estates
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36'
          HDR="$(mktemp)"
          fetch_status() { # url -> prints HTTP code; headers saved to $HDR
            curl -sS -A "$UA" -D "$HDR" -o /tmp/smoke-body.html -w '%{http_code}' --max-time 20 "$1" || echo 000
          }
          is_waf_challenge() { # code -> 0 if 403 served by the Cloudflare edge (cf-ray present)
            [ "$1" = "403" ] || return 1
            grep -qi '^server:[[:space:]]*cloudflare' "$HDR" 2>/dev/null || return 1
            grep -qi '^cf-ray:' "$HDR" 2>/dev/null
          }
          WAF_ENGAGED=0

          APEX_CODE=000
          for i in $(seq 1 6); do
            APEX_CODE=$(fetch_status "https://sierra-estates.net/")
            if [ "$APEX_CODE" = "200" ] && ! grep -q '^ *Hello world$' /tmp/smoke-body.html; then
              echo "PASS: https://sierra-estates.net/ live (HTTP 200, real Next.js HTML)."
              break
            fi
            if is_waf_challenge "$APEX_CODE"; then WAF_ENGAGED=1; break; fi
            echo "attempt $i: HTTP $APEX_CODE — waiting"; sleep 10
          done

          WWW_CODE=$(fetch_status "https://www.sierra-estates.net/")

          HEALTH_CODE=000
          for j in 1 2 3; do
            HEALTH_CODE=$(fetch_status "https://sierra-estates.net/api/health")
            if [ "$HEALTH_CODE" = "200" ] || is_waf_challenge "$HEALTH_CODE"; then break; fi
            echo "api/health attempt $j: HTTP $HEALTH_CODE — retrying"; sleep 5
          done
          if is_waf_challenge "$HEALTH_CODE"; then WAF_ENGAGED=1; fi

          BRAIN_CODE=000
          for j in 1 2 3; do
            BRAIN_CODE=$(fetch_status "https://sierra-estates.net/api/openclaw-terminal")
            if [ "$BRAIN_CODE" = "200" ] || is_waf_challenge "$BRAIN_CODE"; then break; fi
            echo "api/openclaw-terminal attempt $j: HTTP $BRAIN_CODE — retrying"; sleep 5
          done
          if is_waf_challenge "$BRAIN_CODE"; then WAF_ENGAGED=1; fi

          ADMIN_CODE=$(fetch_status "https://admin.sierra-estates.net/")
          if is_waf_challenge "$ADMIN_CODE"; then WAF_ENGAGED=1; fi

          {
            echo ""
            echo "| Endpoint | HTTP Status | Expected |"
            echo "| :--- | :---: | :---: |"
            echo "| \`https://sierra-estates.net/\` | \`$APEX_CODE\` | \`200\` |"
            echo "| \`https://www.sierra-estates.net/\` | \`$WWW_CODE\` | \`301/308\` |"
            echo "| \`https://sierra-estates.net/api/health\` | \`$HEALTH_CODE\` | \`200\` |"
            echo "| \`https://sierra-estates.net/api/openclaw-terminal\` | \`$BRAIN_CODE\` | \`200\` |"
            echo "| \`https://admin.sierra-estates.net/\` | \`$ADMIN_CODE\` | \`302/200\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "sierra-estates.net:       HTTP $APEX_CODE"
          echo "www.sierra-estates.net:   HTTP $WWW_CODE"
          echo "api/health:               HTTP $HEALTH_CODE"
          echo "api/openclaw-terminal:    HTTP $BRAIN_CODE"
          echo "admin.sierra-estates.net: HTTP $ADMIN_CODE"

          # 2026-11-20: the zone WAF challenges datacenter runners (403 + cf-ray)
          # even when the deploy is healthy. In that mode the HTTP assertions are
          # unverifiable from here — verify the edge itself instead (worker exists
          # + workers.dev health, which zone WAF does not cover), then pass.
          if [ "$WAF_ENGAGED" = "1" ]; then
            echo "::notice::Cloudflare WAF engaged for this datacenter runner (403 + cf-ray). Falling back to Cloudflare API + workers.dev verification."
            EDGE_PASS=$(bash scripts/ops/sierra/verify_edge_via_cf_api.sh && echo PASS || echo FAIL)
            echo "| WAF fallback (CF API + workers.dev) | \`$EDGE_PASS\` | \`PASS\` |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$EDGE_PASS" != "PASS" ]; then
              echo "::error::Edge verification failed while WAF engaged — worker is not serving."
              exit 1
            fi
            echo "::notice::Edge verification passed — worker deployed and serving via workers.dev. Deploy is healthy; zone 200/301 assertions skipped (WAF)."
            exit 0
          fi

          [ "$APEX_CODE" = "200" ] || { echo "::error::Apex returned HTTP $APEX_CODE"; exit 1; }
          [ "$WWW_CODE" = "301" ] || [ "$WWW_CODE" = "308" ] || { echo "::error::www redirect returned HTTP $WWW_CODE"; exit 1; }
          [ "$HEALTH_CODE" = "200" ] || { echo "::error::api/health returned HTTP $HEALTH_CODE"; exit 1; }
          [ "$BRAIN_CODE" = "200" ] || { echo "::error::api/openclaw-terminal returned HTTP $BRAIN_CODE"; exit 1; }
          [ "$ADMIN_CODE" = "302" ] || [ "$ADMIN_CODE" = "200" ] || { echo "::error::admin host returned HTTP $ADMIN_CODE"; exit 1; }
