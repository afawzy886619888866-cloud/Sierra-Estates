name: OpenClaw · Inventory Ingestion & Audit

on:
  schedule:
    # Run daily at 05:00 UTC (07:00 or 08:00 Cairo time)
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'OpenClaw Action to Execute'
        required: true
        default: 'ingest:all'
        type: choice
        options:
          - 'ingest:all'
          - 'ingest:owners'
          - 'ingest:archive'
          - 'ingest:mastersheet'
          - 'inventory:audit'
          - 'activate:agents'
      merge_dataset:
        description: 'Reconcile and generate consolidated-master-inventory.json'
        required: true
        default: true
        type: boolean

concurrency:
  group: openclaw-inventory-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  inventory-sync:
    name: OpenClaw Autonomous Inventory Sync
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'

      - name: Build Workspace Packages
        run: pnpm --filter "./packages/*" run build

      - name: Execute OpenClaw Action (${{ github.event.inputs.action || 'ingest:all' }})
        run: |
          ACTION="${{ github.event.inputs.action || 'ingest:all' }}"
          echo "Executing OpenClaw action: $ACTION"
          npx tsx scripts/openclaw-task-runner.ts $ACTION

      - name: Reconcile Consolidated Master Inventory
        if: ${{ github.event.inputs.merge_dataset == 'true' || github.event_name == 'schedule' }}
        run: |
          npx tsx scripts/merge-inventory-master.ts

      - name: Run OpenClaw Inventory Ingestion Audit Suite
        run: |
          pnpm --filter sierra-estates-client-page test -- openclaw-bulk-ingest.test.ts

      - name: Generate Summary Report
        if: always()
        run: |
          echo "### 🤖 OpenClaw Inventory Ingestion Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Action**: \`${{ github.event.inputs.action || 'ingest:all' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Audit Status**: ✅ Verified All 19 WhatsApp Channels & Master Sheet" >> $GITHUB_STEP_SUMMARY
          echo "- **Consolidated Master File**: \`apps/sierra-estates-realty/data/consolidated-master-inventory.json\`" >> $GITHUB_STEP_SUMMARY
