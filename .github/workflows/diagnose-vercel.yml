name: Diagnose · Vercel deploy logs

# READ-ONLY diagnostic: fetches the build logs of a failed Vercel deployment
# using the repo's VERCEL_TOKEN secret and prints them to the Actions log.
# Dispatch manually with the dpl_ id from the GitHub commit status.

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: 'Vercel deployment id (dpl_...)'
        required: true
        type: string

concurrency:
  group: diagnose-vercel
  cancel-in-progress: false

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch deployment + build logs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TEAM_ID: team_UvdJ5ezVTaqEKyhqZ5QVqOKJ
        run: |
          set -euo pipefail
          DPL="${{ github.event.inputs.deployment_id }}"
          echo "## Deployment $DPL — metadata"
          curl -s "https://api.vercel.com/v13/deployments/$DPL?teamId=$TEAM_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -o /tmp/dpl.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/dpl.json'))
          print('state      :', d.get('state'))
          print('readyState :', d.get('readyState'))
          print('projectId  :', d.get('projectId'))
          err = d.get('errorMessage') or d.get('error') or {}
          print('error      :', json.dumps(err, ensure_ascii=False)[:2000])
          print('creator    :', (d.get('creator') or {}).get('username'))
          PY
          echo "## Build events (errors + tail)"
          for PAGE in 1 2 3 4 5; do
            curl -s "https://api.vercel.com/v3/deployments/$DPL/events?limit=100&build=1&teamId=$TEAM_ID&after=$(([PAGE-1]*100))" \
              -H "Authorization: Bearer $VERCEL_TOKEN" -o /tmp/events_$PAGE.json
          done
          python3 - <<'PY'
          import json, glob
          lines = []
          for f in sorted(glob.glob('/tmp/events_*.json')):
              try:
                  events = json.load(open(f))
              except Exception:
                  continue
              if isinstance(events, dict):
                  events = events.get('events', [])
              for e in events:
                  txt = (e.get('payload') or {}).get('text') or ''
                  for ln in txt.splitlines():
                      lines.append(ln)
          errs = [ln for ln in lines if 'rror' in ln or 'Fail' in ln or 'fail' in ln or 'OOM' in ln or 'heap' in ln.lower()]
          print(f'total log lines: {len(lines)}; error-ish lines: {len(errs)}')
          print('---- ERROR LINES (last 60) ----')
          for ln in errs[-60:]:
              print(ln[:500])
          print('---- LOG TAIL (last 60) ----')
          for ln in lines[-60:]:
              print(ln[:500])
          PY
