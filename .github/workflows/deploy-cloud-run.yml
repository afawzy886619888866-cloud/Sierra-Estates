name: Deploy Python API to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/deploy-cloud-run.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: sierra-blu
  REGION: europe-west1
  SERVICE_NAME: sierra-estates-api
  IMAGE: gcr.io/sierra-blu/sierra-estates-api

jobs:
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build Docker image
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" apps/api/

      - name: Push Docker image
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image "$IMAGE:${{ github.sha }}" \
            --platform managed \
            --region $REGION \
            --project $PROJECT_ID \
            --allow-unauthenticated \
            --port 8000 \
            --memory 512Mi \
            --cpu 1 \
            --max-instances 5 \
            --set-env-vars "LOG_LEVEL=INFO,ALLOWED_ORIGINS=https://sierra-estates.net,https://admin.sierra-estates.net"

      - name: Output service URL
        run: |
          URL=$(gcloud run services describe $SERVICE_NAME \
            --platform managed \
            --region $REGION \
            --project $PROJECT_ID \
            --format "value(status.url)")
          echo "✅ Cloud Run deployed: $URL"
          echo "SERVICE_URL=$URL" >> $GITHUB_SUMMARY
