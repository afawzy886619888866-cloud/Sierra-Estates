name: Cron · Scheduled jobs

# The five scheduled jobs for the realty app run from here, NOT from Vercel crons.
#
# Why: the client Vercel project is on the Hobby plan, which allows at most 2 cron
# jobs and daily schedules only. Declaring all five in vercel.json fails the whole
# deployment — verified on PR #187:
#
#   "Hobby accounts are limited to daily cron jobs. This cron expression
#    (0 */6 * * *) would run more than once per day."
#
# This is the same reason whatsapp-dispatch-cron.yml exists. If the project is ever
# upgraded to Pro, these can move back into apps/sierra-estates-realty/vercel.json
# (see DEPLOYMENT.md §7) — move them, don't duplicate them, or every job fires twice.
#
# Schedules are UTC and match what vercel.json previously declared.
#
# Required repo secret:
#   CRON_SECRET — must match the CRON_SECRET env var on the client Vercel project.
#                 Every route below enforces `Authorization: Bearer $CRON_SECRET`.

on:
  schedule:
    - cron: '0 0 * * *'    # sync-leads + ingest-from-sheets
    - cron: '0 6 * * *'    # sync-listings
    - cron: '0 23 * * *'   # maintenance
    - cron: '0 */6 * * *'  # sync-master-sheet
  # No inputs, deliberately: checkov CKV_GHA_7 requires workflow_dispatch inputs to
  # be empty. A manual run therefore triggers all five endpoints. Each route is
  # idempotent and enforces its own quotas, so that is safe.
  workflow_dispatch:

# checkov CKV2_GHA_1: never inherit write-all. This workflow only makes outbound
# HTTPS calls — it does not read or write repository content.
permissions: {}

concurrency:
  group: scheduled-crons-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  sync-leads:
    if: >-
      github.event.schedule == '0 0 * * *' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger /api/cron/sync-leads
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://sierra-estates.net/api/cron/sync-leads")
          echo "HTTP $code"; cat /tmp/body; echo
          [ "$code" = "200" ]

  ingest-from-sheets:
    if: >-
      github.event.schedule == '0 0 * * *' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger /api/cron/ingest-from-sheets
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://sierra-estates.net/api/cron/ingest-from-sheets")
          echo "HTTP $code"; cat /tmp/body; echo
          [ "$code" = "200" ]

  sync-listings:
    if: >-
      github.event.schedule == '0 6 * * *' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger /api/cron/sync-listings
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://sierra-estates.net/api/cron/sync-listings")
          echo "HTTP $code"; cat /tmp/body; echo
          [ "$code" = "200" ]

  maintenance:
    if: >-
      github.event.schedule == '0 23 * * *' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger /api/cron/maintenance
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://sierra-estates.net/api/cron/maintenance")
          echo "HTTP $code"; cat /tmp/body; echo
          [ "$code" = "200" ]

  sync-master-sheet:
    if: >-
      github.event.schedule == '0 */6 * * *' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger /api/cron/sync-master-sheet
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://sierra-estates.net/api/cron/sync-master-sheet")
          echo "HTTP $code"; cat /tmp/body; echo
          [ "$code" = "200" ]
