# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Automations
# Cloudflare Workers + GitHub Actions scheduler (2026-11-20).
# GitHub Actions dispatches scheduled targets directly to the unified
# Cloudflare Worker `sierra-estates` (`https://sierra-estates.net/api/cron/dispatch/...`),
# with `workflow_dispatch` supporting manual per-job triggers.
#
# Required repository secret: CRON_SECRET (synced to Cloudflare Worker
# `sierra-estates` via deploy-cloudflare.yml). Without it runs fail auth loudly.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Dispatcher target (window name or single job)
        required: true
        type: choice
        default: 'night'
        options:
          - night
          - morning
          - maintenance
          - expire-reservations
          - lead-timers
          - check-availability-sla
          - sync-listings
          - sync-master-sheet
          - ingest-from-sheets
          - sync-leads
          - whatsapp-dispatch
          - apply-migrations
      force:
        description: Bypass the dedupe guard (?force=1)
        required: false
        type: boolean
        default: false
  schedule:
    # Hourly whatsapp-dispatch
    - cron: '10 * * * *'
    # 3-hourly lead timers & SLA checks
    - cron: '25 */3 * * *'
    # Night window (02:10 UTC = 04:10 Cairo)
    - cron: '10 2 * * *'
    # Morning window (06:10 UTC = 08:10 Cairo)
    - cron: '10 6 * * *'
    # Daily sync leads (10:10 UTC = 12:10 Cairo)
    - cron: '10 10 * * *'
  workflow_call:
    secrets:
      CRON_SECRET:
        description: Bearer token for /api/cron/dispatch authentication
        required: false

concurrency:
  group: automations
  cancel-in-progress: false

permissions:
  contents: read

env:
  SITE_URL: https://sierra-estates.net

jobs:
  dispatch:
    name: Trigger automation dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve target for this event
        id: target
        env:
          INPUT_TARGET: ${{ inputs.target }}
        run: |
          # Read schedule dynamically from event payload if triggered by cron; otherwise use input
          SCHEDULE=$(jq -r '.schedule // empty' "$GITHUB_EVENT_PATH" 2>/dev/null || true)
          case "${SCHEDULE}" in
            '10 * * * *')    TARGET='whatsapp-dispatch' ;;
            '25 */3 * * *')  TARGET='lead-timers,check-availability-sla,llm-catalog-refresh' ;;
            '10 2 * * *')    TARGET='night' ;;
            '10 6 * * *')    TARGET='morning' ;;
            '10 10 * * *')   TARGET='sync-leads' ;;
            '')              TARGET="${INPUT_TARGET:-night}" ;;
            *)               echo "Unmapped schedule: ${SCHEDULE}" >&2; exit 1 ;;
          esac
          echo "targets=${TARGET}" >> "$GITHUB_OUTPUT"

      - name: Call the dispatcher for each target
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TARGETS: ${{ steps.target.outputs.targets }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          FORCE="0"
          if [ "${INPUT_FORCE:-false}" = "true" ]; then
            FORCE="1"
          fi
          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::CRON_SECRET is not configured in repository secrets — scheduled work cannot authenticate."
            exit 1
          fi

          status=0
          {
            echo "### Automations Dispatch Summary"
            echo ""
            echo "| Target | Status | Details |"
            echo "| :--- | :---: | :--- |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Warm up the Cloudflare Worker isolate cleanly before dispatching cron targets
          curl -sS -o /dev/null --max-time 20 --retry 1 "${SITE_URL}/api/health" || true

          for target in ${TARGETS//,/ }; do
            echo "── Dispatching '${target}' ─────────────────────────────────"
            RESP_FILE="/tmp/dispatch-${target}.txt"
            if curl -sS --fail-with-body --show-error \
                 --retry 3 --retry-delay 15 --retry-all-errors \
                 --max-time 240 \
                 --write-out '\nHTTP %{http_code} in %{time_total}s\n' \
                 -o "$RESP_FILE" \
                 "${SITE_URL}/api/cron/dispatch/${target}?source=github-actions&force=${FORCE}" \
                 -H "Authorization: Bearer ${CRON_SECRET}"; then
              cat "$RESP_FILE"
              echo "| \`${target}\` | ✅ PASS | HTTP 200 |" >> "$GITHUB_STEP_SUMMARY"
            else
              cat "$RESP_FILE" || true
              echo "::warning::Dispatch '${target}' failed after retries — the failure is recorded in automation_runs + the failed_orchestrations DLQ."
              echo "| \`${target}\` | ❌ FAIL | Recorded in \`failed_orchestrations\` DLQ |" >> "$GITHUB_STEP_SUMMARY"
              status=1
            fi
          done
          exit "${status}"
