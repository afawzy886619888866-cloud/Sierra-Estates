name: Telegram activation watch

# WHY THIS EXISTS (2026-11-13; migrated to Cloudflare 2026-11-19):
# the Telegram lane is wired (migration 044 role chats, /staffsetup, 3-way
# dispatch, env-sync). Once TELEGRAM_BOT_TOKEN is valid at BotFather, this
# watcher automatically completes activation:
#
# HOW IT RUNS:
#   • hourly: getMe with the GitHub secret. 401 Unauthorized = revoked →
#     log an honest one-line skip and exit 0 (green no-op).
#   • valid token → ACTIVATE:
#       1. setWebhook on `${CLIENT_URL}/api/telegram/webhook` (secret_token =
#          TELEGRAM_WEBHOOK_SECRET — the route fails closed without it)
#       2. getWebhookInfo verification (url + pending_update_count)
#       3. sendMessage smoke test to TELEGRAM_CHAT_ID (gracefully warns if
#          TELEGRAM_CHAT_ID is placeholder or owner hasn't tapped /start yet)
#       4. dispatch deploy-cloudflare.yml when live delivery succeeds (to ensure
#          unified Cloudflare Worker `sierra-estates` carries any updated secret)
#       5. self-disable this watcher schedule (re-triggerable via workflow_dispatch)
#
# FAILURE HONESTY: hard API errors fail loudly (red); unstarted personal DM
# (`chat not found` or placeholder TELEGRAM_CHAT_ID) emits an explicit warning
# once the webhook is verified on Cloudflare rather than failing hourly.
#
# SECURITY: the token is used only for api.telegram.org calls from this
# runner and is never printed (curl -s + jq field extraction; no set -x).

on:
  schedule:
    # :47 past the hour — off top-of-hour GitHub cron congestion.
    - cron: "47 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write  # dispatch deploy-cloudflare + self-disable when activated

concurrency:
  group: telegram-activation-watch
  # Contract (actions-and-workflows.test.ts): scheduled workflows never
  # cancel an in-progress sibling run.
  cancel-in-progress: false

jobs:
  watch:
    name: Probe TELEGRAM_BOT_TOKEN and activate the lane when valid
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe token / activate lane
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLIENT_URL: https://sierra-estates.net
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::notice::TELEGRAM_BOT_TOKEN secret is not set — nothing to activate yet. Standing by."
            exit 0
          fi

          # ── 1. Probe the token (values never echoed) ──────────────────
          probe_code=$(curl -s -o /tmp/getme.json -w '%{http_code}' \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe")
          if [ "$probe_code" != "200" ]; then
            # 401 Unauthorized = the known revoked state. Quiet green no-op.
            echo "::notice::Bot token still not accepted by Telegram (HTTP $probe_code) — lane stays honestly skipped. Operator runbook: BotFather → API Token → Revoke → update the TELEGRAM_BOT_TOKEN secret."
            exit 0
          fi
          bot_username=$(jq -r '.result.username // "unknown"' /tmp/getme.json)
          echo "Token VALID for @${bot_username} — activating the Telegram lane."

          # ── 2. Register the webhook on the Phase 6 route ──────────────
          if [ -z "$TELEGRAM_WEBHOOK_SECRET" ]; then
            echo "::error::TELEGRAM_WEBHOOK_SECRET is not set — the webhook route fails closed without it. Set the secret, then this watcher retries within the hour."
            exit 1
          fi
          webhook_url="${CLIENT_URL}/api/telegram/webhook"
          setwh=$(curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            --data-urlencode "url=${webhook_url}" \
            --data-urlencode "secret_token=${TELEGRAM_WEBHOOK_SECRET}" \
            --data-urlencode "drop_pending_updates=false" \
            --data-urlencode "allowed_updates=[\"message\",\"edited_message\"]")
          echo "$setwh" | jq -e '.ok == true' >/dev/null || {
            echo "::error::setWebhook failed: $(echo "$setwh" | jq -r '.description // "unknown"')"
            exit 1
          }
          echo "Webhook registered → ${webhook_url}"

          # ── 3. Verify registration ─────────────────────────────────────
          info=$(curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getWebhookInfo")
          echo "$info" | jq -e --arg url "$webhook_url" '.result.url == $url' >/dev/null || {
            echo "::error::Webhook verification failed — registered url does not match (getWebhookInfo: $(echo "$info" | jq -r '.result.url // "none"'))."
            exit 1
          }
          pending=$(echo "$info" | jq -r '.result.pending_update_count // 0')
          echo "Webhook verified (pending updates: ${pending})."

          # ── 4. Delivery smoke test ─────────────────────────────────────
          SMOKE_DELIVERED="no_chat_id"
          if [ -n "$TELEGRAM_CHAT_ID" ]; then
            case "$TELEGRAM_CHAT_ID" in
              123456789|0|placeholder|your_chat_id)
                echo "::warning::TELEGRAM_CHAT_ID is a placeholder value. Bot @${bot_username} token is VALID and webhook ${webhook_url} is VERIFIED. To enable CEO/staff DMs, open https://t.me/${bot_username}, tap /start, send /staffsetup ceo, and update TELEGRAM_CHAT_ID."
                SMOKE_DELIVERED="skipped_placeholder"
                ;;
              *)
                send=$(curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                  --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
                  --data-urlencode "text=✅ Sierra Estates bot activated on Cloudflare (sierra-estates.net). Webhook verified. Staff: send /staffsetup <role> to register your chat.")
                if echo "$send" | jq -e '.ok == true' >/dev/null; then
                  echo "Smoke message delivered to TELEGRAM_CHAT_ID."
                  SMOKE_DELIVERED="delivered"
                else
                  desc=$(echo "$send" | jq -r '.description // "unknown"')
                  if echo "$desc" | grep -qiE 'chat not found|bot was blocked|user is deactivated'; then
                    echo "::warning::Smoke sendMessage returned '${desc}'. Webhook is registered & verified; open https://t.me/${bot_username}, tap /start, and re-run this workflow via workflow_dispatch once ready."
                    SMOKE_DELIVERED="skipped_unstarted"
                  else
                    echo "::error::Smoke sendMessage failed: ${desc}"
                    exit 1
                  fi
                fi
                ;;
            esac
          else
            echo "::notice::TELEGRAM_CHAT_ID not set — skipping the delivery smoke test (webhook registration is still verified above)."
          fi

          # ── 5. Carry the token to Cloudflare Worker `sierra-estates` ───
          if [ "$SMOKE_DELIVERED" = "delivered" ]; then
            if gh workflow run deploy-cloudflare.yml -R "$GH_REPO" --ref main; then
              echo "deploy-cloudflare dispatched — TELEGRAM_BOT_TOKEN syncs to unified Cloudflare Worker sierra-estates."
            else
              echo "::error::Could not dispatch deploy-cloudflare — fix and let the watcher retry."
              exit 1
            fi
          else
            echo "::notice::Token and webhook (${webhook_url}) are already verified on Cloudflare Worker sierra-estates; skipping redundant redeploy (SMOKE_DELIVERED=${SMOKE_DELIVERED})."
          fi

          {
            echo "### Telegram Activation Status (@${bot_username})"
            echo "- Token probe: **VALID**"
            echo "- Webhook: \`${webhook_url}\` (**VERIFIED**, pending: ${pending})"
            echo "- Smoke DM status: \`${SMOKE_DELIVERED}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          # ── 6. Stand down ──────────────────────────────────────────────
          echo "Telegram lane verified (webhook active, smoke=${SMOKE_DELIVERED}). Disabling hourly watcher schedule; re-run manually via workflow_dispatch if TELEGRAM_CHAT_ID is updated."
          gh api -X PATCH "repos/${GH_REPO}/actions/workflows/telegram-activation-watch.yml" \
            -f state=disabled 2>/dev/null \
            || gh workflow disable "Telegram activation watch" -R "$GH_REPO" || true
