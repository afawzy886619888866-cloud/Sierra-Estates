# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# ─────────────────────────────────────────────────────────────
# Workflows Automation: Owner Search, Contact, Email, Unit Adder
# Standalone automation runners for Sierra Estates backend operations
# ─────────────────────────────────────────────────────────────

name: External Workflows Runner

on:
  schedule:
    # owner-search: Daily at 9am UTC (11am Cairo)
    - cron: '0 9 * * *'
    # owner-contact: Daily at 10am UTC (12pm Cairo)
    - cron: '0 10 * * *'
    # email-sender: Daily at 8am UTC (10am Cairo)
    - cron: '0 8 * * *'
    # unit-adder: Daily at 11am UTC (1pm Cairo)
    - cron: '0 11 * * *'

  workflow_dispatch:
    inputs:
      workflow:
        description: 'Workflow to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - owner-search
          - owner-contact
          - email-sender
          - unit-adder

concurrency:
  group: external-workflows-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Owner Search (Daily at 9am UTC)
  # ─────────────────────────────────────────────────────────────
  owner-search:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' &&
      github.event.schedule == '0 9 * * *' ||
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.workflow == 'all' || github.event.inputs.workflow == 'owner-search')

    timeout-minutes: 15

    steps:
      - name: Check required secrets
        id: secrets
        env:
          PF_KEY: ${{ secrets['PROPERTY_FINDER_JWT_TOKEN'] }}
          GSA_KEY: ${{ secrets['GOOGLE_SERVICE_ACCOUNT_KEY'] }}
        run: |
          if [ -z "$PF_KEY" ] || [ -z "$GSA_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Owner Search skipped::Required secrets not configured (PROPERTY_FINDER_JWT_TOKEN, GOOGLE_SERVICE_ACCOUNT_KEY). See workflows/GITHUB_SECRETS_SETUP.md"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.secrets.outputs.configured == 'true'
        with:
          submodules: false   # repo has no active submodules; prevents ghost-submodule fetch failures

      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.configured == 'true'
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'workflows/package-lock.json'

      - name: Install workflow dependencies
        if: steps.secrets.outputs.configured == 'true'
        run: |
          cd workflows
          npm ci --omit=dev

      - name: Run Owner Search
        if: steps.secrets.outputs.configured == 'true'
        run: cd workflows && npm run owner-search
        env:
          PROPERTY_FINDER_API_BASE: ${{ vars['PROPERTY_FINDER_API_BASE'] || 'https://api.propertyfinder.com.eg/v3' }}
          PROPERTY_FINDER_JWT_TOKEN: ${{ secrets['PROPERTY_FINDER_JWT_TOKEN'] }}
          BROKER_INBOX_SHEET_ID: ${{ vars['BROKER_INBOX_SHEET_ID'] }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets['GOOGLE_SERVICE_ACCOUNT_KEY'] }}

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Owner Search failed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Owner Contact (Daily at 10am UTC)
  # ─────────────────────────────────────────────────────────────
  owner-contact:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' &&
      github.event.schedule == '0 10 * * *' ||
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.workflow == 'all' || github.event.inputs.workflow == 'owner-contact')

    timeout-minutes: 15

    steps:
      - name: Check required secrets
        id: secrets
        env:
          WA_TOKEN: ${{ secrets['WHATSAPP_API_TOKEN'] }}
          GSA_KEY: ${{ secrets['GOOGLE_SERVICE_ACCOUNT_KEY'] }}
        run: |
          if [ -z "$WA_TOKEN" ] || [ -z "$GSA_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Owner Contact skipped::Required secrets not configured (WHATSAPP_API_TOKEN, GOOGLE_SERVICE_ACCOUNT_KEY). See workflows/GITHUB_SECRETS_SETUP.md"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.secrets.outputs.configured == 'true'
        with:
          submodules: false

      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.configured == 'true'
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'workflows/package-lock.json'

      - name: Install workflow dependencies
        if: steps.secrets.outputs.configured == 'true'
        run: |
          cd workflows
          npm ci --omit=dev

      - name: Run Owner Contact
        if: steps.secrets.outputs.configured == 'true'
        run: cd workflows && npm run owner-contact
        env:
          WHATSAPP_API_URL: ${{ vars['WHATSAPP_API_URL'] }}
          WHATSAPP_API_TOKEN: ${{ secrets['WHATSAPP_API_TOKEN'] }}
          BROKER_INBOX_SHEET_ID: ${{ vars['BROKER_INBOX_SHEET_ID'] }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets['GOOGLE_SERVICE_ACCOUNT_KEY'] }}

      - name: Notify on failure
        if: failure()
        run: echo "❌ Owner Contact failed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

  # ─────────────────────────────────────────────────────────────
  # JOB 3: Email Sender (Daily at 8am UTC)
  # ─────────────────────────────────────────────────────────────
  email-sender:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' &&
      github.event.schedule == '0 8 * * *' ||
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.workflow == 'all' || github.event.inputs.workflow == 'email-sender')

    timeout-minutes: 15

    steps:
      - name: Check required secrets
        id: secrets
        env:
          SG_KEY: ${{ secrets['SENDGRID_API_KEY'] }}
          GSA_KEY: ${{ secrets['GOOGLE_SERVICE_ACCOUNT_KEY'] }}
        run: |
          if [ -z "$SG_KEY" ] || [ -z "$GSA_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Email Sender skipped::Required secrets not configured (SENDGRID_API_KEY, GOOGLE_SERVICE_ACCOUNT_KEY). See workflows/GITHUB_SECRETS_SETUP.md"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.secrets.outputs.configured == 'true'
        with:
          submodules: false

      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.configured == 'true'
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'workflows/package-lock.json'

      - name: Install workflow dependencies
        if: steps.secrets.outputs.configured == 'true'
        run: |
          cd workflows
          npm ci --omit=dev

      - name: Run Email Sender
        if: steps.secrets.outputs.configured == 'true'
        run: cd workflows && npm run email-sender
        env:
          SENDGRID_API_KEY: ${{ secrets['SENDGRID_API_KEY'] }}
          SENDGRID_FROM_EMAIL: ${{ vars['SENDGRID_FROM_EMAIL'] || 'noreply@sierra-estates.net' }}
          BROKER_INBOX_SHEET_ID: ${{ vars['BROKER_INBOX_SHEET_ID'] }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets['GOOGLE_SERVICE_ACCOUNT_KEY'] }}

      - name: Notify on failure
        if: failure()
        run: echo "❌ Email Sender failed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

  # ─────────────────────────────────────────────────────────────
  # JOB 4: Unit Adder (Every 30 minutes)
  # ─────────────────────────────────────────────────────────────
  unit-adder:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' &&
      github.event.schedule == '0 11 * * *' ||
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.workflow == 'all' || github.event.inputs.workflow == 'unit-adder')

    timeout-minutes: 5

    steps:
      - name: Check required secrets
        id: secrets
        env:
          GSA_KEY: ${{ secrets['GOOGLE_SERVICE_ACCOUNT_KEY'] }}
          SHEET_ID: ${{ vars['BROKER_INBOX_SHEET_ID'] }}
        run: |
          if [ -z "$GSA_KEY" ] || [ -z "$SHEET_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Unit Adder skipped::Required secrets not configured (GOOGLE_SERVICE_ACCOUNT_KEY, BROKER_INBOX_SHEET_ID). See workflows/GITHUB_SECRETS_SETUP.md"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.secrets.outputs.configured == 'true'
        with:
          submodules: false

      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.configured == 'true'
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'workflows/package-lock.json'

      - name: Install workflow dependencies
        if: steps.secrets.outputs.configured == 'true'
        run: |
          cd workflows
          npm ci --omit=dev

      - name: Run Unit Adder
        if: steps.secrets.outputs.configured == 'true'
        run: cd workflows && npm run unit-adder
        env:
          FIREBASE_PROJECT_ID: ${{ vars['FIREBASE_PROJECT_ID'] || 'sierra-blu' }}
          FIREBASE_PRIVATE_KEY: ${{ secrets['FIREBASE_PRIVATE_KEY'] }}
          FIREBASE_CLIENT_EMAIL: ${{ vars['FIREBASE_CLIENT_EMAIL'] }}
          BROKER_INBOX_SHEET_ID: ${{ vars['BROKER_INBOX_SHEET_ID'] }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets['GOOGLE_SERVICE_ACCOUNT_KEY'] }}

      - name: Notify on failure
        if: failure()
        run: echo "❌ Unit Adder failed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

  # ─────────────────────────────────────────────────────────────
  # JOB 5: Health Check Summary
  # ─────────────────────────────────────────────────────────────
  summary:
    runs-on: ubuntu-latest
    needs: [owner-search, owner-contact, email-sender, unit-adder]
    if: always()

    steps:
      - name: Workflow Status Summary
        run: |
          echo "Owner Search: ${{ needs.owner-search.result }}"
          echo "Owner Contact: ${{ needs.owner-contact.result }}"
          echo "Email Sender: ${{ needs.email-sender.result }}"
          echo "Unit Adder: ${{ needs.unit-adder.result }}"
