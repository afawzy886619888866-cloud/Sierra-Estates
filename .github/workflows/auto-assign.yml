name: Auto-assign PR

on:
  pull_request:
    types: [opened, reopened]

concurrency:
  group: auto-assign-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  issues: write

jobs:
  auto-assign:
    name: Auto-assign PR to author
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Auto-assign PR to author
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr?.user?.login;

            if (!author) {
              console.log('No PR author found, skipping assignment.');
              return;
            }

            if (pr.user.type === 'Bot' || author.endsWith('[bot]') || author.includes('[bot]')) {
              console.log(`Skipping auto-assign for bot author: ${author}`);
              return;
            }

            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                assignees: [author]
              });
              console.log(`Successfully assigned PR #${pr.number} to ${author}`);
            } catch (error) {
              console.warn(`Could not assign PR #${pr.number} to ${author}: ${error.message}`);
            }

