# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# IDE NOTE: secrets/vars context warnings are false positives — this repo uses runtime-resolved
# GitHub Actions secrets that cannot be statically verified offline.
name: CI · Tests & Lint

# Runs on every push to main and every PR targeting main.
# Acts as a merge gate — all jobs must pass before deploy-vercel.yml runs.

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - 'workflows/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - 'tsconfig*.json'
      - '.github/workflows/ci-tests.yml'
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  PUPPETEER_SKIP_DOWNLOAD: "true"
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: TypeScript — Lint + Type-check + Tests
  # ─────────────────────────────────────────────────────────────
  ts-lint-test:
    name: TS · Lint / Type-check / Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint via Turbo)
        run: pnpm lint

      - name: Type-check (tsc via Turbo)
        run: pnpm type-check

      - name: Run test suite (Vitest CI)
        run: pnpm test:ci
        env:
          # Stub Firebase env so tests that import config don't crash
          NEXT_PUBLIC_FIREBASE_API_KEY: "test-api-key"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "sierra-blu.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "sierra-blu"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "sierra-blu.firebasestorage.app"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "941030513456"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:941030513456:web:56209a1495d69f217086f5"
          NEXT_PUBLIC_APP_ENV: "test"

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Python Scripts Lint
  # ─────────────────────────────────────────────────────────────
  python-lint:
    name: Python · Pylint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install lint dependencies
        run: pip install pylint openpyxl

      - name: Pylint — consolidate_single_inventory
        run: |
          pylint scripts/consolidate_single_inventory.py \
            --fail-under=8 \
            --disable=C0301 \
            --output-format=colorized

      - name: Pylint — other Python scripts (warn-only)
        run: |
          find scripts -name "*.py" \
            ! -name "consolidate_single_inventory.py" \
            -print0 \
          | xargs -0 -r pylint \
              --fail-under=6 \
              --disable=C0301,W0611 \
              --output-format=colorized \
          || echo "::warning::Non-critical Python scripts have lint issues — see output above"

  # ─────────────────────────────────────────────────────────────
  # JOB 3: Workflow YAML — validate env-safety script
  # ─────────────────────────────────────────────────────────────
  env-safety:
    name: Env · Public key safety check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate public env safety
        run: node scripts/check-public-env-safety.mjs

      - name: Validate Firebase rules syntax
        run: node scripts/check-firebase-rules.mjs
        continue-on-error: true   # rules check needs Firebase CLI — non-blocking in CI

  # ─────────────────────────────────────────────────────────────
  # JOB 4: Summary gate (all jobs must pass)
  # ─────────────────────────────────────────────────────────────
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [ts-lint-test, python-lint, env-safety]
    if: always()

    steps:
      - name: Evaluate results
        run: |
          echo "TS Lint/Test:  ${{ needs.ts-lint-test.result }}"
          echo "Python Lint:   ${{ needs.python-lint.result }}"
          echo "Env Safety:    ${{ needs.env-safety.result }}"

          if [[ "${{ needs.ts-lint-test.result }}" == "failure" || \
                "${{ needs.python-lint.result }}" == "failure" ]]; then
            echo "❌ CI gate failed — one or more required jobs failed."
            exit 1
          else
            echo "✅ CI gate passed."
          fi
