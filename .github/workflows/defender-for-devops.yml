# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
#
# Microsoft Security DevOps (MSDO) is a command line application which integrates static analysis tools into the development cycle.
# MSDO installs, configures and runs the latest versions of static analysis tools
# (including, but not limited to, SDL/security and compliance tools).
#
# The Microsoft Security DevOps action is currently in beta and runs on the windows-latest queue,
# as well as Windows self hosted agents. ubuntu-latest support coming soon.
#
# For more information about the action , check out https://github.com/microsoft/security-devops-action
#
# Please note this workflow do not integrate your GitHub Org with Microsoft Defender For DevOps. You have to create an integration
# and provide permission before this can report data back to azure.
# Read the official documentation here : https://learn.microsoft.com/en-us/azure/defender-for-cloud/quickstart-onboard-github

name: "Microsoft Defender For Devops"

permissions:
  contents: read
  security-events: write

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '24 7 * * 0'

jobs:
  MSDO:
    # currently only windows latest is supported
    runs-on: windows-latest
    timeout-minutes: 10
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false   # repo has no active submodules; prevents ghost-submodule fetch failures
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          5.0.x
          6.0.x
    - name: Run Microsoft Security DevOps
      uses: microsoft/security-devops-action@v1.6.0
      id: msdo
      with:
        # bandit (Python/Bandit via Guardian's bandit_runner.exe) crashes on this
        # repo: Win32Exception "filename or extension is too long" launching the
        # tool against this monorepo's long pnpm-nested paths on windows-latest.
        # It aborts the whole job even though the real analyzers below complete
        # successfully. Pinned to the tools that actually run until upstream
        # fixes the Windows path-length crash.
        tools: antimalware,checkov,eslint,templateanalyzer
    - name: Upload results to Security tab
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.msdo.outputs.sarifFile }}
