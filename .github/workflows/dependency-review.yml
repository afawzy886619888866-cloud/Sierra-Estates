name: Dependency Review

# Fails the pipeline when a PR introduces dependencies with known
# vulnerabilities or license problems. Pinned by
# __tests__/actions-and-workflows.test.ts (must exist, explicit permissions).

on:
  pull_request:
    paths:
      - '**/package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
