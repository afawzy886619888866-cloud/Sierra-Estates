name: Jira Sync

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  jira-sync:
    name: Detect Jira Issue & Link GitHub Activity
    runs-on: ubuntu-latest
    env:
      JIRA_BASE_URL: ${{ secrets['JIRA_BASE_URL'] }}
      JIRA_API_TOKEN: ${{ secrets['JIRA_API_TOKEN'] }}
      JIRA_USER_EMAIL: ${{ secrets['JIRA_USER_EMAIL'] }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: Extract Jira Issue Key
        id: jira_key
        shell: bash
        run: |
          SEARCH_TEXT=""
          PR_TITLE=$(jq -r '.pull_request.title // empty' "$GITHUB_EVENT_PATH" 2>/dev/null || true)
          PR_BODY=$(jq -r '.pull_request.body // empty' "$GITHUB_EVENT_PATH" 2>/dev/null || true)
          if [ -n "$PR_TITLE" ] || [ -n "$PR_BODY" ]; then
            SEARCH_TEXT="${PR_TITLE} ${PR_BODY}"
          else
            SEARCH_TEXT="$(git log -1 --pretty=%B) $(git branch --show-current)"
          fi

          echo "Searching text for Jira issue key..."
          # Match standard Jira issue keys like SE-101, PROJ-452
          JIRA_KEY=$(echo "$SEARCH_TEXT" | grep -oE '[A-Z][A-Z0-9]+-[0-9]+' | head -n 1 || true)

          if [ -n "$JIRA_KEY" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "key=$JIRA_KEY" >> "$GITHUB_OUTPUT"
            echo "Detected Jira issue key: $JIRA_KEY"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No Jira issue key detected in branch or PR title."
          fi

      - name: Verify Jira Configuration Secrets
        id: check_secrets
        shell: bash
        run: |
          if [ -n "$JIRA_BASE_URL" ] && [ -n "$JIRA_API_TOKEN" ] && [ -n "$JIRA_USER_EMAIL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice ::Jira credentials (JIRA_BASE_URL, JIRA_USER_EMAIL, JIRA_API_TOKEN) are not configured in repository secrets."
          fi

      - name: Post Comment to Jira Issue
        if: steps.jira_key.outputs.found == 'true' && steps.check_secrets.outputs.configured == 'true'
        shell: bash
        env:
          JIRA_KEY: ${{ steps.jira_key.outputs.key }}
        run: |
          CLEAN_URL=$(echo "$JIRA_BASE_URL" | sed 's:/*$::')
          AUTH_HEADER="Basic $(echo -n "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" | base64 -w 0)"

          PR_NUM=$(jq -r '.pull_request.number // empty' "$GITHUB_EVENT_PATH" 2>/dev/null || true)
          PR_URL=$(jq -r '.pull_request.html_url // empty' "$GITHUB_EVENT_PATH" 2>/dev/null || true)
          PR_TITLE=$(jq -r '.pull_request.title // empty' "$GITHUB_EVENT_PATH" 2>/dev/null || true)

          if [ -n "$PR_NUM" ]; then
            MSG="GitHub PR #${PR_NUM} linked by @${{ github.actor }}: ${PR_URL}\nTitle: ${PR_TITLE}"
          else
            MSG="GitHub commit ${{ github.sha }} pushed to main by @${{ github.actor }}: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}\nCommit: $(git log -1 --pretty=%s)"
          fi

          PAYLOAD=$(cat <<EOF
          {
            "body": {
              "type": "doc",
              "version": 1,
              "content": [
                {
                  "type": "paragraph",
                  "content": [
                    { "type": "text", "text": "$MSG" }
                  ]
                }
              ]
            }
          }
          EOF
          )

          curl -s -S -X POST "$CLEAN_URL/rest/api/3/issue/$JIRA_KEY/comment" \
            -H "Authorization: $AUTH_HEADER" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || echo "Warning: Jira comment request failed"
