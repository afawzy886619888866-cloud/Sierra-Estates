name: Backend Tests

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'functions/**'
      - '.github/workflows/backend-tests.yml'
      - 'scripts/test-backend.sh'
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'functions/**'
      - '.github/workflows/backend-tests.yml'
      - 'scripts/test-backend.sh'

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-backend:
    name: Python (apps/api)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false   # repo has no active submodules; prevents ghost-submodule fetch failures
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        working-directory: apps/api
        run: pip install -r requirements.txt pytest
      - name: Run pytest
        working-directory: apps/api
        run: pytest -v
