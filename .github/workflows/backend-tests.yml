name: Backend Tests

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'functions/**'
      - '.github/workflows/backend-tests.yml'
      - 'scripts/test-backend.sh'
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'functions/**'
      - '.github/workflows/backend-tests.yml'
      - 'scripts/test-backend.sh'
  workflow_dispatch: {}

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-backend:
    name: Python (apps/api)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false   # repo has no active submodules; prevents ghost-submodule fetch failures
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        working-directory: apps/api
        run: pip install -r requirements.txt pytest
      - name: Run pytest
        working-directory: apps/api
        run: pytest -v

  functions-backend:
    name: Firebase Functions (functions/)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false   # repo has no active submodules; prevents ghost-submodule fetch failures
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-audit --no-fund --no-workspaces --install-strategy=nested
              jest@^29 firebase-admin@^13 firebase-functions@^6 typescript@^5 @types/node@^20
      - run: ./node_modules/.bin/tsc
      - run: npx jest --ci

