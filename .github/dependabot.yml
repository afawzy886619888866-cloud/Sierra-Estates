version: 2
updates:
  # Monorepo root & apps
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    groups:
      next-ecosystem:
        patterns: ["next", "react", "react-dom", "@next/*", "eslint-config-next"]
      supabase-ecosystem:
        patterns: ["@supabase/*", "supabase"]
      opentelemetry:
        patterns: ["@opentelemetry/*"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*", "postcss", "autoprefixer"]
      typescript-tooling:
        patterns: ["typescript", "@types/*", "eslint", "eslint-*", "typescript-eslint"]
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    ignore:
      # open-memory is a vendored/external subpackage — ignore its deps to avoid noise PRs
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]


  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
      - "automated"
    commit-message:
      prefix: "chore(actions)"
