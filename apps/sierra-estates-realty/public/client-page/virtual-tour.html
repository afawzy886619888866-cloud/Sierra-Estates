<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<script>document.documentElement.classList.add('js');</script>
<title>Sierra Estates · 3D Virtual Tour</title>
<meta name="description" content="Explore Sierra Estates flagship New Cairo units in immersive 3D — powered by Listing3D."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="shared.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
html,body{width:100%;height:100%;background:#07111E;color:#fff;font-family:'Plus Jakarta Sans',sans-serif;overflow:hidden;}
::-webkit-scrollbar{display:none;}

/* ── Top bar ───────────────────────────── */
#topbar{
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 20px;
  background:rgba(7,17,30,0.72);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(233,193,118,0.12);
}
.tb-left{display:flex;align-items:center;gap:14px;}
.tb-home{
  display:flex;align-items:center;gap:6px;
  color:#fff;text-decoration:none;
  font-size:12px;font-weight:600;letter-spacing:.04em;
  background:rgba(255,255,255,0.08);
  padding:6px 12px;border-radius:8px;
  border:1px solid rgba(255,255,255,0.12);
  transition:background .18s;
}
.tb-home:hover{background:rgba(255,255,255,0.15);}
.tb-badge{
  display:flex;align-items:center;gap:7px;
  font-family:'JetBrains Mono',monospace;font-size:10px;
  color:#e9c176;letter-spacing:.18em;text-transform:uppercase;
}
.tb-dot{
  width:7px;height:7px;border-radius:50%;
  background:#c8961a;box-shadow:0 0 10px rgba(200,150,26,.8);
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.6;transform:scale(.85);}}
.tb-powered{
  display:flex;align-items:center;gap:6px;
  font-family:'JetBrains Mono',monospace;font-size:10px;
  color:rgba(255,255,255,.45);letter-spacing:.06em;
}
.tb-powered strong{color:#e9c176;font-weight:500;}

/* ── Full-screen iframe wrapper ─────────── */
#tour-wrap{
  position:fixed;
  top:49px;left:0;right:0;bottom:0;
  background:#040d18;
}
#tour-frame{
  width:100%;height:100%;
  border:none;display:block;
}

/* ── Bottom caption strip ───────────────── */
#caption{
  position:fixed;bottom:0;left:0;right:0;z-index:99;
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 20px 12px;
  background:linear-gradient(to top,rgba(7,17,30,.9) 0%,transparent 100%);
  pointer-events:none;
}
.cap-text{font-size:12px;color:rgba(255,255,255,.55);}
.cap-text strong{color:#e9c176;font-weight:600;}
.cap-fs{
  pointer-events:auto;
  display:flex;align-items:center;gap:6px;
  font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:#e9c176;text-decoration:none;
  background:rgba(200,150,26,0.12);
  border:1px solid rgba(200,150,26,0.3);
  padding:6px 14px;border-radius:8px;
  transition:background .18s;
}
.cap-fs:hover{background:rgba(200,150,26,0.22);}
</style>
</head>
<body>

<!-- Top bar -->
<header id="topbar">
  <div class="tb-left">
    <a href="index.html" target="_top" class="tb-home">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Home
    </a>
    <div class="tb-badge">
      <span class="tb-dot"></span>
      Sierra Estates · 3D Virtual Tour
    </div>
  </div>
  <div class="tb-powered">
    Powered by <strong>Listing3D</strong>
  </div>
</header>

<!-- Full-screen Listing3D iframe -->
<div id="tour-wrap">
  <iframe
    id="tour-frame"
    src="https://listing3d.com/embed/r39d0bd4dde0a4fe693c7fe5fd230a896"
    title="Sierra Estates — 3D Virtual Tour"
    allow="xr-spatial-tracking; gyroscope; accelerometer; fullscreen"
    allowfullscreen
  ></iframe>
</div>

<!-- Bottom caption -->
<div id="caption">
  <div class="cap-text">
    <strong>Sierra Estates — Flagship Unit</strong> · New Cairo · Use mouse or touch to explore
  </div>
  <a href="https://listing3d.com/embed/r39d0bd4dde0a4fe693c7fe5fd230a896"
     target="_blank" rel="noopener noreferrer" class="cap-fs">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h6m0 0v6m0-6L10 14M9 3H3v18h18v-6"/></svg>
    Full Screen
  </a>
</div>

</body>
</html>
