<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Sierra Estates · Three.js 3D Virtual Tour</title>
<link rel="icon" href="logo-mark-96.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
<link rel="preconnect" href="https://images.unsplash.com" crossorigin="anonymous"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://unpkg.com/lucide@0.294.0/dist/umd/lucide.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
html,body{width:100%;height:100%;overflow:hidden;background:#060d15;color:#fff;font-family:'Plus Jakarta Sans',sans-serif;}
#webgl-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;}
#webgl-canvas:active{cursor:grabbing;}

/* ── Top Bar ── */
.tour-topbar{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:linear-gradient(180deg,rgba(6,13,21,.92) 0%,rgba(6,13,21,.4) 75%,transparent 100%);pointer-events:none;}
.tour-topbar>*{pointer-events:auto;}
.tb-brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff;}
.tb-back{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:999px;text-decoration:none;transition:all .2s;}
.tb-back:hover{background:rgba(255,255,255,.2);border-color:#e9c176;}
.tb-badge{display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;color:#e9c176;letter-spacing:.16em;text-transform:uppercase;background:rgba(200,150,26,.14);border:1px solid rgba(200,150,26,.3);padding:6px 12px;border-radius:999px;}
.tb-dot{width:7px;height:7px;border-radius:50%;background:#34d399;box-shadow:0 0 8px #34d399;animation:pulseDot 2s infinite;}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.8);}}

.tb-actions{display:flex;align-items:center;gap:10px;}
.tb-btn{background:rgba(255,255,255,.1);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);color:#fff;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;cursor:pointer;transition:all .2s;}
.tb-btn:hover{background:rgba(200,150,26,.3);border-color:#e9c176;color:#e9c176;}

/* ── Floating 3D Room Info HUD ── */
.room-hud{position:fixed;top:80px;left:24px;z-index:90;background:rgba(6,13,21,.75);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(233,193,118,.25);border-radius:14px;padding:16px 20px;max-width:320px;pointer-events:none;transition:opacity .3s,transform .3s;}
.room-hud-tag{font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:700;color:#e9c176;letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px;}
.room-hud-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:#fff;margin-bottom:4px;}
.room-hud-sub{font-size:12px;color:rgba(255,255,255,.75);line-height:1.4;}

/* ── Radar / Compass Minimap ── */
.radar-box{position:fixed;top:80px;right:24px;z-index:90;width:68px;height:68px;border-radius:50%;background:rgba(6,13,21,.75);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(200,150,26,.3);display:grid;place-items:center;}
.radar-dial{position:relative;width:52px;height:52px;border-radius:50%;border:1px dashed rgba(233,193,118,.35);}
.radar-sweep{position:absolute;top:50%;left:50%;width:22px;height:22px;background:conic-gradient(from 0deg,rgba(52,211,153,.5),transparent 60deg);border-radius:50%;transform-origin:0 0;}
.radar-needle{position:absolute;top:50%;left:50%;width:2px;height:22px;background:#e9c176;transform-origin:50% 0%;transform:translate(-50%,-100%);box-shadow:0 0 6px #e9c176;}

/* ── Bottom Room Switcher Strip ── */
.tour-bottombar{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:100;display:flex;align-items:center;gap:8px;background:rgba(6,13,21,.85);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(233,193,118,.3);padding:8px 12px;border-radius:999px;box-shadow:0 20px 50px rgba(0,0,0,.6);max-width:94vw;overflow-x:auto;}
.room-btn{display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;border:1px solid transparent;background:transparent;color:rgba(255,255,255,.7);font-family:'Plus Jakarta Sans',sans-serif;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .2s;}
.room-btn:hover{color:#fff;background:rgba(255,255,255,.08);}
.room-btn.active{background:linear-gradient(135deg,#c8961a,#e9c176);color:#09090f;font-weight:700;border-color:rgba(255,255,255,.4);box-shadow:0 4px 14px rgba(200,150,26,.4);}

/* ── Interactive 3D Floating Hotspots ── */
.hotspot-beacon{position:absolute;transform:translate(-50%,-50%);z-index:50;pointer-events:auto;cursor:pointer;}
.beacon-core{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#e9c176,#c8961a);display:grid;place-items:center;color:#09090f;font-size:10px;font-weight:800;box-shadow:0 0 12px rgba(233,193,118,.8);border:2px solid #fff;transition:transform .2s;}
.beacon-pulse{position:absolute;inset:-8px;border-radius:50%;background:rgba(233,193,118,.4);animation:beaconRings 2.2s infinite;}
@keyframes beaconRings{0%{transform:scale(.7);opacity:.9;}100%{transform:scale(2.4);opacity:0;}}
.hotspot-beacon:hover .beacon-core{transform:scale(1.2);}
.hotspot-tooltip{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);background:rgba(6,13,21,.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(233,193,118,.35);padding:6px 12px;border-radius:8px;font-size:11px;font-weight:700;color:#fff;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s;}
.hotspot-beacon:hover .hotspot-tooltip{opacity:1;}

/* ── Tour Loading Cover ── */
#tour-loading{position:fixed;inset:0;z-index:999;background:radial-gradient(circle at center,#102438 0%,#060d15 100%);display:grid;place-items:center;transition:opacity .6s;}
.tl-in{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;}
.tl-spinner{width:48px;height:48px;border-radius:50%;border:3px solid rgba(233,193,118,.2);border-top-color:#e9c176;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

@media(max-width:680px){
  .room-hud{top:auto;bottom:84px;left:14px;right:14px;max-width:none;}
  .radar-box{display:none;}
  .tour-bottombar{bottom:14px;padding:6px 8px;}
  .room-btn{padding:7px 12px;font-size:11.5px;}
}
</style>
</head>
<body>

<!-- Three.js Canvas -->
<canvas id="webgl-canvas"></canvas>

<!-- Hotspot DOM Container -->
<div id="hotspot-container" style="position:absolute;inset:0;pointer-events:none;overflow:hidden;"></div>

<!-- Top Bar -->
<header class="tour-topbar">
  <div style="display:flex;align-items:center;gap:14px;">
    <a href="index.html" class="tb-back">
      <i data-lucide="arrow-left" style="width:14px;height:14px;"></i> Home
    </a>
    <div class="tb-badge">
      <span class="tb-dot"></span>
      Three.js 3D Virtual Tour · Flagship Villa
    </div>
  </div>

  <div class="tb-actions">
    <button class="tb-btn" id="btn-autorotate" title="Toggle Auto-Rotation">
      <i data-lucide="rotate-cw" style="width:16px;height:16px;"></i>
    </button>
    <button class="tb-btn" id="btn-fullscreen" title="Toggle Fullscreen">
      <i data-lucide="maximize" style="width:16px;height:16px;"></i>
    </button>
    <a href="properties.html" class="tb-back" style="margin-inline-start:4px;">
      View Listing
    </a>
  </div>
</header>

<!-- Room HUD -->
<div class="room-hud" id="room-hud">
  <div class="room-hud-tag" id="hud-tag">SIERRA SIGNATURE · 5TH SETTLEMENT</div>
  <div class="room-hud-title" id="hud-title">Grand Living Room</div>
  <div class="room-hud-sub" id="hud-sub">Double-height glass facade overlooking the private infinity pool and central park.</div>
</div>

<!-- Radar Minimap -->
<div class="radar-box">
  <div class="radar-dial">
    <div class="radar-needle" id="radar-needle"></div>
  </div>
</div>

<!-- Room Switcher Toolbar -->
<nav class="tour-bottombar" id="room-bar"></nav>

<!-- Loading Overlay -->
<div id="tour-loading">
  <div class="tl-in">
    <div class="tl-spinner"></div>
    <div style="font-family:'Playfair Display',serif;font-size:22px;letter-spacing:.2em;">SIERRA ESTATES</div>
    <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#e9c176;letter-spacing:.16em;text-transform:uppercase;">Loading 3D Three.js Engine…</div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // Room definitions with 360 panoramic equirectangular textures
  var ROOMS = [
    {
      id: 'living',
      name: 'Grand Living Room',
      tag: 'LEVEL 1 · 120 M²',
      sub: 'Double-height glass facade overlooking the private infinity pool and central park.',
      img: 'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=2400&q=85',
      hotspots: [
        { title: 'Terrace & Pool Deck', target: 'pool', x: 0.8, y: -0.1, z: -0.5 },
        { title: 'Master Bedroom Suite', target: 'master', x: -0.7, y: 0.3, z: 0.6 }
      ]
    },
    {
      id: 'master',
      name: 'Master Bedroom Suite',
      tag: 'LEVEL 2 · 85 M²',
      sub: 'Floor-to-ceiling Italian marble, private dressing room, and balcony with golf course view.',
      img: 'https://images.unsplash.com/photo-1618773928121-c32242e63f39?w=2400&q=85',
      hotspots: [
        { title: 'Return to Living Room', target: 'living', x: 0.7, y: -0.2, z: 0.6 },
        { title: 'Rooftop Sky Terrace', target: 'terrace', x: -0.6, y: 0.4, z: -0.6 }
      ]
    },
    {
      id: 'courtyard',
      name: 'Garden Courtyard',
      tag: 'GROUND · 240 M²',
      sub: 'Private landscaped green sanctuary with mature olive trees and outdoor dining pavilion.',
      img: 'https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=2400&q=85',
      hotspots: [
        { title: 'Grand Living Room', target: 'living', x: -0.8, y: 0.1, z: 0.5 },
        { title: 'Infinity Pool & Deck', target: 'pool', x: 0.6, y: -0.1, z: -0.7 }
      ]
    },
    {
      id: 'pool',
      name: 'Infinity Pool & Deck',
      tag: 'OUTDOOR · 160 M²',
      sub: 'Heated infinity edge pool with sunken seating, fire pit, and ambient night lighting.',
      img: 'https://images.unsplash.com/photo-1571003123894-1f0594d2b5d9?w=2400&q=85',
      hotspots: [
        { title: 'Garden Courtyard', target: 'courtyard', x: -0.7, y: 0.1, z: 0.7 },
        { title: 'Grand Living Room', target: 'living', x: 0.8, y: 0.2, z: 0.5 }
      ]
    },
    {
      id: 'terrace',
      name: 'Rooftop Sky Terrace',
      tag: 'ROOFTOP · 110 M²',
      sub: '360° unobstructed panoramic views over Hyde Park and New Cairo skyline.',
      img: 'https://images.unsplash.com/photo-1622547748225-3fc4abd2cca0?w=2400&q=85',
      hotspots: [
        { title: 'Master Bedroom Suite', target: 'master', x: 0.5, y: -0.3, z: 0.8 },
        { title: 'Grand Living Room', target: 'living', x: -0.8, y: -0.2, z: -0.5 }
      ]
    }
  ];

  var currentRoomIndex = 0;
  var isAutoRotate = true;
  var scene, camera, renderer, controls, sphereMesh;
  var textureLoader = new THREE.TextureLoader();
  var cachedTextures = {};
  var canvas = document.getElementById('webgl-canvas');
  var hotspotContainer = document.getElementById('hotspot-container');
  var radarNeedle = document.getElementById('radar-needle');

  function initThree() {
    // Scene & Camera
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 0.1);

    // Renderer
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // OrbitControls
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableZoom = true;
    controls.minDistance = 0.1;
    controls.maxDistance = 50;
    controls.enablePan = false;
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.rotateSpeed = -0.35; // Inverted for intuitive inside-sphere panning
    controls.autoRotate = isAutoRotate;
    controls.autoRotateSpeed = 0.5;

    // 360 Inverted Sphere Geometry
    var geometry = new THREE.SphereGeometry(500, 60, 40);
    geometry.scale(-1, 1, 1); // Invert faces inwards

    var material = new THREE.MeshBasicMaterial({ color: 0x111111 });
    sphereMesh = new THREE.Mesh(geometry, material);
    scene.add(sphereMesh);

    // Build Room Bar
    var roomBar = document.getElementById('room-bar');
    roomBar.innerHTML = ROOMS.map(function (r, i) {
      return '<button class="room-btn' + (i === 0 ? ' active' : '') + '" data-idx="' + i + '" type="button">' +
        '<span>' + r.name + '</span>' +
        '</button>';
    }).join('');

    roomBar.querySelectorAll('.room-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var idx = parseInt(this.getAttribute('data-idx'), 10);
        switchRoom(idx);
      });
    });

    // Load initial room
    loadRoomTexture(0, function () {
      document.getElementById('tour-loading').style.opacity = '0';
      setTimeout(function () {
        document.getElementById('tour-loading').style.display = 'none';
      }, 600);
    });

    // Resize
    window.addEventListener('resize', onWindowResize);

    // Controls listeners
    document.getElementById('btn-autorotate').addEventListener('click', function () {
      isAutoRotate = !isAutoRotate;
      controls.autoRotate = isAutoRotate;
      this.classList.toggle('active', isAutoRotate);
    });

    document.getElementById('btn-fullscreen').addEventListener('click', function () {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    });

    animate();
  }

  function loadRoomTexture(idx, onDone) {
    var room = ROOMS[idx];
    if (cachedTextures[room.id]) {
      applyTexture(cachedTextures[room.id], room);
      if (onDone) onDone();
      return;
    }

    textureLoader.load(room.img, function (texture) {
      texture.minFilter = THREE.LinearFilter;
      texture.generateMipmaps = false;
      cachedTextures[room.id] = texture;
      applyTexture(texture, room);
      if (onDone) onDone();
    });
  }

  function applyTexture(texture, room) {
    sphereMesh.material.map = texture;
    sphereMesh.material.needsUpdate = true;
    updateHUD(room);
    renderHotspots(room);
  }

  function switchRoom(idx) {
    if (idx === currentRoomIndex) return;
    currentRoomIndex = idx;

    // Update active button state
    document.querySelectorAll('.room-btn').forEach(function (b, i) {
      b.classList.toggle('active', i === idx);
    });

    // GSAP camera zoom choreography transition
    if (window.gsap) {
      gsap.to(camera, {
        fov: 40,
        duration: 0.35,
        ease: 'power2.in',
        onUpdate: function () { camera.updateProjectionMatrix(); },
        onComplete: function () {
          loadRoomTexture(idx, function () {
            gsap.to(camera, {
              fov: 70,
              duration: 0.5,
              ease: 'power2.out',
              onUpdate: function () { camera.updateProjectionMatrix(); }
            });
          });
        }
      });
    } else {
      loadRoomTexture(idx);
    }
  }

  function updateHUD(room) {
    document.getElementById('hud-tag').textContent = room.tag;
    document.getElementById('hud-title').textContent = room.name;
    document.getElementById('hud-sub').textContent = room.sub;
  }

  function renderHotspots(room) {
    hotspotContainer.innerHTML = '';
    if (!room.hotspots) return;

    room.hotspots.forEach(function (h) {
      var el = document.createElement('div');
      el.className = 'hotspot-beacon';
      el.innerHTML = '' +
        '<div class="beacon-pulse"></div>' +
        '<div class="beacon-core">&rarr;</div>' +
        '<div class="hotspot-tooltip">' + h.title + '</div>';

      el.addEventListener('click', function () {
        var targetIdx = ROOMS.findIndex(function (r) { return r.id === h.target; });
        if (targetIdx >= 0) switchRoom(targetIdx);
      });

      el.dataset.x = h.x;
      el.dataset.y = h.y;
      el.dataset.z = h.z;

      hotspotContainer.appendChild(el);
    });
  }

  function updateHotspotPositions() {
    var beacons = hotspotContainer.querySelectorAll('.hotspot-beacon');
    var halfW = window.innerWidth / 2;
    var halfH = window.innerHeight / 2;

    beacons.forEach(function (b) {
      var pos = new THREE.Vector3(
        parseFloat(b.dataset.x) * 400,
        parseFloat(b.dataset.y) * 400,
        parseFloat(b.dataset.z) * 400
      );

      // Check if in front of camera
      var clone = pos.clone();
      clone.project(camera);

      if (clone.z < 1) {
        var x = (clone.x * halfW) + halfW;
        var y = -(clone.y * halfH) + halfH;
        b.style.display = 'block';
        b.style.left = x + 'px';
        b.style.top = y + 'px';
      } else {
        b.style.display = 'none';
      }
    });
  }

  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  function animate() {
    requestAnimationFrame(animate);
    controls.update();

    // Update Radar needle orientation
    if (radarNeedle) {
      var heading = (controls.getAzimuthalAngle() * (180 / Math.PI)) % 360;
      radarNeedle.style.transform = 'translate(-50%,-100%) rotate(' + heading + 'deg)';
    }

    updateHotspotPositions();
    renderer.render(scene, camera);
  }

  // Initialize
  initThree();
  if (window.lucide) lucide.createIcons();
})();
</script>
</body>
</html>
