<!-- @dsCard group="Web App" viewport="1440x1024" name="Portal · Compounds" subtitle="Live Leaflet intelligence map — 29 New Cairo compounds, AI score & growth, theme-aware tiles" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<script>document.documentElement.classList.add('js');</script>
<title>Sierra Estates · Compounds</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="shared.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/lucide@0.294.0/dist/umd/lucide.min.js"></script>
<script src="data.js"></script>
<script src="shared.js"></script>
<link rel="stylesheet" href="compounds.css">
  <link rel="stylesheet" href="inline-extracted.css">
</head>
<body>

<div id="site-chrome"></div>

<header class="page-hero" data-screen-label="Compounds hero">
  <div class="wrap">
    <div class="crumbs"><a href="index.html" data-i18n="crumbHome" aria-label="Home" title="Home"></a><span class="sep">/</span><span data-i18n="navCpds"></span></div>
    <h1 data-i18n="cpdsTit"></h1>
    <p class="sub" data-i18n="cpdsSub"></p>
  </div>
</header>

<section class="block" data-screen-label="Intelligence map">
  <div class="wrap">
    <!-- ═══ ADVANCED FILTER BAR ═════════════════════════════════════════════
         Real-time filter controls. Every change instantly recalculates map
         badge counts + compound cards without page reload. Filters are
         preserved when opening the units sheet. -->
    <div class="af-bar rv" id="af-bar">
      <!-- Search -->
      <div class="af-search">
        <i data-lucide="search" class="i"></i>
        <input type="text" id="cpd-search" data-i18n-ph="searchCpdPh" aria-label="Search compounds" title="Search compounds" placeholder="Search compounds..."/>
        <button class="cs-clear extracted-style-206" id="cpd-search-clear" type="button" aria-label="Clear" >×</button>
      </div>

      <!-- Property Type -->
      <div class="af-group">
        <label class="af-label" data-i18n="afType">Type</label>
        <div class="af-chips" id="af-type">
          <button class="af-chip on" data-type="all" type="button">All</button>
          <button class="af-chip" data-type="Apartment" type="button">Apartment</button>
          <button class="af-chip" data-type="Villa" type="button">Villa</button>
          <button class="af-chip" data-type="Townhouse" type="button">Townhouse</button>
          <button class="af-chip" data-type="Twin House" type="button">Twin House</button>
        </div>
      </div>

      <!-- Bedrooms -->
      <div class="af-group">
        <label class="af-label" data-i18n="afBeds">Bedrooms</label>
        <div class="af-chips" id="af-beds">
          <button class="af-chip on" data-beds="0" type="button">Any</button>
          <button class="af-chip" data-beds="1" type="button">1+</button>
          <button class="af-chip" data-beds="2" type="button">2+</button>
          <button class="af-chip" data-beds="3" type="button">3+</button>
          <button class="af-chip" data-beds="4" type="button">4+</button>
          <button class="af-chip" data-beds="5" type="button">5+</button>
        </div>
      </div>

      <!-- Price Range -->
      <div class="af-group af-price-group">
        <label class="af-label" data-i18n="afPrice">Price (EGP M)</label>
        <div class="af-price">
          <input type="number" id="af-price-min" placeholder="Min" min="0" step="0.5" />
          <span class="af-price-sep">—</span>
          <input type="number" id="af-price-max" placeholder="Max" min="0" step="0.5" />
        </div>
      </div>

      <!-- Delivery Status -->
      <div class="af-group">
        <label class="af-label" data-i18n="afDelivery">Delivery</label>
        <div class="af-chips" id="af-delivery">
          <button class="af-chip on" data-delivery="all" type="button">Any</button>
          <button class="af-chip" data-delivery="ready" type="button">Ready to Move</button>
          <button class="af-chip" data-delivery="under_construction" type="button">Under Construction</button>
        </div>
      </div>

      <!-- Mode (sale/rent) -->
      <div class="af-group">
        <label class="af-label" data-i18n="afMode">Mode</label>
        <div class="af-seg" id="af-mode">
          <button class="on" data-m="all" type="button" data-i18n="modeAll" aria-label="All Modes" title="All Modes"></button>
          <button data-m="sale" type="button" data-i18n="modeSale" aria-label="Sale" title="Sale"></button>
          <button data-m="rent" type="button" data-i18n="modeRent" aria-label="Rent" title="Rent"></button>
        </div>
      </div>

      <!-- Clear all -->
      <button class="af-clear" id="af-clear" type="button">
        <i data-lucide="rotate-ccw" class="i extracted-style-207" ></i>
        <span>Clear</span>
      </button>

      <!-- Result count -->
      <div class="af-count" id="af-count">— units</div>
    </div>

    <!-- Zone chips (secondary filter) -->
    <div class="zone-chips" id="zone-chips"></div>

    <div class="map-shell rv">
      <div id="cpd-map"></div>
      <aside class="intel" id="intel">
        <div class="hint"><i data-lucide="mouse-pointer-click" class="i"></i><span data-i18n="mapHint"></span></div>
      </aside>
    </div>
    <div class="grid-cpds" id="cpd-cards"></div>
    <div class="cpd-empty extracted-style-208" id="cpd-empty"  data-i18n="noCpd"></div>
  </div>
</section>

<footer id="site-footer"></footer>

<!-- UNITS SHEET -->
<div class="sheet-overlay" id="sheet-ov">
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sh-head">
      <div>
        <h3 id="sh-title"></h3>
        <div class="sub" id="sh-sub"></div>
      </div>
      <button class="sh-close" id="sh-close" type="button" aria-label="Close"><i data-lucide="x" class="i"></i></button>
    </div>
    <div class="sh-filters">
      <div class="shf">
        <label for="shf-cpd" data-i18n="shCompound"></label>
        <select id="shf-cpd" aria-label="Select compound" title="Select compound"></select>
      </div>
      <div class="shf">
        <label for="shf-beds" data-i18n="shBeds"></label>
        <select id="shf-beds" aria-label="Select bedrooms" title="Select bedrooms">
          <option value="0" data-i18n="shAnyBeds"></option>
          <option value="2">2+</option><option value="3">3+</option>
          <option value="4">4+</option><option value="5">5+</option>
        </select>
      </div>
      <div class="shf-seg" id="shf-mode">
        <button class="on" data-m="all" type="button" data-i18n="modeAll" aria-label="All modes" title="All modes"></button>
        <button data-m="sale" type="button" data-i18n="modeSale" aria-label="For sale" title="For sale"></button>
        <button data-m="rent" type="button" data-i18n="modeRent" aria-label="For rent" title="For rent"></button>
      </div>
      <span class="shf-count" id="shf-count"></span>
    </div>
    <div class="sh-scroll">
      <table>
        <thead><tr id="sh-thead"></tr></thead>
        <tbody id="sh-tbody"></tbody>
      </table>
      <div class="sh-empty extracted-style-209" id="sh-empty"  data-i18n="shNoUnits"></div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var D = window.HZDATA;

  HZ.mount('cpds');

  /* map */
  var map = L.map('cpd-map', { scrollWheelZoom: false, zoomControl: true }).setView([30.03, 31.57], 11);
  var tiles = {
    light: 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
    dark: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
  };
  var layer = L.tileLayer(tiles[HZ.theme()], { attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 18 }).addTo(map);
  document.addEventListener('hzp:theme', function (e) {
    layer.setUrl(tiles[e.detail]);
  });

  /* Fix: Leaflet needs invalidateSize() after the container finishes laying out,
     otherwise tiles load incorrectly or the map appears clipped. Also re-invalidate
     on window resize so the map recalculates its dimensions. */
  setTimeout(function () { map.invalidateSize(); }, 200);
  setTimeout(function () { map.invalidateSize(); }, 800);
  window.addEventListener('resize', function () { map.invalidateSize(); });

  function unitPrice(u) {
    return u.mode === 'rent' ? '$' + u.usd.toLocaleString() + '/mo' : 'EGP ' + u.egpM.toFixed(1) + 'M';
  }

  /* excel-style units sheet — inherits ALL active filters from the main bar */
  var shState = { cpd: null, type: 'all', beds: 0, priceMin: null, priceMax: null, delivery: 'all', mode: 'all' };

  function renderSheet() {
    var c = shState.cpd;
    var all = D.unitsFor(c.n);
    var units = all.filter(function (u) {
      if (shState.type !== 'all' && u.type !== shState.type) return false;
      if (shState.beds && u.beds < shState.beds) return false;
      if (shState.priceMin !== null && u.mode === 'sale' && u.egpM < shState.priceMin) return false;
      if (shState.priceMax !== null && u.mode === 'sale' && u.egpM > shState.priceMax) return false;
      if (shState.delivery !== 'all' && u.delivery !== shState.delivery) return false;
      if (shState.mode !== 'all' && u.mode !== shState.mode) return false;
      return true;
    });
    document.getElementById('sh-title').textContent = HZ.t('unitsTit') + ' · ' + c.n;
    document.getElementById('sh-sub').textContent = all.length + ' ' + HZ.t('unitsWord') + ' — ' + HZ.t('unitsSub');
    document.getElementById('shf-count').textContent = HZ.t('shShowing') + ' ' + units.length + ' ' + HZ.t('shOf') + ' ' + all.length;
    document.getElementById('sh-thead').innerHTML = ['thCode', 'thType', 'thBeds', 'thBath', 'thArea', 'thFloor', 'thPrice', 'thAI', 'thDelivery', 'thStatus', ''].map(function (k) {
      return '<th>' + (k ? HZ.t(k) : '') + '</th>';
    }).join('');
    document.getElementById('sh-tbody').innerHTML = units.map(function (u) {
      var rs = u.status === 'reserved';
      var dl = u.delivery === 'ready' ? 'Ready' : 'U/C';
      return '<tr class="' + (rs ? 'reserved' : '') + '" data-u="' + u.code + '">' +
        '<td class="mono">' + u.code + '</td>' +
        '<td>' + u.type + '</td>' +
        '<td class="mono">' + u.beds + '</td>' +
        '<td class="mono">' + u.bath + '</td>' +
        '<td class="mono">' + u.area + ' m²</td>' +
        '<td class="mono">' + u.floor + '</td>' +
        '<td class="mono">' + unitPrice(u) + '</td>' +
        '<td class="mono">' + u.ai.toFixed(1) + '</td>' +
        '<td><span class="st ' + (u.delivery === 'ready' ? 'av' : 'rs') + '">' + dl + '</span></td>' +
        '<td><span class="st ' + (rs ? 'rs' : 'av') + '">' + HZ.t(rs ? 'stReserved' : 'stAvail') + '</span></td>' +
        '<td class="go">' + (rs ? '' : '<i data-lucide="arrow-right" class="i extracted-style-210" ></i>') + '</td></tr>';
    }).join('');
    var isEmpty = units.length === 0;
    document.getElementById('sh-empty').classList.toggle('is-hidden', !isEmpty);
    document.getElementById('sh-empty').classList.toggle('is-block', isEmpty);
    document.getElementById('sh-tbody').querySelectorAll('tr:not(.reserved)').forEach(function (tr) {
      tr.addEventListener('click', function () {
        location.href = 'property.html?cpd=' + encodeURIComponent(c.n) + '&u=' + encodeURIComponent(tr.getAttribute('data-u'));
      });
    });
    HZ.refreshIcons();
  }

  function openSheet(c) {
    // Inherit ALL active filters from the main filter bar (state preservation)
    shState.cpd = c;
    shState.type = uf.type;
    shState.beds = uf.beds;
    shState.priceMin = uf.priceMin;
    shState.priceMax = uf.priceMax;
    shState.delivery = uf.delivery;
    shState.mode = uf.mode;
    var sel = document.getElementById('shf-cpd');
    sel.innerHTML = D.compounds.slice().sort(function (a, b) { return a.n.localeCompare(b.n); })
      .map(function (x) { return '<option value="' + x.n.replace(/"/g, '') + '"' + (x.n === c.n ? ' selected' : '') + '>' + x.n + ' (' + D.unitsFor(x.n).length + ')</option>'; }).join('');
    document.getElementById('shf-beds').value = String(uf.beds);
    document.querySelectorAll('#shf-mode button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-m') === uf.mode); });
    renderSheet();
    document.getElementById('sheet-ov').classList.add('on');
    document.body.classList.add('no-scroll');
  }
  function closeSheet() {
    document.getElementById('sheet-ov').classList.remove('on');
    document.body.classList.remove('no-scroll');
  }
  document.getElementById('shf-cpd').addEventListener('change', function () {
    var val = this.value;
    var c = D.compounds.find(function (x) { return x.n === val; });
    if (c) { shState.cpd = c; renderSheet(); }
  });
  document.getElementById('shf-beds').addEventListener('change', function () { shState.beds = parseInt(this.value, 10); renderSheet(); });
  document.querySelectorAll('#shf-mode button').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('#shf-mode button').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on'); shState.mode = b.getAttribute('data-m'); renderSheet();
    });
  });
  document.getElementById('sh-close').addEventListener('click', closeSheet);
  document.getElementById('sheet-ov').addEventListener('click', function (e) { if (e.target === this) closeSheet(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

  function showIntel(c) {
    var el = document.getElementById('intel');
    var units = D.unitsFor(c.n);
    el.innerHTML =
      '<h3>' + c.n + '</h3>' +
      '<div class="zone">' + c.z + ' · New Cairo</div>' +
      '<div class="metric"><span>' + HZ.t('unitsAvail') + '</span><b class="link" id="intel-units">' + units.length + ' <i data-lucide="table-2" class="i extracted-style-211" ></i></b></div>' +
      '<div class="metric"><span>' + HZ.t('aiScore') + '</span><b>' + c.ai.toFixed(1) + ' / 10</b></div>' +
      '<div class="metric"><span>' + HZ.t('growth') + '</span><b class="up">' + c.g + '</b></div>' +
      '<div class="metric"><span>' + HZ.t('avg') + '</span><b>EGP ' + c.priceM + 'M</b></div>' +
      '<div class="metric"><span>' + HZ.t('rentAvg') + '</span><b>$' + c.rent.toLocaleString() + '/mo</b></div>' +
      '<button class="btn btn-pri" type="button" id="intel-open"><i data-lucide="table-2" class="i"></i> ' + HZ.t('unitsTit') + ' (' + units.length + ')</button>';
    el.querySelector('#intel-units').addEventListener('click', function () { openSheet(c); });
    el.querySelector('#intel-open').addEventListener('click', function () { openSheet(c); });
    HZ.refreshIcons();
  }

  /* nearest compounds to a tapped point */
  function haversine(a, b) {
    var R = 6371, dLat = (b[0] - a[0]) * Math.PI / 180, dLon = (b[1] - a[1]) * Math.PI / 180;
    var s = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(a[0] * Math.PI / 180) * Math.cos(b[0] * Math.PI / 180) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1 - s));
  }
  var pinMarker = null;
  function showNearest(latlng) {
    var pt = [latlng.lat, latlng.lng];
    if (pinMarker) map.removeLayer(pinMarker);
    pinMarker = L.marker(pt, {
      icon: L.divIcon({ className: '', html: '<span class="you-pin"><i></i></span>', iconSize: [22, 22], iconAnchor: [11, 11] })
    }).addTo(map);
    var near = D.compounds.map(function (c) { return { c: c, d: haversine(pt, c.c) }; })
      .sort(function (a, b) { return a.d - b.d; }).slice(0, 5);
    var el = document.getElementById('intel');
    el.innerHTML =
      '<div class="near-head"><h3>' + HZ.t('nearTit') + '</h3><button class="near-clear" id="near-clear" type="button">' + HZ.t('clearPin') + '</button></div>' +
      '<div class="zone">' + HZ.t('nearSub') + '</div>' +
      '<div class="near-list">' + near.map(function (o, i) {
        return '<button class="near-row" type="button" data-cpd="' + o.c.n + '">' +
          '<span class="near-rank">' + (i + 1) + '</span>' +
          '<span class="near-info"><b>' + o.c.n + '</b><small>' + o.c.z + ' · ' + D.unitsFor(o.c.n).length + ' ' + HZ.t('unitsWord') + '</small></span>' +
          '<span class="near-dist">' + o.d.toFixed(1) + '<i>' + HZ.t('kmAway') + '</i></span></button>';
      }).join('') + '</div>';
    el.querySelector('#near-clear').addEventListener('click', function () {
      if (pinMarker) { map.removeLayer(pinMarker); pinMarker = null; }
      el.innerHTML = '<div class="hint"><i data-lucide="mouse-pointer-click" class="i"></i><span data-i18n="mapHint">' + HZ.t('mapHint') + '</span></div>';
      HZ.refreshIcons();
    });
    el.querySelectorAll('.near-row').forEach(function (row) {
      row.addEventListener('click', function () {
        var c = D.compounds.find(function (x) { return x.n === row.getAttribute('data-cpd'); });
        openSheet(c);
      });
    });
  }
  map.on('click', function (e) { showNearest(e.latlng); });

  /* ═══ ADVANCED FILTER STATE ═════════════════════════════════════════════
     All filter state lives in one object. Every change triggers render()
     which instantly recalculates map badges + compound cards. The same
     state is passed to openSheet() so the units table inherits the exact
     same filters. */
  var uf = {
    type: 'all',        // 'all' | 'Apartment' | 'Villa' | 'Townhouse' | 'Twin House'
    beds: 0,            // 0 = any, 1+ = minimum bedrooms
    priceMin: null,     // null = no min, number = EGP millions
    priceMax: null,     // null = no max, number = EGP millions
    delivery: 'all',    // 'all' | 'ready' | 'under_construction'
    mode: 'all'         // 'all' | 'sale' | 'rent'
  };

  function unitsFiltered(c) {
    return D.unitsFor(c.n).filter(function (u) {
      // Type filter
      if (uf.type !== 'all' && u.type !== uf.type) return false;
      // Bedrooms filter (minimum)
      if (uf.beds && u.beds < uf.beds) return false;
      // Price filter (only applies to sale units — egpM is in millions)
      if (uf.priceMin !== null && u.mode === 'sale' && u.egpM < uf.priceMin) return false;
      if (uf.priceMax !== null && u.mode === 'sale' && u.egpM > uf.priceMax) return false;
      // Delivery status filter
      if (uf.delivery !== 'all' && u.delivery !== uf.delivery) return false;
      // Mode filter (sale/rent)
      if (uf.mode !== 'all' && u.mode !== uf.mode) return false;
      return true;
    });
  }

  var markers = {};
  D.compounds.forEach(function (c) {
    markers[c.n] = L.marker(c.c, { icon: markerIcon(c, D.unitsFor(c.n).length), title: c.n }).on('click', function () {
      showIntel(c);
      map.panTo(c.c, { animate: true });
      openSheet(c);
    });
  });
  function markerIcon(c, count, isZero) {
    var hot = c.ai >= 9.2;
    var cls = 'cpd-marker' + (hot ? ' hot' : '') + (isZero ? ' zero' : '');
    var curLang = (window.HZ && HZ.lang) ? HZ.lang() : 'en';
    var displayName = (D.compoundName) ? D.compoundName(c.n, curLang) : c.n;
    return L.divIcon({
      className: '',
      html: '<span class="' + cls + '" title="' + displayName + '">' + displayName + '</span>',
      iconSize: null
    });
  }

  /* filter state */
  var zones = ['5th Settlement', 'Katameya', 'New Cairo', 'Mostakbal', 'Madinaty', 'Shorouk'];
  var activeZones = new Set();
  var query = '';

  var zoneChips = document.getElementById('zone-chips');
  zoneChips.innerHTML = zones.map(function (z, i) {
    var n = D.compounds.filter(function (c) { return c.z === z; }).length;
    return '<button class="zchip" type="button" data-zone="' + z + '">' + HZ.t('z' + (i + 1)) + ' <span class="zc-n">' + n + '</span></button>';
  }).join('');
  zoneChips.querySelectorAll('.zchip').forEach(function (chip) {
    chip.addEventListener('click', function () {
      var z = chip.getAttribute('data-zone');
      if (activeZones.has(z)) { activeZones.delete(z); chip.classList.remove('on'); }
      else { activeZones.add(z); chip.classList.add('on'); }
      render();
    });
  });

  var searchInput = document.getElementById('cpd-search');
  var searchClear = document.getElementById('cpd-search-clear');
  searchInput.addEventListener('input', function () {
    query = this.value.trim().toLowerCase();
    searchClear.classList.toggle('is-hidden', !query);
    searchClear.classList.toggle('is-block', !!query);
    render();
  });
  searchClear.addEventListener('click', function () {
    searchInput.value = ''; query = ''; searchClear.classList.remove('is-block'); searchClear.classList.add('is-hidden'); render(); searchInput.focus();
  });
  document.getElementById('browse-map')?.addEventListener('click', function () {
    window.scrollTo({ top: document.getElementById('cpd-map').getBoundingClientRect().top + window.scrollY - 110, behavior: 'smooth' });
  });

  // ─── Advanced filter event listeners ────────────────────────────────────
  // Type chips
  document.querySelectorAll('#af-type .af-chip').forEach(function (chip) {
    chip.addEventListener('click', function () {
      document.querySelectorAll('#af-type .af-chip').forEach(function (x) { x.classList.remove('on'); });
      chip.classList.add('on');
      uf.type = chip.getAttribute('data-type');
      render();
    });
  });
  // Bedroom chips
  document.querySelectorAll('#af-beds .af-chip').forEach(function (chip) {
    chip.addEventListener('click', function () {
      document.querySelectorAll('#af-beds .af-chip').forEach(function (x) { x.classList.remove('on'); });
      chip.classList.add('on');
      uf.beds = parseInt(chip.getAttribute('data-beds'), 10);
      render();
    });
  });
  // Delivery chips
  document.querySelectorAll('#af-delivery .af-chip').forEach(function (chip) {
    chip.addEventListener('click', function () {
      document.querySelectorAll('#af-delivery .af-chip').forEach(function (x) { x.classList.remove('on'); });
      chip.classList.add('on');
      uf.delivery = chip.getAttribute('data-delivery');
      render();
    });
  });
  // Mode segmented
  document.querySelectorAll('#af-mode button').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('#af-mode button').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      uf.mode = b.getAttribute('data-m');
      render();
    });
  });
  // Price min/max (debounced)
  var priceTimer = null;
  function onPriceChange() {
    clearTimeout(priceTimer);
    priceTimer = setTimeout(function () {
      var min = document.getElementById('af-price-min').value;
      var max = document.getElementById('af-price-max').value;
      uf.priceMin = min === '' ? null : parseFloat(min);
      uf.priceMax = max === '' ? null : parseFloat(max);
      render();
    }, 200);
  }
  document.getElementById('af-price-min').addEventListener('input', onPriceChange);
  document.getElementById('af-price-max').addEventListener('input', onPriceChange);
  // Clear all
  document.getElementById('af-clear').addEventListener('click', function () {
    uf = { type: 'all', beds: 0, priceMin: null, priceMax: null, delivery: 'all', mode: 'all' };
    // Reset chip UI
    document.querySelectorAll('.af-chips').forEach(function (group) {
      group.querySelectorAll('.af-chip').forEach(function (c) { c.classList.remove('on'); });
      var first = group.querySelector('.af-chip:first-child');
      if (first) first.classList.add('on');
    });
    document.querySelectorAll('#af-mode button').forEach(function (b) { b.classList.remove('on'); });
    document.querySelector('#af-mode button[data-m="all"]').classList.add('on');
    document.getElementById('af-price-min').value = '';
    document.getElementById('af-price-max').value = '';
    render();
  });

  function matches(c) {
    if (activeZones.size && !activeZones.has(c.z)) return false;
    if (query && c.n.toLowerCase().indexOf(query) < 0 && c.z.toLowerCase().indexOf(query) < 0) return false;
    return true;
  }

  function render() {
    var list = D.compounds.filter(function (c) { return matches(c) && unitsFiltered(c).length > 0; })
      .sort(function (a, b) { return b.ai - a.ai; });
    var pts = [];
    var totalUnits = 0;
    D.compounds.forEach(function (c) {
      var n = unitsFiltered(c).length;
      totalUnits += n;
      if (matches(c)) {
        if (n > 0) {
          markers[c.n].setIcon(markerIcon(c, n, false));
          markers[c.n].addTo(map);
          pts.push(c.c);
        } else {
          // Zero-state: show grayed out marker with 0
          markers[c.n].setIcon(markerIcon(c, 0, true));
          markers[c.n].addTo(map);
        }
      } else {
        map.removeLayer(markers[c.n]);
      }
    });
    if (pts.length) { try { map.fitBounds(pts, { padding: [40, 40], maxZoom: 13 }); } catch (e) {} }
    // Update result count
    var countEl = document.getElementById('af-count');
    if (countEl) countEl.textContent = totalUnits + ' units';
    document.getElementById('cpd-cards').innerHTML = list.map(function (c, i) {
      return '<div class="cpd-card rv in d' + ((i % 3) + 1) + '" data-cpd="' + c.n + '">' +
        '<div class="zline">' + c.z + '</div>' +
        '<div class="top"><h4>' + c.n + '</h4><span class="ai-pill">AI ' + c.ai.toFixed(1) + '</span></div>' +
        '<div class="meta"><span>' + HZ.t('growth') + ' <b class="up">' + c.g + '</b></span>' +
        '<span>' + HZ.t('avg') + ' <b>EGP ' + c.priceM + 'M</b></span></div>' +
        '<span class="u-link" data-units="' + c.n + '"><i data-lucide="table-2" class="i extracted-style-212" ></i>' + unitsFiltered(c).length + ' ' + HZ.t('unitsWord') + '</span>' +
      '</div>';
    }).join('');
    var noResults = list.length === 0;
    document.getElementById('cpd-empty').classList.toggle('is-hidden', !noResults);
    document.getElementById('cpd-empty').classList.toggle('is-block', noResults);
    document.querySelectorAll('.u-link').forEach(function (l) {
      l.addEventListener('click', function (e) {
        e.stopPropagation();
        openSheet(D.compounds.find(function (x) { return x.n === l.getAttribute('data-units'); }));
      });
    });
    document.querySelectorAll('.cpd-card').forEach(function (card) {
      card.addEventListener('click', function () {
        var c = D.compounds.find(function (x) { return x.n === card.getAttribute('data-cpd'); });
        showIntel(c);
        map.setView(c.c, 13, { animate: true });
        window.scrollTo({ top: document.getElementById('cpd-map').getBoundingClientRect().top + window.scrollY - 120, behavior: 'smooth' });
      });
    });
    HZ.refreshIcons();
  }

  render();

  // ═══ Auto-open units sheet if ?cpd=<name> is in the URL ═══
  // Called from the home page map — clicking a compound marker navigates
  // here with the compound name, and we auto-open its units sheet.
  try {
    var params = new URLSearchParams(location.search);
    var cpdName = params.get('cpd');
    if (cpdName) {
      var c = D.compounds.find(function (x) { return x.n === cpdName; });
      if (c) {
        setTimeout(function () {
          showIntel(c);
          map.setView(c.c, 13, { animate: true });
          openSheet(c);
        }, 600);
      }
    }
  } catch (e) {}
})();
</script>
</body>
</html>
