<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sierra Estates · Live Broker Inventory Map Station (New Cairo)</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  
  <!-- Leaflet 1.9.4 CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg: #030712;
      --card-bg: rgba(15, 23, 42, 0.88);
      --card-border: rgba(212, 175, 55, 0.25);
      --gold: #d4af37;
      --gold-light: #fef08a;
      --cyan: #06b6d4;
      --emerald: #10b981;
      --rose: #f43f5e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text-main);
    }
    #map {
      width: 100%;
      height: 100%;
      background: #060b13;
      z-index: 1;
    }

    /* Top Live Radar Ticker */
    .radar-bar {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 1000;
      background: rgba(11, 19, 38, 0.88);
      backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      gap: 16px;
      flex-wrap: wrap;
    }
    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-badge {
      background: linear-gradient(135deg, var(--gold), #856404);
      color: #000;
      font-weight: 900;
      font-size: 14px;
      padding: 6px 10px;
      border-radius: 6px;
      letter-spacing: 1px;
    }
    .radar-title {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
    }
    .radar-pulse {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      color: var(--emerald);
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      padding: 3px 8px;
      border-radius: 12px;
      margin-left: 8px;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 10px var(--emerald);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0% { transform: scale(0.9); opacity: 0.7; } 50% { transform: scale(1.3); opacity: 1; } 100% { transform: scale(0.9); opacity: 0.7; } }

    .stats-chips {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .chip {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .chip b {
      color: var(--gold-light);
      font-family: 'JetBrains Mono', monospace;
    }

    .btn-action {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid var(--gold);
      color: var(--gold-light);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-action:hover {
      background: var(--gold);
      color: #000;
      transform: translateY(-1px);
    }

    /* Live Ingestion Alert Card (Toast) */
    .alert-toast {
      position: absolute;
      top: 90px;
      right: 20px;
      z-index: 1001;
      width: 360px;
      background: linear-gradient(145deg, rgba(17, 24, 39, 0.95), rgba(9, 13, 22, 0.98));
      backdrop-filter: blur(16px);
      border: 2px solid var(--gold);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 25px rgba(212, 175, 55, 0.3);
      display: none;
      transform: translateX(400px);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .alert-toast.visible {
      display: block;
      transform: translateX(0);
    }
    .alert-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .alert-tag {
      font-size: 11px;
      font-weight: 800;
      background: rgba(212, 175, 55, 0.2);
      color: var(--gold-light);
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .alert-time {
      font-size: 11px;
      color: var(--text-muted);
    }
    .alert-compound {
      font-size: 16px;
      font-weight: 800;
      color: #fff;
    }
    .alert-price {
      font-size: 15px;
      font-weight: 800;
      color: var(--emerald);
      margin: 4px 0;
      font-family: 'JetBrains Mono', monospace;
    }
    .alert-details {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .alert-btn {
      width: 100%;
      background: var(--gold);
      color: #000;
      font-weight: 800;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }

    /* Leaflet Marker Pulsing Animation */
    .pulsing-marker {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--gold);
      border: 3px solid #fff;
      box-shadow: 0 0 15px var(--gold);
      position: relative;
    }
    .pulsing-marker::after {
      content: '';
      position: absolute;
      top: -12px;
      left: -12px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      animation: ripple 1.6s ease-out infinite;
    }
    @keyframes ripple {
      0% { transform: scale(0.5); opacity: 1; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    /* Popup Styling */
    .leaflet-popup-content-wrapper {
      background: rgba(11, 19, 38, 0.95) !important;
      color: #fff !important;
      border: 1px solid var(--card-border) !important;
      backdrop-filter: blur(12px) !important;
      border-radius: 12px !important;
      padding: 6px !important;
    }
    .leaflet-popup-tip {
      background: rgba(11, 19, 38, 0.95) !important;
    }
    .popup-box {
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding: 6px;
    }
    .popup-badge {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      background: rgba(6, 182, 212, 0.2);
      color: var(--cyan);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .popup-compound {
      font-size: 15px;
      font-weight: 800;
      margin-top: 4px;
      color: #fff;
    }
    .popup-price {
      font-size: 14px;
      font-weight: 800;
      color: var(--emerald);
      margin: 4px 0;
      font-family: 'JetBrains Mono', monospace;
    }
    .popup-meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .wa-chat-btn {
      display: inline-block;
      background: #25d366;
      color: #000;
      font-weight: 800;
      text-decoration: none;
      font-size: 11px;
      padding: 6px 12px;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <!-- Top Live Radar Bar -->
  <div class="radar-bar">
    <div class="brand-group">
      <div class="brand-badge">SIERRA</div>
      <div>
        <div class="radar-title">New Cairo Broker RAG Station</div>
        <div style="font-size: 11px; color: var(--text-muted);">Real-Time WhatsApp Ingestion · Master Inventory Map</div>
      </div>
      <div class="radar-pulse">
        <span class="pulse-dot"></span>
        <span>8 LINES ACTIVE</span>
      </div>
    </div>

    <div class="stats-chips">
      <div class="chip">Harvested Deals: <b id="stat-harvested">0</b></div>
      <div class="chip">Brokers Pinned: <b id="stat-brokers">0</b></div>
      <div class="chip">Active Zone: <b>New Cairo</b></div>
      <button class="btn-action" onclick="simulateDrop()">⚡ Test Ingestion Alert</button>
    </div>
  </div>

  <!-- Real-Time Notification Toast -->
  <div class="alert-toast" id="live-alert">
    <div class="alert-header">
      <div class="alert-tag">🔥 FRESH WHATSAPP DROP</div>
      <div class="alert-time" id="alert-time">Just now</div>
    </div>
    <div class="alert-compound" id="alert-title">3BR Villa in Hyde Park</div>
    <div class="alert-price" id="alert-price">18,500,000 EGP</div>
    <div class="alert-details" id="alert-details">Captured on Line #1 from New Cairo Brokers VIP · Geocoded & Pinned</div>
    <button class="alert-btn" id="alert-btn">Fly to Location 📍</button>
  </div>

  <!-- Map Container -->
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Initialize Leaflet Map over New Cairo
    const map = L.map('map', {
      center: [30.025, 31.54],
      zoom: 12,
      zoomControl: false
    });

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Dark Matter Tiles
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; CARTO &copy; OpenStreetMap contributors',
      maxZoom: 19
    }).addTo(map);

    const markersGroup = L.featureGroup().addTo(map);
    const markersMap = new Map();

    // Custom Icon for Fresh Deals
    function createPulsingIcon() {
      return L.divIcon({
        className: 'custom-pulse-marker',
        html: '<div class="pulsing-marker"></div>',
        iconSize: [20, 20],
        iconAnchor: [10, 10]
      });
    }

    // Connect to Gateway SSE Stream
    function connectSse() {
      const source = new EventSource('/api/harvester/stream');

      source.addEventListener('NEW_UNIT', (event) => {
        try {
          const payload = JSON.parse(event.data);
          handleNewUnit(payload.unit, payload.stats);
        } catch (e) {
          console.error('Error parsing SSE data:', e);
        }
      });

      source.onerror = () => {
        console.warn('SSE disconnected. Reconnecting in 5s...');
        source.close();
        setTimeout(connectSse, 5000);
      };
    }

    // Load initial recent units
    async function loadRecentUnits() {
      try {
        const res = await fetch('/api/harvester/recent');
        if (!res.ok) return;
        const units = await res.json();
        units.forEach(u => addUnitMarker(u, false));
        updateStats();
      } catch (_) {}
    }

    async function updateStats() {
      try {
        const res = await fetch('/api/harvester/stats');
        if (!res.ok) return;
        const s = await res.json();
        document.getElementById('stat-harvested').textContent = s.unitsHarvested || markersMap.size;
        document.getElementById('stat-brokers').textContent = s.activeBrokersCount || markersMap.size;
      } catch (_) {}
    }

    function addUnitMarker(unit, isLive = false) {
      if (!unit.lat || !unit.lng) return;

      const marker = L.marker([unit.lat, unit.lng], { icon: createPulsingIcon() });
      const waLink = unit.brokerPhone ? `https://wa.me/${unit.brokerPhone}?text=${encodeURIComponent('Hello, inquiring about ' + unit.compound + ' ' + unit.unitType)}` : '#';

      const popupHtml = `
        <div class="popup-box">
          <span class="popup-badge">${unit.dealType} · ${unit.capturedByLine || 'Line'}</span>
          <div class="popup-compound">${unit.compound} (${unit.zone || 'New Cairo'})</div>
          <div class="popup-price">${unit.priceText || unit.priceEgp?.toLocaleString() + ' EGP'}</div>
          <div class="popup-meta">
            ${unit.areaSqm ? unit.areaSqm + ' m² · ' : ''}
            ${unit.bedrooms ? unit.bedrooms + ' Bedrooms · ' : ''}
            ${unit.unitType}
          </div>
          ${unit.brokerPhone ? `<a href="${waLink}" target="_blank" class="wa-chat-btn">💬 Chat with Broker (+${unit.brokerPhone})</a>` : ''}
        </div>
      `;

      marker.bindPopup(popupHtml);
      markersGroup.addLayer(marker);
      markersMap.set(unit.id, { marker, unit });

      if (isLive) {
        map.flyTo([unit.lat, unit.lng], 15, { duration: 1.2 });
        setTimeout(() => marker.openPopup(), 1300);
      }
    }

    // Handle Live Unit Drop & Show Alert Toast
    function handleNewUnit(unit, stats) {
      addUnitMarker(unit, true);

      // Trigger Alert Toast
      const toast = document.getElementById('live-alert');
      document.getElementById('alert-title').textContent = `${unit.unitType} in ${unit.compound}`;
      document.getElementById('alert-price').textContent = unit.priceText || `${unit.priceEgp?.toLocaleString()} EGP`;
      document.getElementById('alert-details').textContent = `Just captured on ${unit.capturedByLine} · ${unit.areaSqm ? unit.areaSqm + 'm² · ' : ''}Broker: +${unit.brokerPhone || 'Direct'}`;
      document.getElementById('alert-time').textContent = new Date().toLocaleTimeString();

      document.getElementById('alert-btn').onclick = () => {
        map.flyTo([unit.lat, unit.lng], 16, { duration: 1 });
        const m = markersMap.get(unit.id);
        if (m) m.marker.openPopup();
      };

      toast.classList.add('visible');
      setTimeout(() => {
        toast.classList.remove('visible');
      }, 7000);

      if (stats) {
        document.getElementById('stat-harvested').textContent = stats.unitsHarvested;
        document.getElementById('stat-brokers').textContent = stats.activeBrokersCount;
      }
    }

    // Simulate Drop (Test button)
    async function simulateDrop() {
      try {
        await fetch('/api/harvester/simulate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
      } catch (err) {
        alert('Simulation failed: ' + err.message);
      }
    }

    loadRecentUnits();
    connectSse();
  </script>
</body>
</html>
